// ── Escalation on checklist submit ──
function _processEscalations(checklistId, date, responses){
  // responses: array of {questionId, response, numericValue}
  const c=clById(checklistId);if(!c)return;
  const u=me();
  (responses||[]).forEach(resp=>{
    const q=(DB.questions||[]).find(x=>x.id===resp.questionId);if(!q)return;
    let escalateTo=null;
    if(q.type==='answer'){
      const opt=(q.options||[]).find(o=>o.text===resp.response);
      if(opt)escalateTo=opt.escalateTo||null;
    }else if(q.type==='number'){
      const val=parseFloat(resp.response);
      for(const cond of (q.options||[])){
        let match=false;
        if(cond.condition==='lt')match=val<cond.value;
        else if(cond.condition==='lte')match=val<=cond.value;
        else if(cond.condition==='gt')match=val>cond.value;
        else if(cond.condition==='gte')match=val>=cond.value;
        else if(cond.condition==='eq')match=val===cond.value;
        else if(cond.condition==='neq')match=val!==cond.value;
        else if(cond.condition==='between')match=val>=cond.value&&val<=cond.value2;
        if(match){escalateTo=cond.escalateTo||null;break;}
      }
    }else{
      // passfail, yesno, tick — match by label
      const opt=(q.options||[]).find(o=>(o.label||'').toLowerCase()===String(resp.response).toLowerCase());
      if(opt)escalateTo=opt.escalateTo||null;
    }
    if(escalateTo&&escalateTo!==S.uid){
      if(!DB.notifications)DB.notifications=[];
      DB.notifications.unshift({
        id:uid('n'),userId:escalateTo,
        text:`⚠️ Escalation: "${esc(q.text)}" answered "${esc(String(resp.response))}" by ${esc(fullName(u))} on ${c.name} (${date})`,
        time:new Date().toISOString(),read:false
      });
      _invalidateNotifCache();
    }
  });
}


App._exportCSV=()=>{
  let subs=DB.submissions;if(!isAdmin())subs=subs.filter(s=>subTree(S.uid).some(u=>u.id===s.userId)||s.userId===S.uid);
  const f=S.filters;const fArr=k=>Array.isArray(f[k])?f[k]:(f[k]?[f[k]]:[]);
  if(fArr('users').length)subs=subs.filter(s=>fArr('users').includes(s.userId));
  if(fArr('deps').length)subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('deps').includes(c?.department);});
  if(fArr('locs').length)subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('locs').some(l=>(c?.locationIds||[]).includes(l));});
  if(fArr('stats').length)subs=subs.filter(s=>fArr('stats').includes(s.status));
  if(f.dr1)subs=subs.filter(s=>s.date>=f.dr1);if(f.dr2)subs=subs.filter(s=>s.date<=f.dr2);
  const summaryRows=[['#','User','Email','Phone','Department','Position','Checklist','Dept','Location(s)','Date','Status','Submitted At','Edit Count','Pending Approval']];
  subs.forEach((s,i)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u||!c)return;const locs=(c.locationIds||[]).map(id=>DB.locations.find(l=>l.id===id)?.name||'').join('; ');const rt=s.tasks||[];summaryRows.push([i+1,fullName(u),u.email||'',u.phone||'',u.department||'',u.position||'',c.name,c.department||'',locs,s.date,s.status,s.submittedAt?new Date(s.submittedAt).toLocaleString('en-GB'):'',s.editCount||0,s.status==='Pending Approval'?'Yes':'No']);});
  const taskRows=[['Sub #','User','Email','Checklist','Date','Status','Task #','Task Name','Criticality','Type','Response','Done','Photo','Comment']];
  subs.forEach((s,si)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u||!c)return;(c.tasks||[]).forEach((t,ti)=>{const rt=(s.tasks||[])[ti]||{};taskRows.push([si+1,fullName(u),u.email||'',c.name,s.date,s.status,ti+1,t.name||'',t.criticality||'Low',t.responseType||'tick',rt.response!==null&&rt.response!==undefined?String(rt.response):'',(rt.response!==null&&rt.response!==undefined?'Yes':'No'),rt.photo?'Yes':'No',rt.comment||'']);});});
  const all=[...summaryRows,[],['=== TASK DETAIL (one row per task) ==='],[],...taskRows];
  const csv=all.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='shiftly_export_'+todayISO()+'.csv';a.click();
  toast('Exported '+subs.length+' submissions ('+(taskRows.length-1)+' task rows)');
};
