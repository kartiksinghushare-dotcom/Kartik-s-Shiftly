App._togExpandQ=(id)=>{S.filters.expandedQ=S.filters.expandedQ===id?null:id;rr();};

App._delQuestion=(id)=>{
  const q=(DB.questions||[]).find(x=>x.id===id);if(!q)return;
  if(!confirm('Delete "'+q.text+'"?'))return;
  if(!DB.questions_deleted)DB.questions_deleted=[];
  if(!DB.questions_deleted.includes(id))DB.questions_deleted.push(id);
  DB.questions=(DB.questions||[]).filter(x=>x.id!==id);
  DB.checklists.forEach(c=>{c.questionIds=(c.questionIds||[]).filter(x=>x!==id);if(c.questionConfigs)delete c.questionConfigs[id];});
  toast('Deleted','warn');saveDB();render();
  // Sync to Supabase in background
  sb.from('questions').delete().eq('id',id).then(({error})=>{
    if(error)console.error('delQuestion sync:',error.message);
  }).catch(e=>console.error('delQuestion:',e));
};

App._editQuestion=(id)=>{
  const existing=id?(DB.questions||[]).find(x=>x.id===id):null;
  _QED=existing?JSON.parse(JSON.stringify(existing)):{
    id:uid('q'),text:'',type:'answer',options:[],photo:false,approval:false,comment:false
  };
  App._renderQModal();
};

App._saveQuestion=()=>{
  if(!_QED)return;
  const textEl=document.getElementById('qed-text');
  if(textEl)_QED.text=textEl.value.trim();
  const text=(_QED.text||'').trim();
  if(!text){toast('Question text is required','err');const qb=document.getElementById('q-save-btn');if(qb){qb.disabled=false;qb.textContent=_QED?.createdAt?'Save changes':'Create question';}return;}
  if(_QED.type==='answer'){
    _QED.options=(_QED.options||[]).filter(o=>(o.text||'').trim());
    if(!_QED.options.length){toast('Add at least one answer option','err');const qb=document.getElementById('q-save-btn');if(qb){qb.disabled=false;qb.textContent=_QED?.createdAt?'Save changes':'Create question';}return;}
  }
  if(_QED.type==='number'&&!(_QED.options||[]).length){toast('Add at least one condition','err');const qb=document.getElementById('q-save-btn');if(qb){qb.disabled=false;qb.textContent=_QED?.createdAt?'Save changes':'Create question';}return;}
  if(!DB.questions)DB.questions=[];
  const existIdx=DB.questions.findIndex(x=>x.id===_QED.id);
  const isNew=existIdx===-1;
  if(!isNew){DB.questions[existIdx]=_QED;}
  else{_QED.createdBy=S.uid;_QED.createdAt=new Date().toISOString();DB.questions.push(_QED);}
  // ── Save locally and close IMMEDIATELY ──
  toast(isNew?'Question created ✓':'Saved ✓');
  closeModal();
  const savedQ=_QED;_QED=null;
  saveDB();
  render();
  // ── Sync to Supabase in background ──
  const qRow={id:savedQ.id,text:savedQ.text||'',type:savedQ.type||'answer',options:savedQ.options||[],photo:savedQ.photo||false,approval:savedQ.approval||false,comment:savedQ.comment||false,created_by:savedQ.createdBy||null,created_at:savedQ.createdAt||new Date().toISOString()};
  sb.from('questions').upsert(qRow,{onConflict:'id'}).then(({error})=>{
    if(error){console.error('Question sync error:',error.message);toast('⚠ Question saved locally but not synced: '+error.message.slice(0,60),'warn');}
  }).catch(e=>console.error('Question sync:',e));
};

// Read all checklist modal form values into CLD (prevents data loss on re-render)
function _snapshotCLD(){
  if(!CLD)return;
  // Only read fields that actually exist in DOM right now
  const el=id=>document.getElementById(id);
  if(el('cn-name'))CLD.name=el('cn-name').value.trim()||CLD.name;
  if(el('cn-desc'))CLD.description=el('cn-desc').value.trim();
  if(el('cn-status')&&el('cn-status').value)CLD.status=el('cn-status').value;
  if(el('cn-dep')&&el('cn-dep').value)CLD.department=el('cn-dep').value;
  if(el('cn-freq')&&el('cn-freq').value)CLD.frequency=el('cn-freq').value;
  if(el('cn-sd'))CLD.startDate=el('cn-sd').value||null;
  if(el('cn-ed'))CLD.endDate=el('cn-ed').value||null;
  if(el('cn-time'))CLD.scheduleTime=el('cn-time').value||null;
}


App._confirmClQs=()=>{
  if(!CLD||!App._clQSel)return;
  // Snapshot all current form values before re-rendering (prevents data loss)
  _snapshotCLD();
  // Preserve existing order, then add new ones at end
  const existing=CLD.questionIds||[];
  const newIds=[...App._clQSel];
  // Keep existing order for already-selected, add new ones at end
  CLD.questionIds=[...existing.filter(id=>newIds.includes(id)),...newIds.filter(id=>!existing.includes(id))];
  CLD.questionConfigs=CLD.questionConfigs||{};
  // Remove configs for deselected questions
  Object.keys(CLD.questionConfigs).forEach(qid=>{
    if(!App._clQSel.has(qid))delete CLD.questionConfigs[qid];
  });
  closeModal();
  _renderClModal(!!(DB.checklists.find(c=>c.id===CLD.id)));
};

App._removeClQuestion=(qid)=>{
  if(!CLD)return;
  _snapshotCLD();
  CLD.questionIds=(CLD.questionIds||[]).filter(x=>x!==qid);
  if(CLD.questionConfigs)delete CLD.questionConfigs[qid];
  _renderClModal(!!(DB.checklists.find(c=>c.id===CLD.id)));
};

App._editClQuestionEscalation=(qid)=>{
  if(!CLD)return;

// ── Escalation on submit ──
function _processEscalations(checklistId,date,responses){
  const c=clById(checklistId);if(!c)return;
  const u=me();
  const configs=c.questionConfigs||{};
  (responses||[]).forEach(resp=>{
    const q=(DB.questions||[]).find(x=>x.id===resp.questionId);if(!q)return;
    const qCfg=configs[resp.questionId]||{};
    let escalateTo=null;
    // Find which option index matched the response
    if(q.type==='answer'){
      const _respStr=String(resp.response||'').trim();const optIdx=(q.options||[]).findIndex(o=>String(o.text||'').trim()===_respStr);
      if(optIdx>-1)escalateTo=qCfg['opt_'+optIdx]||null;
    } else if(q.type==='number'){
      const val=parseFloat(resp.response);
      for(let i=0;i<(q.options||[]).length;i++){
        const cond=q.options[i];
        let m=false;
        if(cond.condition==='lt')m=val<cond.value;
        else if(cond.condition==='lte')m=val<=cond.value;
        else if(cond.condition==='gt')m=val>cond.value;
        else if(cond.condition==='gte')m=val>=cond.value;
        else if(cond.condition==='eq')m=val===cond.value;
        else if(cond.condition==='neq')m=val!==cond.value;
        else if(cond.condition==='between')m=val>=cond.value&&val<=(cond.value2||cond.value);
        if(m){escalateTo=qCfg['opt_'+i]||null;break;}
      }
    } else {
      // passfail, yesno, tick — match by label index
      const labels={passfail:['Pass','Fail'],yesno:['Yes','No'],tick:['Done','Not done']};
      const lbs=labels[q.type]||[];
      const optIdx=lbs.findIndex(l=>l.toLowerCase()===String(resp.response||'').trim().toLowerCase());
      if(optIdx>-1)escalateTo=qCfg['opt_'+optIdx]||null;
    }
    if(escalateTo&&escalateTo!==S.uid){
      if(!DB.notifications)DB.notifications=[];
      if(!DB.tickets)DB.tickets=[];
      const escMsg='⚠️ Escalation: "'+q.text+'" answered "'+String(resp.response||'')+'" by '+fullName(u)+' on '+c.name+' ('+date+')';
      // Determine priority from question or response
      const _respLower=String(resp.response||'').toLowerCase();
      const ticketPriority=_respLower==='fail'||_respLower==='not done'||_respLower==='no'?'High':'Medium';
      // Create ticket
      const ticket={
        id:uid('tk'),
        title:q.text.slice(0,80),
        description:'Answer: "'+String(resp.response||'')+'"\nSubmitted by: '+fullName(u)+'\nChecklist: '+c.name+'\nDate: '+date,
        priority:ticketPriority,
        status:'Open',
        assignedTo:escalateTo,
        createdBy:S.uid,
        checklistId:checklistId,
        questionId:q.id,
        questionText:q.text,
        answerGiven:String(resp.response||''),
        submitterId:S.uid,
        date:date,
        createdAt:new Date().toISOString(),
        resolvedAt:null,
        resolveNote:'',
        viewedBy:[]
      };
      DB.tickets.unshift(ticket);
      // In-app notification to assignee
      DB.notifications.unshift({id:uid('n'),userId:escalateTo,text:escMsg,time:new Date().toISOString(),read:false,type:'escalation'});
      // In-app notification to admin
      const adminU=DB.users.find(x=>x.role==='Admin');
      if(adminU&&adminU.id!==escalateTo&&adminU.id!==S.uid){
        DB.notifications.unshift({id:uid('n'),userId:adminU.id,text:escMsg,time:new Date().toISOString(),read:false,type:'escalation'});
      }
      // Email the escalation target
      queueEmail('escalation',escalateTo,null,date,{checklist_name:c.name,question:q.text,answer:String(resp.response||''),submitter:fullName(u)});
      _invalidateNotifCache();
    }
  });
}

function notificationsPage(){
  const uid=S.uid;
  const notifs=DB.notifications.filter(n=>n.userId===uid).sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,80);
  // Track which were unread BEFORE marking them (so the dot shows on this render)
  const unreadIds=new Set(notifs.filter(n=>!n.read).map(n=>n.id));
  const hadUnread=unreadIds.size>0;
  // Mark as read after a short delay so user can see what was unread
  if(hadUnread){
    setTimeout(()=>{
      notifs.forEach(n=>n.read=true);
      _invalidateNotifCache();
      saveDB();
    },1500);
  }
  // Feedback for this user
  const myFb=DB.feedback.filter(fb=>fb.userId===uid).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const unackFb=myFb.filter(fb=>!fb.acknowledged);

  const tab=S.filters.ntab||'All';
  const TABS=['All','Approvals','Escalations','Feedback'];

  function notifType(text){
    if(!text)return'general';
    if(text.includes('💬')||text.includes('replied')||text.includes('reply'))return'feedback';
    if(text.includes('Feedback')||text.includes('feedback'))return'feedback';
    
    if(text.includes('Escalation')||text.includes('escalation'))return'escalation';
    if(text.includes('Approved')||text.includes('approved'))return'approval';
    if(text.includes('Rejected')||text.includes('rejected'))return'approval';
    if(text.includes('pproval')||text.includes('pprove'))return'approval';
    if(text.includes('Edit')||text.includes('edit request')||text.includes('resubmit'))return'edit';
    if(text.includes('Re-submitted')||text.includes('Resubmit'))return'edit';
    if(text.includes('overdue')||text.includes('Late')||text.includes('late'))return'late';
    return'general';
  }
  const TYPE_CLR={approval:'#8B5CF6',edit:'#0EA5E9',escalation:'#F97316',feedback:'#3B82F6',late:'#EF4444',general:'#6B7280'};
  const TYPE_BG={approval:'#EDE9FE',edit:'#E0F2FE',escalation:'#FFF7ED',feedback:'#EFF6FF',late:'#FEF2F2',general:'#F6F7F8'};
  const TYPE_ICON={approval:'approve',edit:'edit',escalation:'alert',feedback:'msg',late:'clock',general:'bell'};

  const filteredNotifs=tab==='All'?notifs
    :tab==='Approvals'?notifs.filter(n=>['approval','edit'].includes(notifType(n.text)))
    :tab==='Feedback'?notifs.filter(n=>notifType(n.text)==='feedback')
    :tab==='Escalations'?notifs.filter(n=>notifType(n.text)==='escalation')
    :notifs;

  const counts={
    All:notifs.length,
    Approvals:notifs.filter(n=>['approval','edit'].includes(notifType(n.text))).length,
    Escalations:notifs.filter(n=>notifType(n.text)==='escalation').length,
    Feedback:notifs.filter(n=>notifType(n.text)==='feedback').length+myFb.filter(fb=>!fb.acknowledged).length,

  };

  return '<div class="fade">'+hdr('Notifications','')
    // Tabs
    +'<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">'
    +TABS.map(t=>{
      const active=tab===t;
      const badge=counts[t]?(' <span style="font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;background:'+(active?'rgba(255,255,255,0.25)':'#F3F4F6')+';color:'+(active?'#fff':'#6B7280')+'">'+counts[t]+'</span>'):'';
      return '<button onclick="App._setNTab(this.dataset.t)" data-t="'+t+'" style="padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:'+(active?'#15171C':'transparent')+';color:'+(active?'#fff':'#6B7280')+'">'+t+badge+'</button>';
    }).join('')
    +'</div>'
    // Feedback section (when tab=Feedback)
    +(tab==='Feedback'
      ? _feedbackTabContent(uid)
      // Notification timeline for other tabs
      : (filteredNotifs.length
        ? '<div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden">'
          +'<div style="display:flex;flex-direction:column">'
          +filteredNotifs.map((n,idx)=>{
              const type=notifType(n.text);
              const clr=TYPE_CLR[type];const bg=TYPE_BG[type];const ico=TYPE_ICON[type];
              const isNew=unreadIds.has(n.id);
              // Parse deep-link target from notification text
              return '<div style="display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid #F9F8F5;cursor:pointer;'+(isNew?'background:#FAFFFE':'background:#fff')+'" onclick="App._notifClick(this.dataset.id)" data-id="'+n.id+'">'
                +'<div style="width:36px;height:36px;border-radius:10px;background:'+bg+';display:grid;place-items:center;flex-shrink:0;margin-top:1px">'+ic(ico,'w-4 h-4 text-['+clr+']')+'</div>'
                +'<div style="flex:1;min-width:0">'
                +'<p style="font-size:13px;color:#111110;margin:0;line-height:1.5;font-weight:'+(isNew?'600':'400')+'">'+esc(n.text)+'</p>'
                +'<p style="font-size:11px;color:#B8B5AC;margin-top:3px">'+(n.time?new Date(n.time).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+' · '+type.charAt(0).toUpperCase()+type.slice(1)+'</p>'
                +'</div>'
                +(isNew?'<div style="width:7px;height:7px;border-radius:50%;background:#0E9F6E;flex-shrink:0;margin-top:6px"></div>':'')
                +'</div>';
            }).join('')
          +'</div></div>'
        : empty('bell','All clear','No notifications yet.')
      )
    )
    +'</div>';
}
App._setNTab=(t)=>{S.filters.ntab=t;rr();};
App._notifClick=(id)=>{
  const n=DB.notifications.find(x=>x.id===id);if(!n)return;
  n.read=true;_invalidateNotifCache();saveDB();
  const t=n.text||'';
  // Navigate first with clean filters, then set the tab
  if(t.includes('💬')||t.includes('replied')||t.includes('Feedback')){
    App._goNotifFeedback();return;
  }

  if(t.includes('approved')||t.includes('Approved')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Approved'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('rejected')||t.includes('Rejected')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Rejected'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('approval')||t.includes('Pending')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Pending'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('submitted')||t.includes('resubmit')||t.includes('Re-submitted')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Pending'};render();window.scrollTo(0,0);return;
  }
  // Escalation/ticket notification → go to tickets page
  if(t.includes('Escalation')||t.includes('escalation')){
    App.go('tickets');return;
  }
  // Checklist removed → go to my checklists
  if(t.includes('Checklist removed')||t.includes('no longer assigned')){
    App.go('mychecklists');return;
  }
  // Default: go to notifications
  App._setNTab('All');App.go('notifications');
};

          (isAdmin()&&(t.status==='Resolved'||t.status==='Closed')?`<button onclick="App._tkSetStatus(this)" data-id="${t.id}" data-st="Open" style="padding:5px 12px;border-radius:8px;background:#FFF7ED;color:#C2410C;font-size:12px;font-weight:600;border:1.5px solid #FED7AA;cursor:pointer">Reopen</button>`:'')+
        '</div>'+
      '</div>'+
    '</div>';
  }

  return'<div class="fade">'+
    hdr('Tickets','Escalation tickets from checklist responses')+
    // Stats row
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">'+
      statCard('Open',open,'#F97316')+
      statCard('In Progress',inprog,'#3B82F6')+
      statCard('Resolved',resolved,'#0E9F6E')+
    '</div>'+
    // Filters
    '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'+
      ['','Open','In Progress','Resolved','Closed'].map(s=>{const on=statusFilter===s;return`<button onclick="App._tkFilter('status','${s}')" style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${on?'#15171C':'#E5E7EB'};background:${on?'#15171C':'#fff'};color:${on?'#fff':'#6B7280'};cursor:pointer">${s||'All'}</button>`;}).join('')+
      '<div style="width:1px;background:#E5E7EB;margin:0 2px"></div>'+
      ['','High','Medium','Low'].map(p=>{const on=priorityFilter===p;return`<button onclick="App._tkFilter('priority','${p}')" style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid ${on?'#15171C':'#E5E7EB'};background:${on?'#15171C':'#fff'};color:${on?'#fff':'#6B7280'};cursor:pointer">${p||'All priority'}</button>`;}).join('')+
    '</div>'+
    // List
    (tickets.length?
      '<div style="display:flex;flex-direction:column;gap:10px">'+tickets.map(tkCard).join('')+'</div>':
      empty('ticket','No tickets','Tickets are created automatically when an escalation answer is submitted.')
    )+
  '</div>';
}

App._showLateDetail=(uid)=>{
  const u=uById(uid);if(!u)return;
  const lateSubs=DB.submissions.filter(s=>s.userId===uid&&s.status==='Late');
  const rows=lateSubs.map(s=>{
    const c=clById(s.checklistId);
    return'<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #F3F4F6">'      +'<div><div style="font-size:13px;font-weight:600">'+(c?esc(c.name):'[Deleted checklist]')+'</div>'      +'<div style="font-size:11px;color:#9CA3AF;margin-top:2px">'+fmtS(s.date)+(s.submittedAt?' · Submitted '+new Date(s.submittedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'')+'</div></div>'      +chip(s.status)      +'</div>';
  }).join('');
  openModal('<div style="padding:20px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h2 style="font-size:16px;font-weight:800;font-family:var(--font-display)">Late submissions — '+esc(fullName(u))+'</h2><button onclick="App.closeModal()" style="width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:none;background:transparent;cursor:pointer;color:#9CA3AF">'+ic('x')+'</button></div>'+(rows||'<div style="font-size:13px;color:#9CA3AF;text-align:center;padding:20px">No late submissions found in local data.</div>')+'</div>','max-w-md');
};

App._tkSetStatus=(el)=>{const id=el.dataset.id,status=el.dataset.st;App._ticketStatus(id,status);};
App._tkFilter=(key,val)=>{if(key==='status')S.filters.tkStatus=val;else S.filters.tkPriority=val;rr();};
App._ticketStatus=(id,status)=>{
  const t=(DB.tickets||[]).find(x=>x.id===id);if(!t)return;
  t.status=status;
  saveDB();rr();
  sb.from('tickets').update({status}).eq('id',id).then(()=>{}).catch(e=>console.warn('ticket status:',e.message));
};

App._resolveTicket=(id)=>{
  const t=(DB.tickets||[]).find(x=>x.id===id);if(!t)return;
  openModal(`<div style="padding:20px">
    <h2 style="font-size:18px;font-weight:800;font-family:var(--font-display);margin-bottom:4px">Resolve ticket</h2>
    <p style="font-size:13px;color:#6B7280;margin-bottom:14px">Add a note explaining how this was resolved.</p>
    <textarea id="tk-note" rows="3" placeholder="What was done to resolve this?" style="width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px;font-size:13px;resize:none;outline:none;box-sizing:border-box"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="App.closeModal()" style="flex:1;padding:11px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;font-weight:600;font-size:14px;cursor:pointer">Cancel</button>
      <button onclick="App._confirmResolve('${id}')" style="flex:2;padding:11px;border-radius:10px;background:#0E9F6E;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Mark Resolved</button>
    </div>
  </div>`,'max-w-sm');
};

App._confirmResolve=(id)=>{
  const note=$('#tk-note')?.value?.trim()||'';
  const t=(DB.tickets||[]).find(x=>x.id===id);if(!t)return;
  t.status='Resolved';t.resolvedAt=new Date().toISOString();t.resolveNote=note;
  // Notify the submitter
  if(t.submitterId&&t.submitterId!==S.uid){
    DB.notifications.unshift({id:uid('n'),userId:t.submitterId,text:'✅ Ticket resolved: "'+t.title+'"'+(note?' — '+note.slice(0,60):''),time:new Date().toISOString(),read:false});
    _invalidateNotifCache();
  }
  closeModal();saveDB();rr();
  sb.from('tickets').update({status:'Resolved',resolved_at:t.resolvedAt,resolve_note:note}).eq('id',id).then(()=>{}).catch(e=>console.warn('resolve:',e.message));
};

App._delTicket=(id)=>{
  if(!isAdmin())return;
  DB.tickets=(DB.tickets||[]).filter(t=>t.id!==id);
  saveDB();rr();
  sb.from('tickets').delete().eq('id',id).then(()=>{}).catch(e=>console.warn('del ticket:',e.message));
};


function analyticsPage(){
  const today=todayISO();
  // Collect all relevant submissions
  let subs=DB.submissions;
  if(!isAdmin())subs=subs.filter(s=>subTree(S.uid).some(u=>u.id===s.userId)||s.userId===S.uid);
  const f=S.filters;
  const fArr=k=>Array.isArray(f[k])?f[k]:(f[k]?[f[k]]:[]);
  if(fArr('users').length)  subs=subs.filter(s=>fArr('users').includes(s.userId));
  if(fArr('deps').length)   subs=subs.filter(s=>{const c=clById(s.checklistId);return c&&fArr('deps').includes(c.department);});
  if(fArr('locs').length)   subs=subs.filter(s=>{const c=clById(s.checklistId);return c&&fArr('locs').some(l=>(c.locationIds||[]).includes(l));});
  if(fArr('stats').length)  subs=subs.filter(s=>fArr('stats').includes(s.status));
  if(f.dr1) subs=subs.filter(s=>s.date>=f.dr1);
  if(f.dr2) subs=subs.filter(s=>s.date<=f.dr2);

  // Ticket stats for analytics
  let aTickets=(DB.tickets||[]).slice();
  if(!isAdmin())aTickets=aTickets.filter(t=>subTree(S.uid).some(u=>u.id===t.assignedTo||u.id===t.submitterId)||t.assignedTo===S.uid||t.submitterId===S.uid);
  if(f.dr1)aTickets=aTickets.filter(t=>(t.date||t.createdAt?.slice(0,10)||'')>=f.dr1);
  if(f.dr2)aTickets=aTickets.filter(t=>(t.date||t.createdAt?.slice(0,10)||'')<=f.dr2);
  const tkOpen=aTickets.filter(t=>t.status==='Open').length;
  const tkResolved=aTickets.filter(t=>t.status==='Resolved'||t.status==='Closed').length;
  const tkHigh=aTickets.filter(t=>t.priority==='High'||t.priority==='Critical').length;
  const tot=Math.max(subs.length,1);
  const byS={'On Time':0,'Late':0,'Pending Approval':0,'Rejected':0,'Pending (not submitted)':0};
  subs.forEach(s=>{if(byS[s.status]!==undefined)byS[s.status]++;else byS['Pending (not submitted)']++;});

  // Count missed (assigned but no submission for past dates)
  const relevantUsers=isAdmin()?DB.users:[me(),...subTree(S.uid)].filter(Boolean);
  const dateRange=[];
  const dr1=f.dr1||(new Date(Date.now()-30*86400000).toISOString().slice(0,10));
  const dr2=f.dr2||today;
  let d=new Date(dr1+'T00:00:00');const dEnd=new Date(dr2+'T00:00:00');
  while(d<=dEnd&&dateRange.length<60){dateRange.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  let totalAssigned=0,totalMissed=0;
  relevantUsers.forEach(u=>{
    if(fArr('users').length&&!fArr('users').includes(u.id))return;
    dateRange.forEach(dt=>{
      const cls=DB.checklists.filter(c=>(c.assignees||[]).includes(u.id)&&clOn(c,dt));
      cls.forEach(c=>{
        totalAssigned++;
        if(!DB.submissions.find(s=>s.checklistId===c.id&&s.userId===u.id&&s.date===dt)&&dt<today){
          totalMissed++;
        }
      });
    });
  });

  const topU=relevantUsers.map(u=>({u,n:subs.filter(s=>s.userId===u.id).length,tk:aTickets.filter(t=>t.assignedTo===u.id||t.submitterId===u.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const recent=subs.slice().sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')).slice(0,50);
  const activeCount=fArr('users').length+fArr('deps').length+fArr('locs').length+fArr('stats').length+(f.dr1?1:0)+(f.dr2?1:0);

  function msDropdown(label,key,items,getId,getLabel){
    const sel=fArr(key);const isOpen=S.afOpen===key;
    const txt=sel.length===0?'All':sel.length===1?getLabel(items.find(x=>getId(x)===sel[0])||items[0])||'?':sel.length+' selected';
    return`<div data-af="1" style="position:relative;flex:1;min-width:120px">
      <button data-af="1" type="button" onclick="S.afOpen=S.afOpen==='${key}'?null:'${key}';rr()"
        style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1.5px solid ${isOpen?'#10B981':sel.length?'#15171C':'#E5E7EB'};border-radius:10px;padding:7px 12px;font-size:13px;font-weight:${sel.length?600:400};color:${sel.length?'#15171C':'#9CA3AF'};cursor:pointer">
        <span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(label+(sel.length?': '+txt:''))}</span>
        <span style="color:#9CA3AF;transform:rotate(${isOpen?180:0}deg);transition:transform .15s;flex-shrink:0">${ic('chevD','w-4 h-4')}</span>
      </button>
      ${isOpen?`<div data-af="1" style="position:absolute;top:calc(100%+4px);left:0;right:0;background:#fff;border:1.5px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:100;max-height:220px;overflow-y:auto;padding:6px">
        ${sel.length?`<button data-af="1" onclick="delete S.filters['${key}'];rr()" style="width:100%;text-align:left;padding:6px 10px;font-size:12px;font-weight:600;color:#E11D48;background:none;border:none;cursor:pointer;border-radius:8px">Clear selection</button><div style="height:1px;background:#F3F4F6;margin:4px 0"></div>`:''}
        ${items.map(item=>{const id=getId(item);const nm=getLabel(item)||'?';const on=sel.includes(id);return`<button data-af="1" type="button" onclick="App._togF('${key}','${id}')"
          style="width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:none;cursor:pointer;background:${on?'#F0FDF9':'transparent'};text-align:left">
          <div style="width:16px;height:16px;border-radius:4px;border:1.5px solid ${on?'#10B981':'#D1D5DB'};background:${on?'#10B981':'#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            ${on?`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>`:''}
          </div>
          <span style="font-size:13px;font-weight:${on?600:400};color:${on?'#15171C':'#6B7280'}">${esc(nm)}</span>
        </button>`;}).join('')}
      </div>`:''}
    </div>`;
  }
  

  return`<div class="fade" onclick="(function(e){if(S.afOpen&&!e.target.closest('[data-af]')){S.afOpen=null;rr();}})(event)">
  ${hdr('Analytics','')}
  <!-- Filter bar -->
  <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:14px 16px;margin-bottom:14px;position:sticky;top:0;z-index:20">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${msDropdown('Status','stats',['On Time','Late','Pending Approval','Rejected'],s=>s,s=>s)}
      ${msDropdown('Department','deps',DB.departments,d=>d.name,d=>d.name)}
      ${msDropdown('Team member','users',relevantUsers,u=>u.id,u=>fullName(u))}
      ${DB.locations.length?msDropdown('Location','locs',DB.locations,l=>l.id,l=>l.name):''}
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:220px">
        <input type="date" value="${f.dr1||''}" onchange="S.filters.dr1=this.value;rr()" style="flex:1;background:#F6F7F8;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:13px;outline:none"/>
        <span style="color:#9CA3AF">to</span>
        <input type="date" value="${f.dr2||''}" onchange="S.filters.dr2=this.value;rr()" style="flex:1;background:#F6F7F8;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:13px;outline:none"/>
      </div>
      <button onclick="S.filters.issue=f.issue==='yes'?'':'yes';rr()" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1.5px solid ${f.issue==='yes'?'#FED7AA':'#E5E7EB'};background:${f.issue==='yes'?'#FFF7ED':'#fff'};font-size:13px;font-weight:${f.issue==='yes'?600:400};color:${f.issue==='yes'?'#C2410C':'#9CA3AF'};cursor:pointer">${ic('flag','w-3.5 h-3.5')} Issues only</button>
      ${activeCount?`<button onclick="S.filters={};S.afOpen=null;rr()" style="padding:6px 12px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px;font-weight:600;color:#9CA3AF;background:#fff;cursor:pointer">Clear (${activeCount})</button>`:''}
      ${btnG('Export','App._exportCSV()','download')}
    </div>
  </div>

  <!-- Stats row 1: submissions -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px">
    ${statCard('Submitted',subs.length,'sky')}
    ${statCard('On time',byS['On Time']||0,'brand')}
    ${statCard('Late',byS['Late']||0,'rose')}
    ${statCard('Missed',totalMissed,'orange')}
  </div>
  <!-- Stats row 2: tickets -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
    ${statCard('Tickets',aTickets.length,'#F97316')}
    ${statCard('Open',tkOpen,'#F59E0B')}
    ${statCard('High Priority',tkHigh,'#DC2626')}
    ${statCard('Resolved',tkResolved,'#0E9F6E')}
  </div>


  <!-- Charts -->

  
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:18px">
      <div class="fd" style="font-size:14px;font-weight:700;margin-bottom:14px">Status breakdown</div>
      ${[['On Time','#10B981'],['Late','#EF4444'],['Pending Approval','#F97316'],['Rejected','#9F1239']].map(([k,c])=>{const v=byS[k]||0;const pct=Math.round(v/tot*100);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:600">${k}</span><span style="color:#9CA3AF">${v} · ${pct}%</span></div><div style="height:5px;background:#F3F4F6;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${c};border-radius:3px"></div></div></div>`;}).join('')}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #F3F4F6">
        <div style="font-size:12px;font-weight:600;color:#9CA3AF;margin-bottom:6px">MISSED (past, no submission)</div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600;color:#F97316">${totalMissed} missed</span><span style="color:#9CA3AF">of ${totalAssigned} assigned in period</span></div>
      </div>
    </div>
    <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:18px">
      <div class="fd" style="font-size:14px;font-weight:700;margin-bottom:14px">Top contributors</div>
      ${topU.slice(0,7).map(({u,n})=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer" onclick="App._userDrill('${u.id}')">${avatar(u,'w-7 h-7','text-[10px]')}<div style="flex:1;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(fullName(u))}</div><span class="fd" style="font-size:15px;font-weight:800">${n}</span><span style="font-size:11px;color:#9CA3AF">&rsaquo;</span></div>`).join('')||'<p style="font-size:13px;color:#9CA3AF">No data yet</p>'}
    </div>
  </div>

  <!-- Table -->
  <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden">
    <div style="padding:14px 18px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center">
      <span class="fd" style="font-size:14px;font-weight:700">Submissions (${subs.length})</span>
      ${btnG('Export CSV','App._exportCSV()','download')}
    </div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid #F3F4F6">
        ${['User','Checklist','Dept','Date','Status','Answered'].map(h=>`<th style="padding:9px 16px;font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;text-align:left;white-space:nowrap">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${recent.map(s=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u)return'';const qCount=(s.questionResponses||[]).filter(r=>r.response!==null&&r.response!==undefined&&r.response!=='').length;if(!c)return`<tr style="border-bottom:1px solid #F9FAFB;opacity:.5"><td style="padding:9px 16px" colspan="6"><span style="font-size:12px;color:#9CA3AF">${esc(fullName(u))} — deleted checklist — ${fmtS(s.date)}</span></td></tr>`;return`<tr style="border-bottom:1px solid #F9FAFB;cursor:pointer" onclick="App.viewSub('${s.id}')" onmouseover="this.style.background='#FAFAFA'" onmouseout="this.style.background=''">
        <td style="padding:9px 16px"><div style="display:flex;align-items:center;gap:7px;cursor:pointer" onclick="event.stopPropagation();App._userDrill('${u.id}')">${avatar(u,'w-7 h-7','text-[10px]')}<span style="font-weight:500;text-decoration:underline;text-decoration-color:#E5E7EB">${esc(fullName(u))}</span></div></td>
        <td style="padding:9px 16px;max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(c.name)}</td>
        <td style="padding:9px 16px;color:#9CA3AF;font-size:12px">${esc(c.department)}</td>
        <td style="padding:9px 16px;color:#9CA3AF;font-size:12px;white-space:nowrap">${fmtS(s.date)}</td>
        <td style="padding:9px 16px">${chip(s.status)}</td>
        <td style="padding:9px 16px">${qCount?`<span style="font-size:12px;font-weight:700;color:#0E9F6E">${qCount}/${(clById(s.checklistId)?.questionIds||[]).length}</span>`:'<span style="color:#E5E7EB">—</span>'}</td>
      </tr>`;}).join('')}</tbody>
    </table>${recent.length?'':empty('chart','No submissions match','Adjust filters or date range')}</div>
  </div></div>`;
}


App._viewSubById=(id)=>App.viewSub(id);
App._userDrill=(uid)=>{
  const u=uById(uid);if(!u)return;
  let subs=DB.submissions.filter(s=>s.userId===uid);
  const today=todayISO();
  const dr1=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  subs=subs.filter(s=>s.date>=dr1);
  const tot=subs.length;
  const onTime=subs.filter(s=>s.status==='On Time').length;
  const late=subs.filter(s=>s.status==='Late').length;
  const pending=subs.filter(s=>s.status==='Pending Approval').length;
  const rejected=subs.filter(s=>s.status==='Rejected').length;
  const issues=subs.reduce((n,s)=>n+(s.questionResponses||[]).filter(r=>r.response!==null&&r.response!==undefined&&r.response!=='').length,0);
  const pct=tot?Math.round(onTime/tot*100):0;
  const recent=subs.slice().sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')).slice(0,10);
  openModal(
    '<div class="p-5" style="max-height:80vh;overflow-y:auto">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'

function _fmtSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';return(b/1048576).toFixed(1)+'MB';}

App._delFolder=(id)=>{
  const f=(DB.folders||[]).find(x=>x.id===id);
  if(!f)return;
  if(!confirm('Delete folder "'+f.name+'" and all its files?'))return;
  // Collect all folder IDs (recursive) and doc IDs BEFORE modifying DB
  const toDelete=[];
  function collectRec(fid){toDelete.push(fid);(DB.folders||[]).filter(x=>x.parentId===fid).forEach(c=>collectRec(c.id));}
  collectRec(id);
  const docIds=(DB.documents||[]).filter(x=>toDelete.includes(x.folderId)).map(x=>x.id);
  // Track deleted IDs
  if(!DB.folders_deleted)DB.folders_deleted=[];
  toDelete.forEach(fid=>{if(!DB.folders_deleted.includes(fid))DB.folders_deleted.push(fid);});
  DB.folders=(DB.folders||[]).filter(x=>!toDelete.includes(x.id));
  DB.documents=(DB.documents||[]).filter(x=>!toDelete.includes(x.folderId||''));
  log(fullName(me()),'Deleted folder',f.name);
  toast('Deleted','warn');saveDB();render();
  // Sync to Supabase in background
  const delOps=toDelete.map(fid=>sb.from('doc_folders').delete().eq('id',fid).then(({error})=>{if(error)console.error('delFolder sync:',error.message);}));
  if(docIds.length)delOps.push(sb.from('documents').delete().in('id',docIds).then(({error})=>{if(error)console.error('delDoc sync:',error.message);}));
  Promise.all(delOps).catch(e=>console.error('delFolder:',e));
};

App._previewUpload=(input)=>{

      const ext=(f.name.split('.').pop()||'').toLowerCase();

      return'<div style="display:flex;align-items:center;gap:10px;background:#F6F7F8;border-radius:10px;padding:10px">'

        +'</div>';

App._doUpload=async()=>{
  const files=App._pendingFiles;if(!files?.length){toast('Select a file','err');return;}
  const btn=document.getElementById('ud-btn');
  const prog=document.getElementById('ud-progress');
  const bar=document.getElementById('ud-bar');
  if(btn)btn.style.display='none';
  if(prog)prog.style.display='block';
  const scopeTab=S.filters.docScope||'dept';
  const scopeKey=S.filters.docScopeKey;
  const folderId=S.filters.docFolder||null;
  let done=0;
  for(const file of files){
    const path=scopeTab+'/'+scopeKey+'/'+(folderId||'root')+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{data,error}=await sb.storage.from('documents').upload(path,file,{cacheControl:'3600',upsert:false});
    if(error){toast('Upload failed: '+error.message,'err');if(btn)btn.style.display='block';if(prog)prog.style.display='none';return;}
    const{data:urlData}=sb.storage.from('documents').getPublicUrl(path);
    if(!DB.documents)DB.documents=[];
    const docObj={id:uid('doc'),name:file.name,folderId,type:scopeTab,scope:scopeKey,url:urlData?.publicUrl||path,storagePath:path,fileType:file.type,fileSize:file.size,uploadedBy:S.uid,uploaderName:fullName(me()),uploadedAt:new Date().toISOString()};
    DB.documents.push(docObj);
    // Insert directly to Supabase so refresh doesn't lose the file
    await sb.from('documents').insert({id:docObj.id,name:docObj.name,folder_id:docObj.folderId||null,type:docObj.type,scope:docObj.scope,url:docObj.url,storage_path:docObj.storagePath,file_type:docObj.fileType,file_size:docObj.fileSize,uploaded_by:docObj.uploadedBy,uploader_name:docObj.uploaderName,uploaded_at:docObj.uploadedAt}).then(({error})=>{if(error)console.error('doc insert:',error.message);}).catch(()=>{});
    done++;
    if(bar)bar.style.width=Math.round(done/files.length*100)+'%';
  }
  log(fullName(me()),'Uploaded '+done+' file(s)',scopeKey);
  toast('Uploaded '+done+' file'+(done>1?'s':''));
  saveDB();closeModal();render();
};

App._downloadDoc=async(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc)return;
  if(doc.url&&doc.url.startsWith('http')){
    const a=document.createElement('a');a.href=doc.url;a.download=doc.name;a.target='_blank';a.click();return;
  }
  // Signed URL
  const{data,error}=await sb.storage.from('documents').createSignedUrl(doc.storagePath||doc.url,300);
  if(error){toast('Download failed','err');return;}
  const a=document.createElement('a');a.href=data.signedUrl;a.download=doc.name;a.click();
};

App._previewDoc=async(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc)return;
  let url=doc.url;
  if(!url?.startsWith('http')){
    const{data,error}=await sb.storage.from('documents').createSignedUrl(doc.storagePath||doc.url,300);
    if(error){toast('Preview failed','err');return;}
    url=data.signedUrl;
  }
  const ext=(doc.name.split('.').pop()||'').toLowerCase();
  if(ext.match(/jpe?g|png|gif|webp/)){
    openModal('<div class="p-4"><div class="flex justify-between mb-3"><h3 class="fd font-bold">'+esc(doc.name)+'</h3><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div><img src="'+url+'" style="width:100%;border-radius:12px;max-height:70vh;object-fit:contain"/></div>','max-w-2xl');
  } else if(ext==='pdf'){
    window.open(url,'_blank');
  } else {
    window.open(url,'_blank');
  }
};

App._delDoc=(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc||!confirm('Delete "'+doc.name+'"?'))return;
  if(!DB.documents_deleted)DB.documents_deleted=[];
  if(!DB.documents_deleted.includes(id))DB.documents_deleted.push(id);

  email_submission_late:true,email_submission_approved:true,email_submission_rejected:true,
  email_approval_requested:true,email_approval_decided:true,
  email_feedback_received:false,email_deadline_reminder:true,

let _ns=null;
async function _loadNS(){
  if(_ns)return _ns;
  try{const r=localStorage.getItem(NS_LS);if(r)_ns={..._nsDefault(),...JSON.parse(r)};}catch(e){}
  if(!_ns)_ns=_nsDefault();
  try{const{data,error:wsErr}=await sb.from('workspace_settings').select('value').eq('key','notification_settings').single();
      if(wsErr&&(wsErr.code==='42P01'||wsErr.message?.includes('does not exist'))){console.warn('workspace_settings table missing — using defaults');return _ns;}
    if(data?.value){
      const saved=data.value;
      _ns={..._nsDefault(),...saved};
      // Deep-merge templates — spread would overwrite entire templates obj with saved one, which is correct
      // but if saved has no templates key at all, restore empty object
      if(!_ns.templates)_ns.templates={};
      localStorage.setItem(NS_LS,JSON.stringify(_ns));
    }}catch(e){}
  return _ns;
}
async function _saveNS(){
  if(!_ns)return;
  localStorage.setItem(NS_LS,JSON.stringify(_ns));
  try{await sb.from('workspace_settings').upsert({key:'notification_settings',value:_ns,updated_at:new Date().toISOString()},{onConflict:'key'});}catch(e){console.warn('NS sync:',e.message);}
}

// ── Resolve template variables ──
function _fillTemplate(str, vars){
  return str.replace(/\{\{(\w+)\}\}/g,(_,k)=>vars[k]||'');
}

// ── Render plain text body as HTML — {{action_url}} line becomes a CTA button ──
function _bodyToHtml(fromName, bodyText, actionUrl=''){
  const safeName=String(fromName||'Shiftly').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  const rawLines = bodyText.split('\n').map(l=>l.trim());
  // ctaUrl is passed in as 3rd arg — already the resolved URL
  let ctaUrl = actionUrl||'';
  // Strip: the {{action_url}} placeholder, the resolved URL itself (already a button), and any bare https line
  const lines = rawLines
    .filter(l=>l!=='{{action_url}}' && l!==ctaUrl && !/^https?:\/\//.test(l))
    .map(l=>l.replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])));
  const ctaLabel=ctaUrl.includes('approvals')?'View Approvals'
    :ctaUrl.includes('mychecklists')?'Open My Checklists'
    :ctaUrl.includes('notifications')?'View Notifications'
    :ctaUrl.includes('settings')?'Open Settings'
    :ctaUrl.includes('analytics')?'View Analytics'
    :'Open Shiftly';
  return`<!DOCTYPE html><html><body style="margin:0;padding:0;background:#F7F6F2;font-family:sans-serif">
  <div style="max-width:520px;margin:32px auto;background:#fff;border-radius:16px;border:1px solid #ECEDF0;overflow:hidden">
    <div style="background:#15171C;padding:20px 28px;display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:#0E9F6E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff">S</div>
      <span style="font-weight:700;font-size:16px;color:#fff">${safeName}</span>
    </div>
    <div style="padding:28px">
      ${lines.filter(Boolean).map((l,i)=>i===0
        ?`<p style="font-size:15px;color:#374151;margin:0 0 16px">${l}</p>`
        :`<p style="font-size:14px;color:#6B7280;margin:0 0 8px;line-height:1.6">${l}</p>`
      ).join('')}
      ${ctaUrl?`<div style="margin-top:24px">
        <a href="${ctaUrl}" style="display:inline-block;background:#15171C;color:#fff;font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none">${ctaLabel} →</a>
        <p style="margin:10px 0 0;font-size:11px;color:#B8B5AC">Or copy: ${ctaUrl}</p>
      </div>`:''}
    </div>
    <div style="padding:16px 28px;background:#F9F8F5;border-top:1px solid #ECEDF0;font-size:11px;color:#9CA3AF">
      ${safeName} · Automated notification · Do not reply
    </div>
  </div></body></html>`;
}

// ── sendEmail: FAST — calls edge function directly, no queue, no extra DB round trip ──
async function sendEmail(eventType, userId, vars){
  const user = userId ? uById(userId) : null;
  if(!user?.email){console.warn('sendEmail: no email for user',userId);return;}
  if(!_ns) await _loadNS();
  if(!_ns.email_enabled) return;
  if(_ns['email_'+eventType]===false) return;
  // Build app URL from current window location
  const appUrl = window.location.origin;
  // Each event type links to the most relevant page
  const routeMap = {
    checklist_assigned:'mychecklists',
    submission_late:'mychecklists', submission_approved:'mychecklists',
    submission_rejected:'mychecklists', approval_requested:'approvals',
    approval_decided:'approvals', feedback_received:'notifications',
    deadline_reminder:'mychecklists',
  };
  const actionUrl = appUrl + '/#' + (routeMap[eventType]||'');
  const allVars = {user_name:fullName(user), from_name:_ns.email_from_name||'Shiftly', app_url:appUrl, action_url:actionUrl, ...vars};
  const defaults = _defaultTemplates();
  const tpl = {
    subject:(_ns.templates?.[eventType]?.subject)||defaults[eventType]?.subject||eventType,
    body:   (_ns.templates?.[eventType]?.body)   ||defaults[eventType]?.body   ||'',
  };
  const subject  = _fillTemplate(tpl.subject, allVars);
  const bodyHtml = _bodyToHtml(_ns.email_from_name, _fillTemplate(tpl.body, allVars), actionUrl);
  sb.functions.invoke('send-notification',{body:{
    to:user.email, from_name:_ns.email_from_name||'Shiftly', subject, html:bodyHtml,
  }}).catch(e=>console.warn('sendEmail invoke failed:',e.message));
}

App._exportCSV=()=>{
  let subs=DB.submissions;if(!isAdmin())subs=subs.filter(s=>subTree(S.uid).some(u=>u.id===s.userId)||s.userId===S.uid);
  const f=S.filters;const fArr=k=>Array.isArray(f[k])?f[k]:(f[k]?[f[k]]:[]);
  if(fArr('users').length)subs=subs.filter(s=>fArr('users').includes(s.userId));
  if(fArr('deps').length)subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('deps').includes(c?.department);});
  if(fArr('locs').length)subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('locs').some(l=>(c?.locationIds||[]).includes(l));});
  if(fArr('stats').length)subs=subs.filter(s=>fArr('stats').includes(s.status));
  if(f.dr1)subs=subs.filter(s=>s.date>=f.dr1);if(f.dr2)subs=subs.filter(s=>s.date<=f.dr2);
  const summaryRows=[['#','User','Email','Phone','Department','Position','Checklist','Dept','Location(s)','Date','Status','Submitted At','Edit Count','Pending Approval']];
  subs.forEach((s,i)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u)return;if(!c&&!s.checklistDeleted)return;const clName=c?c.name:'[Deleted checklist]';const clDept=c?c.department||'':'';const clLocs=c?(c.locationIds||[]).map(id=>DB.locations.find(l=>l.id===id)?.name||'').join('; '):'';summaryRows.push([i+1,fullName(u),u.email||'',u.phone||'',u.department||'',u.position||'',clName,clDept,clLocs,s.date,s.status,s.submittedAt?new Date(s.submittedAt).toLocaleString('en-GB'):'',s.editCount||0,s.status==='Pending Approval'?'Yes':'No']);});
  // Also export question responses as a second sheet
  const qRows=[['Sub #','User','Email','Checklist','Date','Status','Question','Response','Comment']];
  subs.forEach((s,si)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u)return;(s.questionResponses||[]).forEach((qr,qi)=>{const q=(DB.questions||[]).find(x=>x.id===qr.questionId);qRows.push([si+1,fullName(u),u.email||'',c?c.name:'[Deleted]',s.date,s.status,q?q.text:'Q'+(qi+1),qr.response!==null&&qr.response!==undefined?String(qr.response):'',qr.comment||'']);});});
  const all=[...summaryRows,[],['=== QUESTION RESPONSES (one row per response) ==='],[],...qRows];
  const csv=all.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='shiftly_export_'+todayISO()+'.csv';a.click();
  toast('Exported '+subs.length+' submissions ('+(qRows.length-1)+' question responses)');
};
