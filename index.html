<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Shiftly</title>
<script>(()=>{const w=console.warn;console.warn=(...a)=>{if(typeof a[0]==='string'&&a[0].includes('cdn.tailwind'))return;w(...a)};window.addEventListener('error',e=>{if(!e.filename||e.filename.includes('cdn.tailwind')||e.filename.includes('fonts.google'))e.stopImmediatePropagation();},true);})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if(typeof tailwind!=='undefined')tailwind.config={theme:{extend:{fontFamily:{display:['"Schibsted Grotesk"'],sans:['"Hanken Grotesk"']},colors:{ink:{DEFAULT:'#15171C',50:'#F6F7F8',100:'#ECEDF0',200:'#D6D8DE',300:'#A9ADB8',400:'#6B7280',500:'#3A3E48',600:'#262A33',700:'#1C1F26',800:'#15171C'},brand:{DEFAULT:'#0E9F6E',50:'#ECFDF5',100:'#D1FAE5',400:'#34D399',500:'#10B981',600:'#0E9F6E',700:'#0B7A55'},paper:'#F7F6F2'},boxShadow:{soft:'0 1px 2px rgba(16,24,40,.04),0 4px 16px -6px rgba(16,24,40,.10)',pop:'0 8px 40px -8px rgba(16,24,40,.28)'}}}}}</script>
<style>
/* ─ Shiftly base ─ */
html,body{height:100%}
body{font-family:"Hanken Grotesk",sans-serif;background:#F7F6F2;color:#15171C;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.fd{font-family:"Schibsted Grotesk",sans-serif}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#D6D8DE;border-radius:4px}
.fade{animation:fd .22s ease}@keyframes fd{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
input,select,textarea{outline:none}
.rf:focus{box-shadow:0 0 0 3px rgba(16,185,129,.15);border-color:#10B981!important}
/* Toggles */
.tog{position:relative;width:36px;height:22px;border-radius:11px;transition:background .15s;cursor:pointer;border:none;flex-shrink:0}
.tog span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:#10B981}.tog.on span{transform:translateX(14px)}.tog.off{background:#D6D8DE}
/* Calendar strip */
.cal4{background:#fff;border-radius:18px;border:1px solid #F0EEE9;display:flex;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.cal4-d{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;transition:background .12s;border:none;background:transparent;gap:2px}
.cal4-d.sel{background:#15171C}.cal4-d:not(.sel):hover{background:#F9F8F5}
.cal4-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#B8B5AC}
.cal4-d.sel .cal4-lbl{color:rgba(255,255,255,.4)}
.cal4-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#15171C}
.cal4-num.tod{background:#15171C;color:#fff}
.cal4-d.sel .cal4-num{color:#fff}
/* Checklist card */
.cl4{background:#fff;border-radius:18px;border:1px solid #F0EEE9;overflow:hidden;transition:box-shadow .2s;border-left:4px solid #E5E3DC}
.cl4.open{box-shadow:0 6px 30px rgba(0,0,0,.09)}
.cl4-hdr{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:transparent;border:none;width:100%;text-align:left}
/* ─ TASK ROW ─ compact, fresh ─ */
.tk{border-top:1px solid #F5F4F0;position:relative}
.tk-main{display:flex;align-items:center;gap:8px;padding:0 14px;height:46px}
.tk-i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0;transition:all .15s}
/* Segmented response control */
.seg{display:inline-flex;background:#F5F4F0;border-radius:8px;padding:2px;gap:1px}
.seg button{height:26px;padding:0 9px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;color:#9CA3AF;background:transparent;display:flex;align-items:center;gap:3px;white-space:nowrap;transition:all .12s}
.seg button:hover:not(.act){color:#6B7280}
.seg button.pos.act{background:#fff;color:#10B981;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg button.neg.act{background:#fff;color:#EF4444;box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* Icon action buttons */
.ia{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;border:1.5px solid #F0EEE9;cursor:pointer;color:#C8C5BD;background:transparent;transition:all .1s;flex-shrink:0}
.ia:hover{border-color:#D1D0C9;color:#9CA3AF}.ia.flagged{border-color:#EF4444;background:#EF4444;color:#fff}
.ia.ph{border-color:#A7F3D0;background:#ECFDF5;color:#10B981}
/* Submit btn */
.sub-btn{width:100%;padding:11px 16px;font-size:13px;font-weight:700;border:none;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s}
.sub-btn.ready{background:#15171C;color:#fff}.sub-btn.ready:hover{background:#0E0F13;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sub-btn.partial{background:#F5F4F0;color:#B8B5AC;cursor:default}
/* Nav brand logo */
.nav-brand{width:32px;height:32px;border-radius:10px;background:#0E9F6E;display:grid;place-items:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
/* Filter dropdown */
.fp{max-height:0;overflow:hidden;transition:max-height .22s ease}.fp.open{max-height:900px}
/* Day/date picker chips */
.dchip{cursor:pointer;user-select:none;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;padding:4px 10px;border:1.5px solid #D6D8DE;font-size:12px;font-weight:600;color:#6B7280;transition:all .12s}
.dchip.on{background:#15171C;color:#fff;border-color:#15171C}
.dtchip{cursor:pointer;user-select:none;width:32px;height:32px;border-radius:50%;border:1.5px solid #E5E7EB;font-size:12px;font-weight:600;color:#6B7280;display:flex;align-items:center;justify-content:center;transition:all .12s}
.dtchip.on{background:#15171C;color:#fff;border-color:#15171C}
/* Seg v2 for task builder */
.seg2{display:inline-flex;border-radius:8px;background:#F5F4F0;padding:2px;gap:1px}
.seg2 button{border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;transition:all .12s;color:#9CA3AF;background:transparent;white-space:nowrap;display:flex;align-items:center;gap:3px}
.seg2 button.pos.act{background:#fff;color:#10B981;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg2 button.neg.act{background:#fff;color:#EF4444;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg2 button:hover:not(.act){color:#6B7280}
/* Task builder */
.tb-card{background:#fff;border-radius:14px;border:1.5px solid #E5E7EB;overflow:hidden;transition:all .15s}
.tb-card:focus-within{border-color:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.tb-header{background:#FAFAFA;padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #F3F4F6}
.tb-body{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.crit-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1.5px solid;font-size:11px;font-weight:700;cursor:pointer;transition:all .12s;user-select:none}
.crit-chip-l{border-color:#BBF7D0;color:#15803D;background:#F0FDF4}.crit-chip-l.on{background:#16A34A;border-color:#16A34A;color:#fff}
.crit-chip-m{border-color:#FDE68A;color:#A16207;background:#FFFBEB}.crit-chip-m.on{background:#D97706;border-color:#D97706;color:#fff}
.crit-chip-h{border-color:#FED7AA;color:#C2410C;background:#FFF7ED}.crit-chip-h.on{background:#EA580C;border-color:#EA580C;color:#fff}
.crit-chip-c{border-color:#FECACA;color:#B91C1C;background:#FFF5F5}.crit-chip-c.on{background:#DC2626;border-color:#DC2626;color:#fff}
.resp-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1.5px solid #E5E7EB;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;user-select:none;color:#6B7280;background:#fff}
.resp-chip.on{background:#15171C;border-color:#15171C;color:#fff}
.opt-tog{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:9px;border:1.5px solid #F3F4F6;background:#FAFAFA;cursor:pointer;transition:all .12s;user-select:none;text-align:left}
.opt-tog.on{border-color:#D1FAE5;background:#ECFDF5}
.opt-tog-dot{width:15px;height:15px;border-radius:50%;border:2px solid #D1D5DB;flex-shrink:0;transition:all .12s;display:flex;align-items:center;justify-content:center;background:#fff}
.opt-tog.on .opt-tog-dot{background:#10B981;border-color:#10B981}
/* iz / issue-zone (legacy, kept for compatibility) */
.iz{display:none}.issue-open .iz{display:block}
.iz2{display:none}.issue-open2 .iz2{display:block}
/* Custom color overrides */
.bg-ink-50{background:#F6F7F8!important}.bg-ink-100{background:#ECEDF0!important}.bg-ink-200{background:#D6D8DE!important}
.bg-ink-800{background:#15171C!important}.bg-ink-900{background:#0E0F13!important}.fld-card:hover{border-color:#0E9F6E!important;box-shadow:0 2px 12px rgba(14,159,110,.1)}
.team-card-hover:hover{border-color:#0E9F6E!important;box-shadow:0 4px 16px rgba(14,159,110,.12)!important}
.dept-card:hover{border-color:#0E9F6E!important;box-shadow:0 4px 16px rgba(14,159,110,.1)}
.loc-card:hover{border-color:#3B82F6!important;box-shadow:0 4px 16px rgba(59,130,246,.1)}
.shadow-pop{box-shadow:0 24px 64px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06)!important}.shadow-soft{box-shadow:0 1px 4px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
.text-ink-300{color:#A9ADB8!important}.text-ink-400{color:#6B7280!important}.text-ink-500{color:#3A3E48!important}
.text-ink-600{color:#262A33!important}.text-ink-700{color:#1C1F26!important}.text-ink-800{color:#15171C!important}
.border-ink-100{border-color:#ECEDF0!important}.border-ink-200{border-color:#D6D8DE!important}
.bg-brand-50{background:#ECFDF5!important}.bg-brand-600{background:#10B981!important}.bg-brand-700{background:#059669!important}
.text-brand-600{color:#10B981!important}.text-brand-700{color:#059669!important}
.bg-emerald-50{background:#ECFDF5!important}.text-emerald-700{color:#047857!important}
.bg-amber-50{background:#FFFBEB!important}.text-amber-700{color:#B45309!important}
.bg-rose-50{background:#FFF1F2!important}.text-rose-700{color:#BE123C!important}
.bg-orange-50{background:#FFF7ED!important}.text-orange-700{color:#C2410C!important}
.bg-sky-50{background:#F0F9FF!important}.text-sky-700{color:#0369A1!important}
.text-white{color:#fff!important}
@media(min-width:768px){#main-wrap{margin-left:224px!important}}

/* ═══ Checklist v6 — Card + Table layout ═══ */
.cl6{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:12px;transition:box-shadow .2s}
.cl6:hover{box-shadow:0 4px 20px rgba(0,0,0,.07)}
.cl6.open{box-shadow:0 8px 32px rgba(0,0,0,.1)}
.cl6-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:56px;cursor:pointer;border:none;background:transparent;width:100%;gap:12px}
/* Status bar on left edge */
.cl6-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:20px 0 0 20px}
/* Task table row */
.tk6{display:flex;align-items:center;gap:0;border-top:1px solid #F9F8F5;min-height:44px}
.tk6.done{background:#FAFEF8}
.tk6.flagged{background:#FFF8F7}
.tk6-num{width:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 0 0 14px}
.tk6-check{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex-shrink:0;transition:all .15s}
.tk6-body{flex:1;min-width:0;padding:10px 10px 10px 0}
.tk6-actions{display:flex;align-items:center;gap:4px;padding-right:14px;flex-shrink:0}
/* Pill response buttons */
.rp6{display:inline-flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid #EEE}
.rp6 button{border:none;padding:0 10px;height:28px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#9CA3AF;transition:all .1s;white-space:nowrap}
.rp6 button:not(:last-child){border-right:1px solid #EEE}
.rp6 button.ok{background:#10B981;color:#fff;border-color:#10B981}
.rp6 button.ng{background:#EF4444;color:#fff;border-color:#EF4444}
.rp6 button:hover:not(.ok):not(.ng){background:#F5F4F0;color:#6B7280}
/* Icon action */
.ia6{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;border:1px solid #F0EEE9;background:transparent;cursor:pointer;color:#C8C5BD;transition:all .12s}
.ia6:hover{border-color:#C8C5BD;color:#9CA3AF}
.ia6.on{border-color:#EF4444;background:#EF4444;color:#fff}
.ia6.ph-on{border-color:#A7F3D0;background:#ECFDF5;color:#10B981}
/* Submit strip */
.sub6{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid #F5F4F0;gap:10px}
.sub6-btn{padding:9px 22px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.sub6-btn.ready{background:#15171C;color:#fff}
.sub6-btn.ready:hover{background:#0E0F13;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sub6-btn.partial{background:#F5F4F0;color:#C8C5BD;cursor:default}
/* Issue panel */
.iss-panel{background:#FFF8F7;border-top:1px solid #FEE2E2;padding:8px 14px 10px 54px}

/* ═══ Checklist UI vFinal ═══ */
/* Calendar */
.cal-strip{display:flex;background:#fff;border-radius:16px;border:1px solid #EEECE8;overflow:hidden}
.csd{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;cursor:pointer;border:none;background:transparent;gap:3px;transition:background .1s;min-width:0}
.csd:hover:not(.act){background:#F9F8F5}
.csd.act{background:#111110}
.csd-lbl{font-size:9px;font-weight:800;letter-spacing:.08em;color:#B8B5AC;text-transform:uppercase}
.csd.act .csd-lbl{color:rgba(255,255,255,.4)}
.csd-n{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;font-weight:800;color:#111110}
.csd-n.now{background:#111110;color:#fff}
.csd.act .csd-n{color:#fff}
.csd-dots{display:flex;gap:2px;height:5px;align-items:center}
/* Checklist card */
.clc{border-radius:18px;overflow:hidden;border:1px solid #EEECE8;background:#fff;transition:box-shadow .2s}
.clc-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;border:none;background:transparent;width:100%;gap:10px}
.clc-hdr:active{background:#FAFAF8}
/* Status styles */
.st-on{background:#E8FAF3;color:#0D7A4E}
.st-late{background:#FFEDED;color:#C92C2C}
.st-pend{background:#FEF7E6;color:#B36A00}
.st-sub{background:#E8FAF3;color:#0D7A4E}
.st-pa{background:#FFF0E6;color:#B85000}
/* Task row — THE KEY ELEMENT */
.tkr{display:flex;align-items:center;padding:0 18px;min-height:46px;border-top:1px solid #F7F6F3;gap:12px;transition:background .1s}
.tkr:active{background:#F9F8F5}
.tkr.tk-done{background:#F8FDF9}
.tkr.tk-flag{background:#FFF5F5}
.tkr.tk-ov{background:#FFFBF0}
/* Checkbox-style indicator */
.tk-box{width:20px;height:20px;border-radius:5px;border:1.5px solid #DDD;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.tk-box.c{border-color:#22C55E;background:#22C55E}
.tk-box.f{border-color:#EF4444;background:#EF4444}
/* Inline response — minimal */
.rsp{display:flex;border-radius:7px;overflow:hidden;border:1px solid #EEECE8;flex-shrink:0}
.rsp button{border:none;padding:0 11px;height:30px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#9CA3AF;transition:all .1s;white-space:nowrap;display:flex;align-items:center;gap:3px}
.rsp button:not(:last-child){border-right:1px solid #EEECE8}
.rsp button:hover:not(.ra):not(.rb){background:#F5F4F0}
.rsp button.ra{background:#22C55E;color:#fff;border-color:#22C55E} /* positive active */
.rsp button.rb{background:#EF4444;color:#fff;border-color:#EF4444} /* negative active */
/* Small icon button */
.ib{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid #EEECE8;background:transparent;cursor:pointer;color:#C8C5BD;flex-shrink:0;transition:all .1s}
.ib:hover{border-color:#C8C5BD;color:#9CA3AF}
.ib.f-on{border-color:#EF4444;background:#EF4444;color:#fff}
.ib.p-on{border-color:#22C55E;background:#DCFCE7;color:#16A34A}
/* Footer strip */
.clc-ft{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid #F7F6F3;gap:10px;background:#FAFAF8}
.submit-pill{padding:8px 20px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.submit-pill.go{background:#111110;color:#fff}.submit-pill.go:hover{background:#000;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.submit-pill.no{background:#EEECE8;color:#C8C5BD;cursor:default}
/* Issue zone */
.iss-z{padding:8px 18px 10px 50px;border-top:1px solid #FEE2E2;background:#FFF8F8}

/* ═══ Task row vFresh ═══ */
.tkrow{padding:0 0;border-top:1px solid #F3F2EF}
.tkrow:first-child{border-top:none}
.tkrow-main{display:flex;align-items:flex-start;gap:12px;padding:11px 18px 11px 16px;min-height:0}
/* Orb */
.orb{width:22px;height:22px;border-radius:50%;border:2px solid #D9D7D2;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .18s;cursor:default}
.orb.done{border-color:#22C55E;background:#22C55E}
.orb.issue{border-color:#EF4444;background:#EF4444}
.orb.ov{border-color:#F97316}
/* Response inline chips */
.rc{display:inline-flex;gap:4px}
.rc-btn{height:28px;padding:0 12px;border-radius:14px;border:1.5px solid #E8E6E1;background:#fff;font-size:11px;font-weight:700;cursor:pointer;color:#9CA3AF;transition:all .12s;white-space:nowrap}
.rc-btn:hover:not(.rca):not(.rcb){background:#F5F4F0;border-color:#D9D7D2;color:#6B7280}
.rc-btn.rca{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.rc-btn.rcb{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
/* Action icon */
.act-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1.5px solid #E8E6E1;background:transparent;cursor:pointer;color:#C8C5BD;flex-shrink:0;transition:all .12s}
.act-ic:hover{border-color:#B8B5AC;color:#9CA3AF}
.act-ic.iss-on{border-color:#EF4444!important;background:#EF4444!important;color:#fff!important}
.act-ic.ph-on{border-color:#86EFAC!important;background:#DCFCE7!important;color:#16A34A!important}
/* Ghost comment input */
.ghost-inp{width:100%;box-sizing:border-box;border:none;border-bottom:1.5px solid;background:transparent;font-size:12px;padding:3px 0;outline:none;color:#374151;font-family:inherit}
.ghost-inp::placeholder{color:#C8C5BD}
/* Issue strip */
.iss-strip{padding:6px 18px 10px 50px;background:#FFF5F5}
.iss-inp{width:100%;box-sizing:border-box;border:none;border-bottom:1.5px solid #FCA5A5;background:transparent;font-size:12px;padding:3px 0;outline:none;color:#991B1B;font-family:inherit}
.iss-inp::placeholder{color:#FCA5A5}

/* ── Skeleton loaders ── */
.sk{background:linear-gradient(90deg,#F3F2EF 25%,#ECEAE6 50%,#F3F2EF 75%);background-size:200% 100%;animation:sk 1.4s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:14px;margin-bottom:8px}
.sk-line.sm{height:10px;width:60%}
.sk-line.lg{height:20px;width:80%}
.sk-card{background:#fff;border-radius:16px;border:1px solid #EEECE8;padding:16px;margin-bottom:10px}
/* ── Page transitions ── */
.fade{animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

const DAYS3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const dayAbbr=iso=>DAYS3[new Date(iso+'T00:00:00').getDay()].slice(0,3);

function clOn(c,date){if(c.status&&c.status!=='Active')return false;
  if(c.startDate&&date<c.startDate)return false;
  if(c.endDate&&date>c.endDate)return false;
  const dy=dayAbbr(date);
  const dn=new Date(date+'T00:00:00').getDate();
  if(c.frequency==='Daily'){
    if(!c.schedule||c.schedule==='Every day')return true;
    return(c.selectedDays||[]).includes(dy);
  }
  if(c.frequency==='Weekly')return(c.selectedDays||[]).includes(dy);
  if(c.frequency==='Monthly'){
    const lastDay=new Date(new Date(date+'T00:00:00').getFullYear(),new Date(date+'T00:00:00').getMonth()+1,0).getDate();
    const isLast=dn===lastDay;
    const sdt=c.selectedDates||[];
    return sdt.includes(dn)||(isLast&&sdt.includes('L'));
  }
  if(c.frequency==='Custom')return(c.customDates||[]).includes(date);
  return true;
}

let _toast;
function toast(msg,type='ok'){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;z-index:500;left:50%;transform:translateX(-50%);bottom:78px;pointer-events:none';document.body.appendChild(t);}
  const bg=type==='ok'?'#15171C':type==='warn'?'#D97706':'#DC2626';
  t.innerHTML=`<div class="pop" style="background:${bg};color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.25)">${type==='ok'?'✓':'⚠'} ${esc(msg)}</div>`;
  clearTimeout(_toast);_toast=setTimeout(()=>{if(t)t.innerHTML='';},2800);
}

async function loadFromSB(){
  let depts,locs,cls,subs,appr,audit,notifs,profiles,feedbackRows,docFolderRows,docRows,qRows;
  try{
    const res=await Promise.all([
      sb.from('departments').select('*').order('name'),
      sb.from('locations').select('*').order('name'),
      sb.from('checklists').select('*').order('created_at',{ascending:false}),
      sb.from('submissions').select('*').order('submitted_at',{ascending:false}),
      sb.from('approvals').select('*').order('created_at',{ascending:false}),
      sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(300),
      sb.from('notifications').select('*').order('created_at',{ascending:false}),
      sb.from('profiles').select('*').order('first_name'),
      sb.from('feedback').select('*').order('created_at',{ascending:false}),
      sb.from('doc_folders').select('*').order('created_at',{ascending:false}),
      sb.from('documents').select('*').order('uploaded_at',{ascending:false}),
      sb.from('questions').select('*').order('created_at',{ascending:false}),
    ]);
  [depts,locs,cls,subs,appr,audit,notifs,profiles,feedbackRows,docFolderRows,docRows,qRows]=res.map(r=>r.data||[]);
  }catch(e){
    console.error('loadFromSB failed:',e.message);
    return; // Keep existing cached data
  }
  DB.departments=(depts||[]).map(d=>({id:d.id,name:d.name}));
  DB.locations=(locs||[]).map(l=>({id:l.id,name:l.name,address:l.address||'',department:l.department||'',status:l.status||'Active'}));
  if(cls&&cls.length>0)DB.checklists=_mC(cls);
  if(subs&&subs.length>=0)DB.submissions=_mS(subs);
  if(appr&&appr.length>=0)DB.approvals=_mA(appr);
  DB.audit=(audit||[]).map(l=>({id:l.id,actor:l.actor||'',action:l.action||'',target:l.target||'',time:l.created_at}));
  DB.notifications=(notifs||[]).map(n=>({id:n.id,userId:n.user_id,text:n.text||'',read:n.read||false,time:n.created_at}));
  // Preserve questionsAccess set locally (in case Supabase profile column doesn't exist yet)
  const _savedQAccess={};DB.users.forEach(u=>{if(u.questionsAccess)_savedQAccess[u.id]=true;});
  DB.users=_mU(profiles);
  // Re-apply questionsAccess from local snapshot for users where Supabase returned false
  DB.users.forEach(u=>{if(!u.questionsAccess&&_savedQAccess[u.id])u.questionsAccess=true;});
  // Load questions, questionLists and tickets from Supabase (shared across all accounts)
  if(qRows)DB.questions=qRows.map(q=>({id:q.id,text:q.text||'',type:q.type||'answer',options:q.options||[],photo:q.photo||false,approval:q.approval||false,comment:q.comment||false,createdBy:q.created_by||null,createdAt:q.created_at}));

}

  ]);

  if(failed.length)console.warn('[Shiftly sync] '+failed.length+' table(s) failed:',failed.map(r=>r.reason?.message).join(', '));

let _notifCache={uid:null,count:0,ts:0};
function _notifCount(){
  const uid=S.uid;if(!uid)return 0;
  const now=Date.now();
  // Cache for 3 seconds to avoid recalculating on every rr()
  if(_notifCache.uid===uid&&now-_notifCache.ts<3000)return _notifCache.count;
  let count=0;
  if(isAdmin()||isMgr()){
    const myTree=subTree(uid).map(u=>u.id);
    count+=DB.approvals.filter(a=>a.status==='Pending'&&(isAdmin()||myTree.includes(a.requesterId))).length;
  }
  count+=DB.notifications.filter(n=>n.userId===uid&&!n.read).length;
  _notifCache={uid,count,ts:now};
  return count;
}

function _recoverEditingSubmissions(){
  if(!DB.submissions)return;
  DB.submissions.forEach(s=>{

      // Reset to a sensible status based on date
      const today=todayISO();
      const cl=clById(s.checklistId);const late=s.date<today||(s.date===today&&cl?.scheduleTime&&nowHM()>hm2m(cl.scheduleTime));
      s.status=s.editCount>0?(late?'Late':'On Time'):(late?'Late':'Pending');
      console.info('Recovered stuck submission:',s.id,'→',s.status);
    }
  });
}

  if(r==='notifications')return notificationsPage();

App.login=async()=>{
  const email=($('#li-e')?.value||'').trim().toLowerCase();
  const pw=($('#li-p')?.value||'').trim();
  if(!email||!pw){toast('Enter your email and password','err');return;}
  const btn=document.querySelector('button[onclick="App.login()"]');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)throw error;
    // Render from cache immediately so UI appears fast
    const cachedUser=DB.users.find(x=>(x.email||'').toLowerCase()===email);
    if(cachedUser&&cachedUser.status==='Active'){
      S.uid=cachedUser.id;
      S.route=cachedUser.role==='Admin'?'dashboard':'mychecklists';
      render(); // show page instantly
    }
    // Load fresh profile in background
    const{data:profile}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
    if(!profile){await sb.auth.signOut();S.uid=null;render();throw new Error('Profile not found');}
    if(profile.status==='Inactive'){await sb.auth.signOut();S.uid=null;render();throw new Error('Account inactive — contact admin');}
    const u={id:profile.id,firstName:profile.first_name||'',lastName:profile.last_name||'',email:profile.email||'',phone:profile.phone||'',position:profile.position||'',department:profile.department||'',role:profile.role||'User',status:profile.status,managerId:profile.manager_id||null,rules:profile.rules||{past:true,future:true,edit:true},approval:profile.approval_settings||{past:false,future:false,edited:false},docAccess:profile.doc_access||{departments:{},locations:{}},questionsAccess:profile.questions_access||false,password:'***'};
    const idx=DB.users.findIndex(x=>x.id===u.id);
    if(idx>-1)DB.users[idx]=u;else DB.users.push(u);
    S.uid=u.id;
    if(!S.route||S.route==='login')S.route=u.role==='Admin'?'dashboard':'mychecklists';
    saveDB();render();
    // Load full data in background — don't block UI
    loadFromSB().then(()=>{saveDB();if(Date.now()-_lastUserAction>3000)render();}).catch(()=>{});
  }catch(err){
    const msg=err.message.includes('Invalid')||err.message.includes('credentials')||err.message.includes('invalid_grant')
      ?'Incorrect email or password':err.message;
    toast(msg,'err');
    if(btn){btn.disabled=false;btn.textContent='Sign in';}
  }
};

App.saveUser=async(id)=>{
  const g=i=>($('#'+i)?.value||'').trim();
  const fn=g('u-fn'),ln=g('u-ln'),email=g('u-email');
  if(!fn||!ln||!email){toast('Name & email required','err');return;}
  const mId=$('#u-mgr')?.value||null;
  if(id&&mId&&(mId===id||isDesc(mId,id))){toast('Circular hierarchy!','err');return;}

  // ── Read doc permissions FIRST (before any closeModal) ──
  const docAccess={departments:{},locations:{}};
  document.querySelectorAll('.doc-perm-dept').forEach(cb=>{
    const dept=cb.dataset.dept,p=cb.dataset.perm;
    if(!docAccess.departments[dept])docAccess.departments[dept]={view:false,upload:false,download:false,edit:false};
    docAccess.departments[dept][p]=cb.checked;
  });
  document.querySelectorAll('.doc-perm-loc').forEach(cb=>{
    const loc=cb.dataset.loc,p=cb.dataset.perm;
    if(!docAccess.locations[loc])docAccess.locations[loc]={view:false,upload:false,download:false,edit:false};
    docAccess.locations[loc][p]=cb.checked;
  });

  // ── Read ALL toggles and DOM values NOW, before any async/closeModal ──
  const questionsAccess=togV('u-qa');
  const rules={past:togV('u-rp'),future:togV('u-rf'),edit:togV('u-re')};
  const approval_settings={past:togV('u-ap'),future:togV('u-af'),edited:togV('u-ae')};

  const pd={first_name:fn,last_name:ln,email,
    phone:g('u-phone'),position:g('u-pos'),
    department:$('#u-dep')?.value,role:$('#u-role')?.value,
    status:$('#u-status')?.value,manager_id:mId||null,
    rules,approval_settings,
    doc_access:docAccess,questions_access:questionsAccess};

  if(id){
    // Update local state immediately
    const u=uById(id);
    if(u)Object.assign(u,{firstName:fn,lastName:ln,email,
      phone:pd.phone,position:pd.position,department:pd.department,
      role:pd.role,status:pd.status,managerId:mId,
      rules,approval:approval_settings,
      questionsAccess,
      docAccess});
    log(fullName(me()),'Edited user',fn+' '+ln);
    toast('Saved ✓');closeModal();saveDB();render();
    // Sync all fields including doc_access to Supabase in background
    sb.from('profiles').update(pd).eq('id',id).then(({error})=>{
      if(error)console.warn('saveUser sync:',error.message);
    });
  } else {
    const pw=g('u-pw');if(!pw){toast('Password required','err');return;}
    const saveBtn=document.querySelector('[onclick*="saveUser"]');
    if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Creating…';}
    toast('Creating user…','ok');
    const{data:res,error}=await sb.functions.invoke('create-user',{body:{...pd,password:pw}});
    if(error||res?.error){
      let msg=error?.message||res?.error||'Failed';
      try{if(error?.context){const b=await error.context.json();msg=b.error||msg;}}catch(e){}
      toast(msg,'err');
      if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Create';}
      return;
    }
    const newId=res?.id||res?.user?.id;
    if(!newId){toast('User created — reload to see them','ok');closeModal();render();return;}
    DB.users.push({id:newId,firstName:fn,lastName:ln,email,
      phone:pd.phone,position:pd.position,department:pd.department,
      role:pd.role,status:pd.status,managerId:mId,
      rules:pd.rules,approval:pd.approval_settings,
      questionsAccess,
      docAccess,password:'***'});
    // Save doc_access + questions_access for new user
    sb.from('profiles').update({doc_access:docAccess,questions_access:questionsAccess}).eq('id',newId).catch(()=>{});
    log(fullName(me()),'Created user',fn+' '+ln);
    toast('✓ '+fn+' '+ln+' created');
    closeModal();saveDB();render();
  }
};

App.delUser=async(id)=>{
  const u=uById(id);if(!u)return;
  const name=fullName(u);
  if(!confirm('Permanently delete '+name+'?\n\nThis will delete ALL their submissions and approvals. This cannot be undone.\n\nTo keep their data, use Disable instead.'))return;
  // Optimistic local cleanup first
  DB.users.filter(x=>x.managerId===id).forEach(x=>x.managerId=u.managerId);
  DB.users=DB.users.filter(x=>x.id!==id);
  DB.checklists.forEach(c=>c.assignees=(c.assignees||[]).filter(a=>a!==id));
  DB.submissions=DB.submissions.filter(s=>s.userId!==id);
  DB.approvals=DB.approvals.filter(a=>a.requesterId!==id);
  DB.notifications=DB.notifications.filter(n=>n.userId!==id);
  DB.feedback=(DB.feedback||[]).filter(f=>f.userId!==id&&f.managerId!==id);
  // Unassign tickets (don't delete — ticket data is still valid)
  // FIX3: If ex-manager now has 0 direct reports, downgrade to User
  if(u.managerId){
    const exMgr=uById(u.managerId);
    if(exMgr&&exMgr.role==='Manager'){
      const stillHasTeam=DB.users.some(x=>x.managerId===exMgr.id);
      if(!stillHasTeam){
        exMgr.role='User';
        sb.from('profiles').update({role:'User'}).eq('id',exMgr.id).catch(()=>{});
        toast(fullName(exMgr)+' has no team — role changed to User','warn');
      }
    }
  }
  log(fullName(me()),'Deleted user',name);
  toast(name+' deleted','warn');
  render();saveDB();
  // Background Supabase deletion of all related data
  Promise.all([
    sb.from('submissions').delete().eq('user_id',id),
    sb.from('approvals').delete().eq('requester_id',id),
    sb.from('notifications').delete().eq('user_id',id),
    sb.from('feedback').delete().eq('user_id',id),
    sb.from('profiles').delete().eq('id',id),
  ]).catch(e=>console.warn('delUser cleanup:',e));
};

function _scopeDocsTab(type, scopeKey){
  const u=me();const isAdm=isAdmin();
  const da=(u?.docAccess)||{departments:{},locations:{}};
  function perm(){
    if(isAdm)return{view:true,upload:true,download:true,edit:true};
    const map=type==='dept'?da.departments:da.locations;
    return (map&&map[scopeKey])||{};
  }
  const p=perm();
  if(!p.view&&!isAdm)return empty('folder','No access','You do not have document access for this '+(type==='dept'?'department':'location')+'.');

  const folderId=S.filters.docFolder||null;
  const scopeFolders=(DB.folders||[]).filter(f=>f.type===type&&f.scope===scopeKey&&(f.parentId||null)===(folderId||null));
  const scopeDocs=(DB.documents||[]).filter(d=>d.type===type&&d.scope===scopeKey&&(d.folderId||null)===(folderId||null));

  // Breadcrumb
  function buildPath(id){if(!id)return[];const f=(DB.folders||[]).find(x=>x.id===id);if(!f)return[];return[...buildPath(f.parentId||null),f];}
  const crumbs=buildPath(folderId);
  const rootLabel=type==='dept'?scopeKey:(DB.locations.find(l=>l.id===scopeKey)?.name||scopeKey);

  let html='';
  // Breadcrumb bar
  if(crumbs.length){
    html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap">'
      +'<button onclick="App._docNav(null)" style="font-size:13px;font-weight:600;color:#0E9F6E;background:none;border:none;cursor:pointer;padding:0">'+esc(rootLabel)+'</button>'
      +crumbs.map(f=>'<span style="color:#D1D5DB">›</span><button onclick="App._docNav(this.dataset.id)" data-id="'+f.id+'" style="font-size:13px;font-weight:600;color:'+(folderId===f.id?'#15171C':'#0E9F6E')+';background:none;border:none;cursor:pointer;padding:0">'+esc(f.name)+'</button>').join('')
      +'</div>';
  }
  // Toolbar
  html+='<div style="display:flex;gap:8px;margin-bottom:14px">';
  if(isAdm||p.edit)html+='<button onclick="App._newFolderIn(\''+type+'\',\''+scopeKey+'\')" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1.5px solid #ECEDF0;background:#fff;font-size:13px;font-weight:600;cursor:pointer">📁 New folder</button>';
  if(isAdm||p.upload)html+='<button onclick="App._uploadDocIn(\''+type+'\',\''+scopeKey+'\')" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:#15171C;color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer">⬆ Upload file</button>';
  html+='</div>';
  // Empty state
  if(!scopeFolders.length&&!scopeDocs.length){html+=empty('folder','No files yet',(isAdm||p.upload)?'Click "Upload file" to add documents':'No documents uploaded yet.');return html;}
  // Folders grid
  if(scopeFolders.length){
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px">'
      +scopeFolders.map(f=>'<div onclick="App._docNav(this.dataset.id)" data-id="'+f.id+'" class="fld-card" style="background:#fff;border-radius:14px;border:1.5px solid #ECEDF0;padding:14px;cursor:pointer;transition:all .15s">'
        +'<div style="font-size:28px;margin-bottom:8px">📁</div>'
        +'<div style="font-size:13px;font-weight:700">'+esc(f.name)+'</div>'
        +'<div style="font-size:11px;color:#9CA3AF;margin-top:4px">'+((DB.documents||[]).filter(d=>d.folderId===f.id).length)+' files</div>'
        +(isAdm||p.edit?'<button onclick="event.stopPropagation();App._delFolder(this.dataset.id)" data-id="'+f.id+'" style="margin-top:8px;font-size:11px;color:#DC2626;background:none;border:none;cursor:pointer;padding:0">Delete</button>':'')
        +'</div>'
      ).join('')+'</div>';
  }
  // Documents list
  if(scopeDocs.length){
    html+='<div style="background:#fff;border-radius:16px;border:1px solid #ECEDF0;overflow:hidden">'
      +scopeDocs.map((d,i)=>{
        const ext=(d.name.split('.').pop()||'').toLowerCase();
        const icon=ext==='pdf'?'📄':ext.match(/xlsx?|csv/)?'📊':ext.match(/docx?/)?'📝':ext.match(/pptx?/)?'📊':ext.match(/jpe?g|png|gif|webp/)?'🖼':'📎';
        return'<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:'+(i<scopeDocs.length-1?'1px solid #F3F4F6':'none')+'">'
          +'<span style="font-size:22px;flex-shrink:0">'+icon+'</span>'
          +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+esc(d.name)+'</div>'
          +'<div style="font-size:11px;color:#9CA3AF;margin-top:1px">'+(d.uploadedAt?fmtS(d.uploadedAt.slice(0,10)):'')+' · '+(d.uploaderName||'')+(d.fileSize?' · '+_fmtSize(d.fileSize):'')+'</div></div>'
          +'<div style="display:flex;gap:6px;flex-shrink:0">'
          +(p.download||isAdm?'<button onclick="App._downloadDoc(this.dataset.id)" data-id="'+d.id+'" style="padding:5px 10px;border-radius:7px;background:#ECFDF5;color:#0E9F6E;font-size:12px;font-weight:700;border:1px solid #A7F3D0;cursor:pointer">↓ Download</button>':'')
          +(p.view||isAdm?'<button onclick="App._previewDoc(this.dataset.id)" data-id="'+d.id+'" style="padding:5px 10px;border-radius:7px;background:#F6F7F8;color:#374151;font-size:12px;font-weight:700;border:1px solid #ECEDF0;cursor:pointer">View</button>':'')
          +(isAdm||p.edit?'<button onclick="App._delDoc(this.dataset.id)" data-id="'+d.id+'" style="padding:5px 8px;border-radius:7px;background:#FEE2E2;color:#DC2626;font-size:12px;font-weight:700;border:1px solid #FECACA;cursor:pointer">✕</button>':'')
          +'</div></div>';
      }).join('')+'</div>';
  }
  return html;
}

    +'style="width:100%;background:#fff;border:1.5px solid #ECEDF0;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit" '

    +'<button onclick="App._createFolderIn()" style="flex:1;padding:11px;border-radius:10px;background:#15171C;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Create folder</button>'
    +'</div>'
    +'</div>',
    'max-w-sm'
  );
  // Focus and add Enter key handler
  setTimeout(()=>{
    const inp=document.getElementById('nf-name');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown',function handler(e){
        if(e.key==='Enter'){e.preventDefault();App._createFolderIn();}
        if(e.key==='Escape'){App.closeModal();}
      },{once:false});
    }
  },100);

App._createFolderIn=()=>{
  // Guard: prevent double-tap / double-submit
  if(App._folderCtx._creating)return;

  const name=(document.getElementById('nf-name')?.value||'').trim();
  if(!name){
    const inp=document.getElementById('nf-name');
    if(inp){inp.style.borderColor='#EF4444';inp.focus();}
    toast('Enter a folder name','err');
    return;
  }
  const {type:t,scope:s}=App._folderCtx;
  if(!t||!s){toast('Scope error — please try again','err');closeModal();return;}

  // Lock immediately
  App._folderCtx._creating=true;

  // Disable the button visually
  const createBtn=document.querySelector('[onclick="App._createFolderIn()"]');
  if(createBtn){createBtn.disabled=true;createBtn.textContent='Creating…';createBtn.style.opacity='0.7';}

  if(!DB.folders)DB.folders=[];
  const parentId=S.filters.docFolder||null;
  const f={
    id:uid('fld'),name,
    type:t,scope:s,
    parentId,
    createdBy:S.uid,
    createdAt:new Date().toISOString()
  };
  DB.folders.push(f);

  // Close modal first so user sees the result immediately
  closeModal();
  toast('📁 "'+name+'" created');
  App._folderCtx={type:null,scope:null,_creating:false};
  saveDB();
  render();

  // Sync to Supabase in background
  sb.from('doc_folders').insert({
    id:f.id,name:f.name,parent_id:f.parentId||null,
    type:f.type,scope:f.scope,
    created_by:f.createdBy,created_at:f.createdAt
  }).catch(e=>console.warn('folder sync:',e));
  log(fullName(me()),'Created folder',name);
};

function _freqUI(freq){
  if(!CLD)return'';
  const sd=CLD?.selectedDays||[], sdt=CLD?.selectedDates||[], cdt=CLD?.customDates||[];
  const sched=CLD?.schedule||'Every day';

  if(freq==='Daily'){
    return`<div>
      <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Schedule</div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        ${['Every day','Selected weekdays'].map(o=>`<button type="button" data-sched="${o}" onclick="App._dailySched('${o}',this)"
          style="flex:1;padding:8px;border-radius:10px;border:1.5px solid;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;background:${sched===o?'#15171C':'#fff'};color:${sched===o?'#fff':'#6B7280'};border-color:${sched===o?'#15171C':'#ECEDF0'}">${o}</button>`).join('')}
      </div>
      <div id="cn-daysel" style="display:${sched==='Selected weekdays'?'flex':'none'};flex-wrap:wrap;gap:6px">
        ${WKDAYS.map(d=>`<button type="button" onclick="App._togDay('${d}',this)" class="dchip ${sd.includes(d)?'on':''}">${d}</button>`).join('')}
      </div>
    </div>`;
  }

  if(freq==='Weekly'){
    return`<div>
      <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Repeat on</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${WKDAYS.map(d=>`<button type="button" onclick="App._togDay('${d}',this)" class="dchip ${sd.includes(d)?'on':''}">${d}</button>`).join('')}</div>
    </div>`;
  }

  if(freq==='Monthly'){
    // Include 'L' = Last day of month
    const nums=[...Array.from({length:31},(_,i)=>i+1),'L'];
    return`<div>
      <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Days of month</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
        ${nums.map(n=>{const on=sdt.includes(n);return`<button type="button" onclick="App._togDN('${n}',this)"
          style="min-width:${n==='L'?48:32}px;height:32px;border-radius:50%;border:1.5px solid;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;background:${on?'#15171C':'#fff'};color:${on?'#fff':'#6B7280'};border-color:${on?'#15171C':'#ECEDF0'};${n==='L'?'border-radius:8px;padding:0 8px':''}" title="${n==='L'?'Last day of month':n}">${n==='L'?'Last':n}</button>`;}).join('')}
      </div>
      <p style="font-size:11px;color:#9CA3AF">Tip: Select "Last" to always run on the last day of any month (handles 28/29/30/31 automatically)</p>
    </div>`;
  }

  if(freq==='Custom'){
    const now=new Date();const cy=now.getFullYear(),cm=now.getMonth();
    const calYear=CLD._calYear||cy, calMonth=CLD._calMonth||cm;
    const firstDay=new Date(calYear,calMonth,1).getDay();
    const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
    const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const cdt=CLD?.customDates||[];
    const cells=[];for(let i=0;i<firstDay;i++)cells.push('');for(let d=1;d<=daysInMonth;d++)cells.push(d);while(cells.length%7!==0)cells.push('');
    const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
    return`<div>
      <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Pick dates</div>
      <div style="background:#F6F7F8;border-radius:10px;padding:8px;display:inline-block;min-width:220px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <button type="button" onclick="if(!CLD._calYear)CLD._calYear=${cy};if(!CLD._calMonth&&CLD._calMonth!==0)CLD._calMonth=${cm};CLD._calMonth--;if(CLD._calMonth<0){CLD._calMonth=11;CLD._calYear--;}$('#cn-sched').innerHTML=_freqUI('Custom')" style="width:22px;height:22px;border-radius:6px;border:1px solid #ECEDF0;background:#fff;cursor:pointer;display:grid;place-items:center;color:#6B7280">${ic('back','w-3 h-3')}</button>
          <span style="font-size:12px;font-weight:700;color:#15171C">${MN[calMonth]} ${calYear}</span>
          <button type="button" onclick="if(!CLD._calYear)CLD._calYear=${cy};if(!CLD._calMonth&&CLD._calMonth!==0)CLD._calMonth=${cm};CLD._calMonth++;if(CLD._calMonth>11){CLD._calMonth=0;CLD._calYear++;}$('#cn-sched').innerHTML=_freqUI('Custom')" style="width:22px;height:22px;border-radius:6px;border:1px solid #ECEDF0;background:#fff;cursor:pointer;display:grid;place-items:center;color:#6B7280">${ic('chevR','w-3 h-3')}</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px;text-align:center">
          ${['S','M','T','W','T','F','S'].map(d=>`<div style="font-size:9px;font-weight:700;color:#9CA3AF;padding:2px 0">${d}</div>`).join('')}
        </div>
        ${weeks.map(w=>`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px">${w.map(d=>{if(!d)return'<div></div>';const iso=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const on=cdt.includes(iso);const past=iso<todayISO();return`<button type="button" onclick="App._togCalDate('${iso}')" style="aspect-ratio:1;border-radius:6px;border:none;font-size:11px;font-weight:${on?700:400};cursor:pointer;background:${on?'#15171C':'transparent'};color:${on?'#fff':past?'#D1D5DB':'#15171C'};padding:3px 0">${d}</button>`;}).join('')}</div>`).join('')}
      </div>
      ${cdt.length?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${cdt.sort().map(d=>`<span style="display:inline-flex;align-items:center;gap:3px;background:#15171C;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">${fmtS(d)}<button onclick="App._remCD('${d}')" style="background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;padding:0;font-size:13px;line-height:1">×</button></span>`).join('')}</div>`:''}
    </div>`;
  }
  return'';
}

App._freqChange=f=>{
  CLD.frequency=f;CLD.schedule=f==='Daily'?'Every day':'';
  CLD.selectedDays=[];CLD.selectedDates=[];CLD.customDates=[];
  if(f==='Custom'){const n=new Date();CLD._calYear=n.getFullYear();CLD._calMonth=n.getMonth();}
  const sw=$('#cn-sched');if(sw)sw.innerHTML=_freqUI(f);
};
App._dailySched=(o,el)=>{
  CLD.schedule=o;
  // Update button styles
  el.parentNode.querySelectorAll('button[data-sched]').forEach(b=>{
    const active=b.dataset.sched===o;
    b.style.background=active?'#15171C':'#fff';
    b.style.color=active?'#fff':'#6B7280';
    b.style.borderColor=active?'#15171C':'#ECEDF0';
  });
  // Show/hide weekday picker
  const daysel=$('#cn-daysel');
  if(daysel)daysel.style.display=o==='Selected weekdays'?'flex':'none';
};
App._togDay=(d,el)=>{const i=CLD.selectedDays.indexOf(d);if(i>-1)CLD.selectedDays.splice(i,1);else CLD.selectedDays.push(d);el.classList.toggle('on');};
App._togDN=(n,el)=>{
  if(!CLD.selectedDates)CLD.selectedDates=[];
  const val=isNaN(n)?n:Number(n);
  const i=CLD.selectedDates.indexOf(val);
  if(i>-1)CLD.selectedDates.splice(i,1);else CLD.selectedDates.push(val);
  const on=CLD.selectedDates.includes(val);
  el.style.background=on?'#15171C':'#fff';el.style.color=on?'#fff':'#6B7280';el.style.borderColor=on?'#15171C':'#ECEDF0';
};
App._togCalDate=(iso)=>{
  if(!CLD.customDates)CLD.customDates=[];
  const i=CLD.customDates.indexOf(iso);
  if(i>-1)CLD.customDates.splice(i,1);else CLD.customDates.push(iso);
  // Re-render the calendar
  const sw=$('#cn-sched');if(sw)sw.innerHTML=_freqUI('Custom');
};
App._addCD=d=>{if(d&&!(CLD.customDates||[]).includes(d)){if(!CLD.customDates)CLD.customDates=[];CLD.customDates.push(d);const w=$('#cn-cdt');if(w)w.innerHTML+=`<span style="display:inline-flex;align-items:center;gap:4px;background:#15171C;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">${fmtS(d)}<button onclick="App._remCD('${d}')" class="opacity-70 hover:opacity-100">${ic('x','w-3 h-3')}</button></span>`;}};
App._remCD=d=>{CLD.customDates=(CLD.customDates||[]).filter(x=>x!==d);const w=$('#cn-cdt');if(w)w.innerHTML=(CLD.customDates||[]).map(d=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#15171C;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">${fmtS(d)}<button onclick="App._remCD('${d}')" class="opacity-70 hover:opacity-100">${ic('x','w-3 h-3')}</button></span>`).join('');};
App._togLoc=(id,on,el)=>{if(!CLD.locationIds)CLD.locationIds=[];if(on&&!CLD.locationIds.includes(id))CLD.locationIds.push(id);if(!on)CLD.locationIds=CLD.locationIds.filter(x=>x!==id);el.closest('label').className=`inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-xl border cursor-pointer transition ${on?'border-sky-300 bg-sky-50 text-sky-700':'border-ink-200 text-ink-600'}`;};
App._togAsgn=(id,on,el)=>{if(!CLD.assignees)CLD.assignees=[];if(on&&!CLD.assignees.includes(id))CLD.assignees.push(id);if(!on)CLD.assignees=CLD.assignees.filter(a=>a!==id);el.closest('label').className=`flex items-center gap-2 p-2 rounded-xl border cursor-pointer transition text-xs ${on?'border-brand-300 bg-brand-50':'border-ink-100'}`;};

function _taskEditRow(t,i){
  const rt=t.responseType||'tick';
  const crit=t.criticality||'Low';
  const CRIT_COLOR={Low:'#16A34A',Medium:'#D97706',High:'#EA580C',Critical:'#DC2626'};
  const CRIT_BG={Low:'#F0FDF4',Medium:'#FFFBEB',High:'#FFF7ED',Critical:'#FFF5F5'};
  const CRIT_BORDER={Low:'#BBF7D0',Medium:'#FDE68A',High:'#FED7AA',Critical:'#FECACA'};
  const RESP_LABELS={tick:'✓ / ✗',yesno:'Yes / No',passfail:'Pass / Fail',dropdown:'Dropdown',text:'Text',numeric:'Number'};
  const OPT_KEYS=[['photo','cam','Photo'],['comment','msg','Comment'],['approval','approve','Approval']];
  const activeOpts=OPT_KEYS.filter(([k])=>t[k]);
  return`<div style="background:#fff;border-radius:12px;border:1px solid #E5E7EB;overflow:hidden;margin-bottom:6px">
    <!-- Compact single-line header -->
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#FAFAFA;border-bottom:1px solid #F3F4F6">
      <span style="font-size:10px;font-weight:700;color:#9CA3AF;width:16px;text-align:center;flex-shrink:0">${i+1}</span>
      <input value="${esc(t.name)}" onchange="CLD.tasks[${i}].name=this.value" placeholder="Task name *"
        style="flex:1;background:transparent;border:none;font-size:13px;font-weight:600;color:#15171C;outline:none;min-width:0"/>
      <!-- Crit badge -->
      <button onclick="CLD.tasks[${i}].criticality=(['Low','Medium','High','Critical'])[(['Low','Medium','High','Critical'].indexOf('${crit}')+1)%4];App._refreshTasks()"
        style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid ${CRIT_BORDER[crit]};background:${CRIT_BG[crit]};color:${CRIT_COLOR[crit]};cursor:pointer;white-space:nowrap;flex-shrink:0" title="Click to cycle criticality">${crit}</button>
      <!-- Response type -->
      <select onchange="CLD.tasks[${i}].responseType=this.value;App._refreshTasks()"
        style="font-size:11px;font-weight:600;color:#6B7280;background:#F6F7F8;border:1px solid #ECEDF0;border-radius:7px;padding:2px 6px;outline:none;cursor:pointer;flex-shrink:0">
        ${['tick','yesno','passfail','dropdown','text','numeric'].map(v=>`<option value="${v}" ${rt===v?'selected':''}>${RESP_LABELS[v]}</option>`).join('')}
      </select>
      <!-- Time -->
      <input type="time" value="${esc(t.time||'09:00')}" onchange="CLD.tasks[${i}].time=this.value"
        style="font-size:11px;color:#6B7280;background:#F6F7F8;border:1px solid #ECEDF0;border-radius:7px;padding:2px 6px;width:76px;flex-shrink:0;outline:none"/>
      <!-- Options toggles: small icons -->
      <div style="display:flex;gap:3px;flex-shrink:0">
        ${OPT_KEYS.map(([key,icn,lbl])=>`<button type="button" onclick="CLD.tasks[${i}].${key}=!CLD.tasks[${i}].${key};App._refreshTasks()"
          title="${lbl}${t[key]?' (on)':' (off)'}"
          style="width:24px;height:24px;display:grid;place-items:center;border-radius:6px;border:1px solid;cursor:pointer;transition:all .12s;${t[key]?'background:#15171C;color:#fff;border-color:#15171C':'background:transparent;color:#D1D5DB;border-color:#E5E7EB'}">${ic(icn,'w-3 h-3')}</button>`).join('')}
      </div>
      <!-- Delete -->
      <button onclick="CLD.tasks.splice(${i},1);App._refreshTasks()"
        style="width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:#D1D5DB;background:transparent;border:none;cursor:pointer;flex-shrink:0"
        onmouseover="this.style.color='#BE123C';this.style.background='#FFF1F2'" onmouseout="this.style.color='#D1D5DB';this.style.background='transparent'">${ic('trash','w-3 h-3')}</button>
    </div>
    <!-- Optional second line: description + dropdown options -->
    <div style="padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px">
      <input value="${esc(t.description||'')}" onchange="CLD.tasks[${i}].description=this.value" placeholder="Description (optional)"
        style="width:100%;background:transparent;border:none;border-bottom:1px solid #F3F4F6;font-size:12px;color:#9CA3AF;outline:none;padding:2px 0"/>
      ${rt==='dropdown'?`<input value="${esc((t.dropdownOptions||[]).join(', '))}" onchange="CLD.tasks[${i}].dropdownOptions=this.value.split(',').map(x=>x.trim()).filter(Boolean)" placeholder="Dropdown options: Good, Average, Bad (comma-separated)" style="width:100%;background:#F6F7F8;border:1px solid #ECEDF0;border-radius:7px;padding:4px 9px;font-size:12px;outline:none"/>`:'' }
      <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
        <label style="font-size:11px;font-weight:600;color:#9CA3AF;white-space:nowrap;flex-shrink:0">On issue flag, show question list:</label>

      </div>
    </div>
  </div>`;
}

App._addTask=()=>{if(!CLD.tasks)CLD.tasks=[];CLD.tasks.push({id:uid('t'),name:'',description:'',time:'09:00',criticality:'Low',responseType:'tick',dropdownOptions:[],photo:false,comment:false,approval:false});App._refreshTasks();};
App._refreshTasks=()=>{const el=$('#cn-tasks');if(el)el.innerHTML=CLD.tasks.map((t,i)=>_taskEditRow(t,i)).join('')||'<p class="text-sm text-ink-300 py-2">No tasks yet.</p>';};
App._saveCl=async(editing)=>{
  CLD.name=$('#cn-name')?.value.trim();CLD.description=$('#cn-desc')?.value.trim();
  CLD.status=$('#cn-status')?.value||'Active';
  CLD.department=$('#cn-dep')?.value;CLD.frequency=$('#cn-freq')?.value;
  CLD.startDate=$('#cn-sd')?.value||null;CLD.endDate=$('#cn-ed')?.value||null;
  CLD.scheduleTime=$('#cn-time')?.value||null;
  if(!CLD.name){toast('Name required','err');return;}
  CLD.questionIds=CLD.questionIds||[];CLD.tasks=CLD.tasks||[];
  const prevAssignees=editing?((clById(CLD.id)?.assignees)||[]):[];
  if(editing){const idx=DB.checklists.findIndex(c=>c.id===CLD.id);DB.checklists[idx]=CLD;}
  else DB.checklists.push(CLD);
  // Notify + email newly assigned users (skip self, skip already-assigned)
  const newlyAssigned=(CLD.assignees||[]).filter(uid2=>!prevAssignees.includes(uid2)&&uid2!==S.uid);
  newlyAssigned.forEach(uid2=>{
    DB.notifications.unshift({id:uid('n'),userId:uid2,text:'📋 Checklist assigned: "'+CLD.name+'"',time:new Date().toISOString(),read:false});
    queueEmail('checklist_assigned',uid2,null,null,{checklist_name:CLD.name});
  });
  if(newlyAssigned.length)_invalidateNotifCache();
  log(fullName(me()),editing?'Edited cl':'Created cl',CLD.name);

App.dupCl=async(id)=>{
  const src=clById(id);if(!src)return;
  const newId=uid('cl');
  const copy=JSON.parse(JSON.stringify(src)); // deep clone
  copy.id=newId;
  copy.name='Duplicated — '+src.name;
  copy.status='Draft';          // always draft so it can be reviewed before going live
  copy.assignees=[];            // clear assignees — manager will assign fresh
  copy.startDate='';
  copy.endDate='';
  copy.createdBy=S.uid;
  // Give each task a fresh ID to avoid any ID collisions
  (copy.tasks||[]).forEach(t=>{t.id=uid('t');});
  DB.checklists.unshift(copy);  // show at top of list
  // Render immediately — don't wait for Supabase
  log(fullName(me()),'Duplicated checklist',src.name);
  toast('✓ Duplicated as Draft — tap Edit to make changes');
  saveDB();render();
  // Sync to Supabase in background
  sb.from('checklists').insert({
    id:copy.id,name:copy.name,description:copy.description||'',
    department:copy.department||'',frequency:copy.frequency||'Daily',
    schedule:copy.schedule||'',selected_days:copy.selectedDays||[],
    selected_dates:copy.selectedDates||[],custom_dates:copy.customDates||[],
    start_date:null,end_date:null,

    status:'Draft',created_by:S.uid

};

let RUN={};






function myClsPage(){
  const today=todayISO();

  const dayCls=myCls(S.uid,sel);

  const lateN=sel>today?0:dayCls.filter(c=>!subFor(c.id,S.uid,sel)&&(sel<today||(sel===today&&c.scheduleTime&&nowHM()>hm2m(c.scheduleTime)))).length;
  const pendN=dayCls.filter(c=>!subFor(c.id,S.uid,sel)).length-lateN;

  return`<div class="fade">
  <!-- Title row -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">

    </div>
    <div style="display:flex;gap:3px;align-items:center;margin-top:2px">
      <button onclick="(()=>{S.calWk--;const ref2=new Date(todayISO()+'T00:00:00');const dow2=ref2.getDay();ref2.setDate(ref2.getDate()+(dow2===0?-6:1-dow2)+S.calWk*7);const oldDow=new Date(S.calDate+'T00:00:00').getDay()||7;const nd=new Date(ref2);nd.setDate(nd.getDate()+oldDow-1);S.calDate=nd.toISOString().slice(0,10);S.expandedCl=null;rr()})()" style="width:30px;height:30px;border-radius:8px;border:1px solid #EEECE8;background:#fff;cursor:pointer;display:grid;place-items:center;color:#9CA3AF">${ic('back','w-4 h-4')}</button>
      <button onclick="S.calWk=0;S.calDate='${today}';S.expandedCl=null;rr()" style="padding:0 12px;height:30px;border-radius:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:${S.calWk===0&&sel===today?'#111110':'#F5F4F0'};color:${S.calWk===0&&sel===today?'#fff':'#9CA3AF'}">Today</button>
      <button onclick="(()=>{S.calWk++;const ref2=new Date(todayISO()+'T00:00:00');const dow2=ref2.getDay();ref2.setDate(ref2.getDate()+(dow2===0?-6:1-dow2)+S.calWk*7);const oldDow=new Date(S.calDate+'T00:00:00').getDay()||7;const nd=new Date(ref2);nd.setDate(nd.getDate()+oldDow-1);S.calDate=nd.toISOString().slice(0,10);S.expandedCl=null;rr()})()" style="width:30px;height:30px;border-radius:8px;border:1px solid #EEECE8;background:#fff;cursor:pointer;display:grid;place-items:center;color:#9CA3AF">${ic('chevR','w-4 h-4')}</button>
    </div>
  </div>

  <!-- Calendar strip -->
  <div class="cal-strip" style="margin-bottom:12px">
    ${week.map(d=>{
      const dn=DAYS3[new Date(d+'T00:00:00').getDay()];
      const num=new Date(d+'T00:00:00').getDate();
      const isT=d===today;const isSel=d===sel;
      const dCls=myCls(S.uid,d);
      const hasDone=dCls.some(c=>subFor(c.id,S.uid,d));
      const hasPend=dCls.some(c=>!subFor(c.id,S.uid,d));

          ${hasLate?`<span style="width:4px;height:4px;border-radius:50%;background:${isSel?'rgba(255,160,160)':'#EF4444'}"></span>`:hasPend?`<span style="width:4px;height:4px;border-radius:50%;background:${isSel?'rgba(255,210,80)':'#F59E0B'}"></span>`:''}
        </div>

    }).join('')}

  <!-- Pills -->

        </div>`}
  </div></div>`;
}


function _clFooter(c,date,sub,allDone,doneN,issN,total,isPast,isFuture,u,hasEditReq,editApproved){
  const cid=c.id;
  // Guard: never show Submit if already submitted (catches stale RUN state)
  if(sub&&sub.status!=='Editing'){
    const st=sub.submittedAt?new Date(sub.submittedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    const eb=(sub.editCount||0)>0?'<span style="font-size:10px;font-weight:700;background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:10px">edit #'+sub.editCount+'</span>':'';
    const left='<span style="font-size:12px;color:#B8B5AC">Submitted '+st+eb+'</span>';
    let right='';
    if(hasEditReq)right='<span style="font-size:12px;font-weight:600;color:#F97316">Edit pending</span>';
    else if(editApproved)right='<button onclick="App._resubmit(\''+cid+'\',\''+date+'\')" class="submit-pill go">Edit &amp; Resubmit</button>';
    else if(sub.status==='Pending Approval'||sub.status==='Pending')right='<span style="font-size:12px;font-weight:600;color:#F97316">Awaiting approval</span>';
    else if(u?.rules?.edit)right='<button onclick="App._reqEdit(\''+cid+'\',\''+date+'\')" style="font-size:13px;font-weight:700;color:#0D7A4E;background:#ECFDF5;border:1px solid #6EE7B7;border-radius:8px;cursor:pointer;padding:7px 16px">Request edit</button>';
    return left+right;
  }
  if(!sub){
    if(isPast&&!u?.rules?.past)return '<span style="font-size:12px;color:#B36A00;font-weight:600">No permission for past dates</span><span></span>';
    if(isFuture&&!u?.rules?.future)return '<span style="font-size:12px;color:#9CA3AF">Scheduled for this date</span><button class="submit-pill no" disabled style="opacity:.4;cursor:not-allowed">Not yet</button>';
    return '<span></span><button onclick="App._submitRun(\''+cid+'\',\''+date+'\')" class="submit-pill go" data-cl="'+cid+'">\u2713 Submit</button>';
  }
  // Editing mode
  if(sub.status==='Editing'){
    return '<span style="font-size:12px;font-weight:700;color:#0EA5E9">Editing\u2026</span><button onclick="App._submitRun(\''+cid+'\',\''+date+'\')" class="submit-pill go" data-cl="'+cid+'">\u2713 Submit edit</button>';
  }
  return '';
}
function _clCard(c,date){
  const sub=subFor(c.id,S.uid,date);
  const today=todayISO();
  const isPast=date<today;const isFuture=date>today;const u=me();

  // If sub exists and is not in Editing mode, tasks are locked — don't init a fresh RUN
  const isSubmitted=!!sub&&sub.status!=='Editing';
  // Only initialise fresh RUN if: no entry, date changed, OR not currently editing
  if(!RUN[c.id]||(RUN[c.id].date!==date&&RUN[c.id].status!=='Editing')){
    RUN[c.id]={checklistId:c.id,userId:S.uid,date,tasks:[]};

  return`<div class="clc" style="border-top:3px solid ${stBar[st]||'#EEECE8'}">

        const mgr=uById(fb.managerId);

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:12px;font-weight:700;color:#1D4ED8">${ic('msg','w-3.5 h-3.5 inline')} From ${mgr?esc(fullName(mgr)):'Manager'}</span>

  // Orb state

    :isIssue
    ?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 8v5M12 16h.01"/></svg>`

  return`<div class="tkrow">

          <span style="font-size:13px;font-weight:${hasResp?400:600};color:${hasResp?'#B8B5AC':isIssue?'#DC2626':'#111110'};${hasResp?'text-decoration:line-through;':''};line-height:1.3">${esc(t.name)}</span>
          ${t.description?`<span style="font-size:11.5px;color:#C8C5BD">·&thinsp;${esc(t.description)}</span>`:''}
          ${t.time?`<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:${overdue?'#FEE2E2':'#F3F2EF'};color:${overdue?'#DC2626':'#9CA3AF'}">${t.time}${overdue?'&thinsp;·&thinsp;late':''}</span>`:''}
          ${t.approval?`<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#EEF2FF;color:#4338CA">approval</span>`:''}
          ${isIssue?`<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#FEE2E2;color:#DC2626">⚑ issue flagged</span>`:''}
        </div>

        ${t.comment&&!isIssue&&!locked?`<div style="margin-top:6px;padding-left:0"><input type="text" value="${esc(rt.comment||'')}" oninput="App._setCmt('${c.id}',${i},this.value)" placeholder="Leave a comment…" class="ghost-inp" style="border-bottom-color:${!rt.comment?.trim()?'#FCD34D':'#D9D7D2'}"/></div>`:''}
      </div>

      <!-- Right side: response control + action icons -->
      <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;padding-top:1px">

          :(hasResp||isIssue)?`<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:${isIssue?'#FEE2E2':'#DCFCE7'};color:${isIssue?'#DC2626':'#166534'}">${isIssue?'Issue':esc(String(rt.response))}</span>`:''}
        ${t.photo&&!locked
          ?`<button class="act-ic ${rt.photo?'ph-on':''}" onclick="document.getElementById('tph-${c.id}-${i}').click()">${ic('cam','w-3 h-3')}</button><input id="tph-${c.id}-${i}" type="file" accept="image/*" style="display:none" onchange="App._addPh('${c.id}',${i},this)"/>`
          :rt.photo?`<img src="${rt.photo}" onclick="App._bigImg('${rt.photo}')" style="width:26px;height:26px;object-fit:cover;border-radius:6px;border:1.5px solid #86EFAC;cursor:pointer"/>`:''}
      </div>
    </div>

    <!-- Issue strip — inline below, no separate block -->
    ${isIssue?`<div class="iss-strip">
      ${rt.selectedQuestion?`<div style="display:flex;align-items:center;gap:6px;padding:0 0 6px 0;border-bottom:1px solid #FEE2E2;margin-bottom:6px"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#FEE2E2;color:#DC2626">Q</span><span style="font-size:12px;font-weight:600;color:#374151">${esc(rt.selectedQuestion.text)}</span></div>`:''}
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1"><input type="text" ${locked?'disabled':''} value="${esc(rt.issueComment||'')}" oninput="App._issueCmt('${c.id}',${i},this.value)" placeholder="Describe the issue (required to submit)…" class="iss-inp"/></div>
        ${!locked?`<button class="act-ic" onclick="document.getElementById('iph-${c.id}-${i}').click()" style="${rt.issuePhoto?'border-color:#FCA5A5;background:#FEE2E2;color:#DC2626':''}">${ic('cam','w-3 h-3')}</button><input id="iph-${c.id}-${i}" type="file" accept="image/*" style="display:none" onchange="App._issuePh('${c.id}',${i},this)"/>`:'' }

function _respBtns(rType,rt,i,clId,t){
  const r=rt.response;
  const b=(val,lbl,pos)=>`<button class="rc-btn ${r===val?(pos?'rca':'rcb'):''}" onclick="App._setR('${clId}',${i},'${val}')">${lbl}</button>`;
  if(rType==='tick')    return`<div class="rc">${b('ok','✓ Done',1)}${b('x','✕ No',0)}</div>`;
  if(rType==='yesno')   return`<div class="rc">${b('Yes','Yes',1)}${b('No','No',0)}</div>`;
  if(rType==='passfail')return`<div class="rc">${b('Pass','Pass',1)}${b('Fail','Fail',0)}</div>`;
  if(rType==='dropdown')return`<select onchange="App._setR('${clId}',${i},this.value)" style="height:28px;background:#fff;border:1.5px solid #E8E6E1;border-radius:14px;padding:0 10px;font-size:11px;font-weight:700;outline:none;cursor:pointer;color:${r?'#111110':'#9CA3AF'};appearance:none"><option value="">Choose…</option>${(t.dropdownOptions||[]).map(o=>`<option ${r===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(rType==='text')    return`<input type="text" value="${esc(r||'')}" oninput="App._setR('${clId}',${i},this.value,true)" onchange="App._setR('${clId}',${i},this.value)" placeholder="Type here…" style="width:100px;height:28px;background:#fff;border:1.5px solid #E8E6E1;border-radius:14px;padding:0 10px;font-size:11px;font-weight:600;outline:none;color:#111110"/>`;
  if(rType==='numeric') return`<input type="number" value="${esc(r||'')}" oninput="App._setR('${clId}',${i},this.value,true)" onchange="App._setR('${clId}',${i},this.value)" placeholder="0" style="width:64px;height:28px;background:#fff;border:1.5px solid #E8E6E1;border-radius:14px;padding:0 10px;font-size:11px;font-weight:700;outline:none;color:#111110"/>`;
  return'';
}

App._setR=(clId,i,val,skipRr)=>{
  if(!RUN[clId]||!RUN[clId].tasks[i])return;

App._submitRun=async(clId,date)=>{
  const c=clById(clId);const run=RUN[clId];if(!run)return;
  const existingSub=subFor(clId,S.uid,date);if(existingSub&&existingSub.status!=='Editing'){toast('Already submitted for this date','warn');return;}
  const today=todayISO();
  const late=date<today||(date===todayISO()&&c.scheduleTime&&nowHM()>hm2m(c.scheduleTime));
  const _ua=(me()?.approval)||{};
  const _isPast=date<todayISO();const _isFut=date>todayISO();
  const dateAppr=(_isPast&&_ua.past)||(_isFut&&_ua.future);
  const needsAppr=dateAppr;
  const isResub=run.status==='Editing';run.status=needsAppr?'Pending Approval':late?'Late':'On Time';run.submittedAt=new Date().toISOString();const u=me();const mgrId=u?.managerId;if(isResub){const ei=DB.submissions.findIndex(s=>s.checklistId===clId&&s.userId===S.uid&&s.date===date);if(ei>-1){const ex=DB.submissions[ei];ex.tasks=JSON.parse(JSON.stringify(run.tasks));ex.status=run.status;ex.submittedAt=run.submittedAt;ex.editCount=run.editCount||0;ex.editHistory=run.editHistory||[];}if(needsAppr){DB.approvals.push({id:uid('a'),type:'Submission',requesterId:S.uid,checklistId:clId,date,status:'Pending',note:'Resubmitted after edit #'+(run.editCount||1),createdAt:new Date().toISOString(),isResubmit:true});if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:'Re-submitted: '+fullName(u)+' edited and resubmitted — needs re-approval',time:new Date().toISOString(),read:false});}}else{run.id=uid('s');DB.submissions.push(JSON.parse(JSON.stringify(run)));if(needsAppr){DB.approvals.push({id:uid('a'),type:'Submission',requesterId:S.uid,checklistId:clId,date,status:'Pending',note:'Awaiting approval',createdAt:new Date().toISOString()});_invalidateNotifCache();}}
  if(needsAppr){
    const apprText='🔔 Approval needed: '+fullName(u)+' submitted "'+c.name+'" — awaiting your review';
    if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:apprText,time:new Date().toISOString(),read:false});
    const adminU2=DB.users.find(x=>x.role==='Admin');
    if(adminU2&&adminU2.id!==mgrId)DB.notifications.unshift({id:uid('n'),userId:adminU2.id,text:apprText,time:new Date().toISOString(),read:false});
  }
  log(fullName(u),'Submitted '+run.status,c.name);
  toast(needsAppr?'Submitted — pending approval':'Submitted ✓',late||needsAppr?'warn':'ok');
  const sr={id:run.id,checklist_id:clId,user_id:S.uid,date,status:run.status,submitted_at:run.submittedAt,tasks:run.tasks,edit_count:run.editCount||0,edit_history:run.editHistory||[]};
  // 1. Save to localStorage instantly (synchronous — zero delay)
  try{localStorage.setItem(LS_KEY,JSON.stringify({DB,uid:S.uid}));}catch(e){}
  // 2. Render immediately — UI updates in <50ms
  delete RUN[clId];S.expandedCl=null;_invalidateNotifCache();_touchAction();render();
  // 3. Save ONLY this submission to Supabase (targeted — not full _sync of 11 tables)
  sb.from('submissions').upsert(sr,{onConflict:'id'}).then(({error})=>{
    if(error)console.warn('sub upsert:',error.message);
    // After submission saved, sync notifications/approvals/issues in background
    Promise.allSettled([
      DB.approvals.length?sb.from('approvals').upsert(DB.approvals.map(a=>({id:a.id,type:a.type||'Submission',requester_id:a.requesterId,checklist_id:a.checklistId||null,date:a.date||null,status:a.status,note:a.note||'',is_resubmit:a.isResubmit||false,used_at:a.usedAt||null})),{onConflict:'id'}):Promise.resolve(),
      sb.from('notifications').upsert(DB.notifications.slice(0,50).map(n=>({id:n.id,user_id:n.userId,text:n.text,read:n.read||false,created_at:n.time||new Date().toISOString()})),{onConflict:'id'}),
    ]).catch(()=>{});
  }).catch(e=>console.warn('sub upsert failed:',e.message));
};
App._reqEdit=(clId,date)=>{openModal(`<div class="p-6"><div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">Request edit</h2><button onclick="App.closeModal()" class="text-ink-400">${ic('x')}</button></div><p class="text-sm text-ink-400 mb-4">Manager approval required to edit a submission.</p><textarea id="re-n" rows="3" placeholder="Reason for edit…" class="w-full bg-white border border-ink-200 rounded-xl px-3 py-2.5 text-sm rf"></textarea><button onclick="App._sendReq('${clId}','${date}')" style="margin-top:16px;width:100%;background:#15171C;color:#fff;font-weight:600;padding:12px;border-radius:12px;border:none;cursor:pointer">Send request</button></div>`,'max-w-sm');};
App._sendReq=(clId,date)=>{
  const note=$('#re-n')?.value.trim()||'Edit requested';
  const u=me();
  // Guard: prevent duplicate pending edit requests for same checklist+date
  const existingReq=DB.approvals.find(a=>a.type==='Edit Request'&&a.requesterId===S.uid&&a.checklistId===clId&&a.date===date&&a.status==='Pending');
  if(existingReq){toast('Edit request already pending — awaiting manager approval','warn');closeModal();return;}
  DB.approvals.push({id:uid('a'),type:'Edit Request',requesterId:S.uid,checklistId:clId,date,status:'Pending',note,createdAt:new Date().toISOString()});
  // Mark submission status as "Pending Approval" to show in UI
  const sub=DB.submissions.find(s=>s.checklistId===clId&&s.userId===S.uid&&s.date===date);
  if(sub)sub.editRequestStatus='Pending';
  // Notify manager
  const mgrId=u?.managerId;
  const clName=clById(clId)?.name||'a checklist';
  if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:'✏️ Edit request from '+fullName(u)+' for "'+clName+'" on '+fmtS(date),time:new Date().toISOString(),read:false});
  // Notify admin if not same as manager
  const admin=DB.users.find(x=>x.role==='Admin');
  if(admin&&admin.id!==mgrId)DB.notifications.unshift({id:uid('n'),userId:admin.id,text:'Edit request: '+fullName(u)+' — '+clName,time:new Date().toISOString(),read:false});
  _invalidateNotifCache();log(fullName(u),'Edit request',clName);
  toast('Edit request sent to your manager');saveDB();closeModal();render();
};

App._decide=async(id,status)=>{
  const a=DB.approvals.find(x=>x.id===id);if(!a)return;
  if(a.status!=='Pending'){toast('Already '+a.status.toLowerCase(),'warn');return;}
  // Immediately disable buttons to prevent double-click
  document.querySelectorAll(`[data-id="${id}"]`).forEach(b=>{b.disabled=true;b.style.opacity='0.5';});
  a.status=status;
  const u=uById(a.requesterId),c=clById(a.checklistId);
  const s=DB.submissions.find(x=>x.checklistId===a.checklistId&&x.userId===a.requesterId&&x.date===a.date);
  if(s&&a.type==='Submission'){
    if(status==='Approved'){
      s.status=s.status==='Late'?'Late':'On Time';
    } else {
      s.status='Rejected';
    }
  }
  if(s&&a.type==='Edit Request'){
    s.editRequestStatus=status;
    if(status==='Rejected')s.editRequestStatus='Rejected';
  }
  const msg=a.type==='Edit Request'
    ?(status==='Approved'?'✅ Edit approved for "'+c?.name+'" — you can now resubmit':'❌ Edit request rejected for "'+c?.name+'"')
    :(status==='Approved'
      ?'✅ Submission approved — '+c?.name+' on '+fmtD(a.date)
      :'❌ Submission rejected — '+c?.name+'. '+(a.date?fmtD(a.date):''));
  DB.notifications.unshift({id:uid('n'),userId:a.requesterId,text:msg,time:new Date().toISOString(),read:false});
  if(a.type==='Submission'){
    queueEmail(status==='Approved'?'submission_approved':'submission_rejected', a.requesterId, null, null, {checklist_name:c?.name||''});
  } else if(a.type==='Edit Request'){
    queueEmail('approval_decided', a.requesterId, null, null, {checklist_name:c?.name||''});
  }
  log(fullName(me()),status+' '+a.type,fullName(u));
  _invalidateNotifCache();
  // Save to localStorage instantly
  try{localStorage.setItem(LS_KEY,JSON.stringify({DB,uid:S.uid}));}catch(e){}
  toast(status==='Approved'?'Approved ✓':'Rejected',status==='Approved'?'ok':'warn');
  _touchAction();render();
  // Targeted Supabase save — only affected rows, not full 11-table sync
  Promise.allSettled([
    sb.from('approvals').update({status:a.status}).eq('id',a.id),
    s ? sb.from('submissions').update({status:s.status}).eq('id',s.id) : Promise.resolve(),
    sb.from('notifications').upsert(DB.notifications.slice(0,20).map(n=>({id:n.id,user_id:n.userId,text:n.text,read:n.read||false,created_at:n.time||new Date().toISOString()})),{onConflict:'id'}),
  ]).catch(()=>{});
};

const Q_TYPES=[
  {id:'answer',  label:'Answer',     desc:'Multiple choice answers'},
  {id:'number',  label:'Number',     desc:'Numeric value with conditions'},
  {id:'passfail',label:'Pass / Fail',desc:'Pass or Fail response'},
  {id:'yesno',   label:'Yes / No',   desc:'Yes or No response'},
  {id:'tick',    label:'Tick / Cross',desc:'Done or Not done'},

const Q_TYPE_CLR={answer:'#4338CA',number:'#0369A1',passfail:'#16A34A',yesno:'#D97706',tick:'#0E9F6E'};
const Q_TYPE_BG ={answer:'#EEF2FF',number:'#E0F2FE',passfail:'#DCFCE7',yesno:'#FEF9C3',tick:'#ECFDF5'};
const NUM_CONDITIONS=[
  {id:'lt',    label:'Less than'},
  {id:'lte',   label:'Less than or equal'},
  {id:'gt',    label:'Greater than'},
  {id:'gte',   label:'Greater than or equal'},

function questionsPage(){
  const allQ=DB.questions||[];
  const activeUsers=DB.users.filter(u=>u.status==='Active');
  function renderQCard(q){
    const exp=S.filters.expandedQ===q.id;
    const clr=Q_TYPE_CLR[q.type]||'#6B7280';
    const bg=Q_TYPE_BG[q.type]||'#F6F7F8';
    const typeLabel=(Q_TYPES.find(t=>t.id===q.type)||{label:q.type}).label;
    let html=`<div style="background:#fff;border-radius:14px;border:1.5px solid ${exp?'#C7D2FE':'#ECEDF0'};overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.04)">`;

    html+=`<span style="color:#C8C5BD;display:flex;align-items:center;flex-shrink:0;transition:transform .2s;transform:rotate(${exp?90:0}deg)">${ic('chevR','w-4 h-4')}</span>`;
    html+=`<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:${bg};color:${clr};flex-shrink:0">${typeLabel}</span>`;
    html+=`<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:#15171C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.text)}</div>`;

    if(flags.length)html+=`<div style="font-size:11px;color:#9CA3AF;margin-top:2px">${flags.join(' · ')}</div>`;
    html+=`</div>`;

}

App._saveQuestion=()=>{
  if(!_QED)return;
  const text=(_QED.text||'').trim();
  if(!text){toast('Question text is required','err');return;}
  // Validate options
  if(_QED.type==='answer'){
    if(!(_QED.options||[]).some(o=>o.text?.trim())){toast('Add at least one answer option','err');return;}
    _QED.options=(_QED.options||[]).filter(o=>o.text?.trim());
  }
  if(_QED.type==='number'&&!(_QED.options||[]).length){toast('Add at least one condition','err');return;}
  if(!DB.questions)DB.questions=[];
  const existing=DB.questions.findIndex(x=>x.id===_QED.id);
  const isNew=existing===-1;
  if(!isNew){DB.questions[existing]=_QED;}
  else{_QED.createdBy=S.uid;_QED.createdAt=new Date().toISOString();DB.questions.push(_QED);}
  toast(isNew?'Question created ✓':'Saved ✓');
  closeModal();_QED=null;saveDB();render();
};
