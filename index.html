/* ===== QUESTIONS & TICKETS =====
   DATA MODEL:
   DB.questions  = [ {id, text, answers:[{text, assignedTo}]} ]  — standalone questions
   DB.questionLists = [ {id, name, questionIds:[id,...]} ]        — lists reference question IDs
   Checklist task → questionListId → list → questions → answers → ticket per answer
================================================================= */

// ── Helper: get questions that belong to a list ──
function _listQuestions(ql){
  const allQ=DB.questions||[];
  return(ql.questionIds||[]).map(qid=>allQ.find(q=>q.id===qid)).filter(Boolean);
}

// ─────────────────────────────────────────────────────────────
// QUESTIONS PAGE — sub-tab: Questions | Lists
// ─────────────────────────────────────────────────────────────
function questionsPage(){
  const tab=S.filters.qTab||'questions';
  const allQ=DB.questions||[];
  const lists=DB.questionLists||[];

  const tabBar='<div style="display:flex;gap:4px;margin-bottom:20px;background:#F6F7F8;border-radius:12px;padding:4px">'
    +[['questions','help','Questions'],['lists','list','Lists']].map(function(item){
      const k=item[0],icn=item[1],lbl=item[2];
      const active=tab===k;
      return'<button onclick="S.filters.qTab=\''+k+'\';S.filters.qFilt=\'\';rr()"'
        +' style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .12s;background:'+(active?'#fff':'transparent')+';color:'+(active?'#15171C':'#6B7280')+';box-shadow:'+(active?'0 1px 4px rgba(0,0,0,.08)':'none')+'">'+ic(icn,'w-4 h-4')+lbl+'</button>';
    }).join('')
    +'</div>';

  // ══ TAB: QUESTIONS ══
  if(tab==='questions'){
    return'<div class="fade">'+hdr('Questions','')
      +tabBar
      +'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'
      +btnP('New Question','App._newQuestion()','plus')
      +'</div>'
      +(!allQ.length
        ?empty('help','No questions yet','Create questions and add answer options.')
        :'<div class="space-y-2">'
          +allQ.map(function(q){return App._renderQCard(q);}).join('')
          +'</div>')
      +'</div>';
  }

  // ══ TAB: LISTS ══
  return'<div class="fade">'+hdr('Questions','')
    +tabBar
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'
    +btnP('New List','App._newQL()','plus')
    +'</div>'
    +(!lists.length
      ?empty('list','No lists yet','Create a list and select questions from the Questions tab to add to it. Then assign the list to a checklist task.')
      :'<div class="space-y-3">'
        +lists.map(function(ql){
          const qlQs=_listQuestions(ql);
          const openTk=(DB.tickets||[]).filter(function(tk){return tk.questionListId===ql.id&&tk.status==='Open';}).length;
          return'<div style="background:#fff;border-radius:16px;border:1px solid #ECEDF0;overflow:hidden;box-shadow:0 1px 4px rgba(16,24,40,.05)">'
            +'<div style="display:flex;align-items:center;gap:12px;padding:14px 18px">'
            +'<div style="width:38px;height:38px;background:#EFF6FF;border-radius:10px;display:grid;place-items:center;color:#1D4ED8;flex-shrink:0">'+ic('list','w-4 h-4')+'</div>'
            +'<div style="flex:1;min-width:0">'
            +'<div class="fd" style="font-size:15px;font-weight:700">'+esc(ql.name)+'</div>'
            +'<div style="display:flex;gap:10px;margin-top:3px;flex-wrap:wrap">'
            +'<span style="font-size:12px;color:#9CA3AF">'+qlQs.length+' question'+(qlQs.length!==1?'s':'')+'</span>'
            +(openTk?'<span style="font-size:12px;font-weight:700;color:#EF4444">● '+openTk+' open</span>':'<span style="font-size:12px;color:#10B981">✓ No open tickets</span>')
            +'</div></div>'
            +'<div style="display:flex;gap:6px;flex-shrink:0">'
            +'<button onclick="App._editQL(\''+ql.id+'\')" style="padding:6px 14px;border-radius:8px;border:1.5px solid #ECEDF0;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#374151" onmouseover="this.style.background=\'#F6F7F8\'" onmouseout="this.style.background=\'#fff\'">Edit</button>'
            +'<button onclick="App._delQL(\''+ql.id+'\')" style="width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:none;background:transparent;color:#D1D5DB;cursor:pointer" onmouseover="this.style.color=\'#BE123C\';this.style.background=\'#FFF1F2\'" onmouseout="this.style.color=\'#D1D5DB\';this.style.background=\'transparent\'">'+ic('trash','w-4 h-4')+'</button>'
            +'</div></div>'
            +(qlQs.length?'<div style="padding:0 18px 12px">'
              +qlQs.slice(0,3).map(function(q,qi){return'<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #F9F8F5">'
                +'<span style="font-size:11px;font-weight:700;color:#C8C5BD;width:16px;text-align:center">'+(qi+1)+'</span>'
                +'<span style="font-size:13px;color:#374151;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+esc(q.text)+'</span>'
                +'<span style="font-size:11px;color:#9CA3AF">'+(q.answers||[]).length+' answers</span>'
                +'</div>';}).join('')
              +(qlQs.length>3?'<div style="font-size:12px;color:#9CA3AF;padding-top:4px;text-align:center">+' +(qlQs.length-3)+' more</div>':'')
              +'</div>':'')
            +'</div>';
        }).join('')
        +'</div>')
    +'</div>';
}

// ─────────────────────────────────────────────────────────────
// QUESTION CRUD — standalone questions with answer options
// ─────────────────────────────────────────────────────────────
App._renderQCard=(q)=>{
  const answers=q.answers||[];
  const openTk=(DB.tickets||[]).filter(tk=>tk.questionId===q.id&&tk.status==='Open').length;
  const expanded=S.filters.expandedQ===q.id;
  let html='<div style="background:#fff;border-radius:14px;border:1.5px solid '+(expanded?'#C7D2FE':'#ECEDF0')+';overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.04)">';
  // Header row
  html+='<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer" onclick="App._togExpandQ(\''+q.id+'\')">';
  html+='<span style="color:#C8C5BD;display:flex;align-items:center;flex-shrink:0;transition:transform .2s;transform:rotate('+(expanded?90:0)+'deg)">'+ic('chevR','w-4 h-4')+'</span>';
  html+='<div style="flex:1;min-width:0">';
  html+='<div style="font-size:14px;font-weight:600;color:#15171C">'+esc(q.text)+'</div>';
  html+='<div style="display:flex;gap:8px;margin-top:2px;flex-wrap:wrap">';
  html+='<span style="font-size:11px;color:#9CA3AF">'+answers.length+' answer'+(answers.length!==1?'s':'')+'</span>';
  if(openTk)html+='<span style="font-size:11px;font-weight:700;color:#EF4444">● '+openTk+' open</span>';
  html+='</div></div>';
  // Action buttons
  html+='<div style="display:flex;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">';
  html+='<button onclick="App._editQuestion(\''+q.id+'\')" style="padding:5px 12px;border-radius:8px;border:1.5px solid #ECEDF0;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#374151">Edit</button>';
  html+='<button onclick="App._delQuestion(\''+q.id+'\')" style="width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:none;background:transparent;color:#D1D5DB;cursor:pointer" onmouseover="this.style.color=\'#BE123C\';this.style.background=\'#FFF1F2\'" onmouseout="this.style.color=\'#D1D5DB\';this.style.background=\'transparent\'">'+ic('trash','w-4 h-4')+'</button>';
  html+='</div></div>';
  // Expanded answers
  if(expanded){
    if(!answers.length){
      html+='<div style="padding:10px 16px 12px 40px;font-size:12px;color:#D1D5DB;font-style:italic">No answers yet — click Edit to add them</div>';
    } else {
      html+='<div style="padding:0 14px 12px 40px">';
      answers.forEach(function(a,ai){
        const assignee=uById(a.assignedTo);
        const letter=String.fromCharCode(65+ai);
        html+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #F5F4F0">';
        html+='<span style="width:22px;height:22px;border-radius:50%;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#1D4ED8;flex-shrink:0">'+letter+'</span>';
        html+='<span style="flex:1;font-size:13px;color:#374151">'+esc(a.text)+'</span>';
        if(assignee){
          html+='<div style="display:flex;align-items:center;gap:5px;flex-shrink:0">'+avatar(assignee,'w-6 h-6','text-[9px]')+'<span style="font-size:11px;font-weight:600;color:#6B7280">'+esc(fullName(assignee))+'</span></div>';
        } else {
          html+='<span style="font-size:11px;color:#D1D5DB;flex-shrink:0">Unassigned</span>';
        }
        html+='</div>';
      });
      html+='</div>';
    }
  }
  html+='</div>';
  return html;
};
App._togExpandQ=(id)=>{S.filters.expandedQ=S.filters.expandedQ===id?null:id;rr();};
App._newQuestion=()=>App._editQuestion(null);

App._editQuestion=(id)=>{
  if(!DB.questions)DB.questions=[];
  const q=id?DB.questions.find(x=>x.id===id):null;
  window._editingAnswers=q?JSON.parse(JSON.stringify(q.answers||[])):[];

  const buildAnswerRows=()=>{
    const activeUsers=DB.users.filter(u=>u.status==='Active');
    if(!window._editingAnswers.length)
      return'<p style="text-align:center;font-size:12px;color:#D1D5DB;padding:12px">No answer options yet — click Add answer</p>';
    let html='';
    window._editingAnswers.forEach(function(a,ai){
      const letter=String.fromCharCode(65+ai);
      let opts='<option value="">— Assign user —</option>';
      activeUsers.forEach(function(u){opts+='<option value="'+u.id+'"'+(a.assignedTo===u.id?' selected':'')+'>'+esc(fullName(u))+'</option>';});
      html+='<div data-ai="'+ai+'" style="display:flex;align-items:center;gap:8px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:8px 10px;margin-bottom:6px">'
        +'<span style="font-size:11px;font-weight:700;color:#9CA3AF;flex-shrink:0;width:18px;text-align:center">'+letter+'</span>'
        +'<input type="text" data-answer-idx="'+ai+'" value="'+esc(a.text)+'" placeholder="Answer option…" style="flex:1;background:transparent;border:none;border-bottom:1px solid #E5E7EB;font-size:13px;outline:none;color:#15171C;padding:2px 0"/>'
        +'<select data-assign-idx="'+ai+'" style="background:#fff;border:1px solid #E5E7EB;border-radius:7px;padding:3px 8px;font-size:11px;outline:none;color:#374151;max-width:150px">'+opts+'</select>'
        +'<button data-del-ai="'+ai+'" onclick="App._delAnswerRow(this)" style="width:22px;height:22px;display:grid;place-items:center;border-radius:6px;border:none;background:transparent;color:#D1D5DB;cursor:pointer;flex-shrink:0">'+ic('trash','w-3 h-3')+'</button>'
        +'</div>';
    });
    return html;
  };
  App._refreshAnswerRows=()=>{const el=document.getElementById('eq-answers');if(el)el.innerHTML=buildAnswerRows();};

  openModal('<div class="p-5">'
    +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">'+(q?'Edit':'New')+' Question</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
    +'<div class="space-y-4">'
    +'<div><label class="block text-xs font-semibold text-ink-500 mb-1">Question text *</label>'
    +'<input id="eq-text" type="text" value="'+esc(q?.text||'')+'" class="w-full bg-white border border-ink-200 rounded-xl px-3 py-2.5 text-sm rf" placeholder="e.g. Why was this task not completed?"/></div>'
    +'<div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<label class="text-xs font-semibold text-ink-500">Answer options <span style="font-weight:400;color:#9CA3AF">(each answer → ticket for that user)</span></label>'
    +'<button onclick="App._addAnswerRow()" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;background:#0E9F6E;color:#fff;border:none;cursor:pointer">'+ic('plus','w-3 h-3')+' Add answer</button>'
    +'</div>'
    +'<div id="eq-answers"></div>'
    +'</div></div>'
    +'<div class="flex gap-2 mt-5">'
    +'<button onclick="App.closeModal()" style="flex:1;padding:11px;border-radius:11px;border:1.5px solid #ECEDF0;background:#fff;font-weight:600;font-size:14px;cursor:pointer">Cancel</button>'
    +'<button onclick="App._saveQuestion(\''+( id||'')+'\',this)" style="flex:1;padding:11px;border-radius:11px;background:#15171C;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">'+(q?'Save':'Create')+'</button>'
    +'</div></div>','max-w-md');
  setTimeout(()=>{const el=document.getElementById('eq-answers');if(el)el.innerHTML=buildAnswerRows();},0);
};

// Sync current DOM input values back into _editingAnswers before any rebuild
App._syncAnswersFromDOM=()=>{
  document.querySelectorAll('#eq-answers [data-ai]').forEach(function(row){
    const ai=parseInt(row.dataset.ai);
    if(isNaN(ai)||!window._editingAnswers||!window._editingAnswers[ai])return;
    const inp=row.querySelector('[data-answer-idx]');
    const sel=row.querySelector('[data-assign-idx]');
    if(inp)window._editingAnswers[ai].text=inp.value;
    if(sel)window._editingAnswers[ai].assignedTo=sel.value||null;
  });
};
App._addAnswerRow=()=>{
  App._syncAnswersFromDOM(); // save what's typed so far
  if(!window._editingAnswers)window._editingAnswers=[];
  window._editingAnswers.push({text:'',assignedTo:null});
  App._refreshAnswerRows();
  // Focus the new input
  setTimeout(function(){
    const rows=document.querySelectorAll('#eq-answers [data-answer-idx]');
    if(rows.length)rows[rows.length-1].focus();
  },50);
};
App._delAnswerRow=(btn)=>{
  App._syncAnswersFromDOM(); // save what's typed before splicing
  const ai=parseInt(btn.dataset.delAi);
  if(isNaN(ai)||!window._editingAnswers)return;
  window._editingAnswers.splice(ai,1);
  App._refreshAnswerRows();
};

App._saveQuestion=(id,saveBtn)=>{
  const text=($('#eq-text')?.value||'').trim();
  if(!text){toast('Question text required','err');return;}
  // Read answers from DOM
  const answers=[];
  document.querySelectorAll('#eq-answers [data-ai]').forEach(function(row){
    const inp=row.querySelector('[data-answer-idx]');
    const sel=row.querySelector('[data-assign-idx]');
    const t=(inp?.value||'').trim();
    if(t)answers.push({text:t,assignedTo:sel?.value||null});
  });
  if(!DB.questions)DB.questions=[];
  if(id){
    const q=DB.questions.find(x=>x.id===id);
    if(q){q.text=text;q.answers=answers;}
  } else {
    DB.questions.push({id:uid('q'),text,answers});
  }
  toast(id?'Saved ✓':'Question created ✓');closeModal();saveDB();render();
};

App._delQuestion=(id)=>{
  const q=(DB.questions||[]).find(x=>x.id===id);if(!q)return;
  if(!confirm('Delete "'+q.text+'"? It will also be removed from any lists.'))return;
  DB.questions=(DB.questions||[]).filter(x=>x.id!==id);
  // Remove from all lists
  (DB.questionLists||[]).forEach(ql=>{ql.questionIds=(ql.questionIds||[]).filter(x=>x!==id);});
  toast('Deleted','warn');saveDB();render();
};

// ─────────────────────────────────────────────────────────────
// LIST CRUD — lists pick from existing questions
// ─────────────────────────────────────────────────────────────
App._newQL=()=>App._editQL(null);

App._editQL=(id)=>{
  const ql=id?(DB.questionLists||[]).find(x=>x.id===id):null;
  const allQ=DB.questions||[];
  const selectedIds=ql?JSON.parse(JSON.stringify(ql.questionIds||[])):[];

  const buildQRows=()=>{
    if(!allQ.length)return'<p style="font-size:12px;color:#9CA3AF;text-align:center;padding:12px">No questions yet — create them in the Questions tab first</p>';
    let html='';
    allQ.forEach(function(q){
      const on=selectedIds.includes(q.id);
      const ansCount=(q.answers||[]).length;
      html+='<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid '+(on?'#15171C':'#E5E7EB')+';background:'+(on?'#F9FAFB':'#fff')+';cursor:pointer;margin-bottom:6px;transition:all .12s">'
        +'<input type="checkbox" class="sr-only" data-qid="'+q.id+'" '+(on?'checked':'')+' onchange="App._togQLQuestion(this)">'
        +'<div style="width:20px;height:20px;border-radius:6px;border:1.5px solid '+(on?'#15171C':'#D1D5DB')+';background:'+(on?'#15171C':'#fff')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'
        +(on?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>':'')
        +'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:600;color:#15171C">'+esc(q.text)+'</div>'
        +'<div style="font-size:11px;color:#9CA3AF;margin-top:2px">'+ansCount+' answer'+(ansCount!==1?'s':'')+'</div>'
        +'</div></label>';
    });
    return html;
  };
  window._qlSelectedIds=selectedIds;
  App._togQLQuestion=(cb)=>{
    const qid=cb.dataset.qid;
    if(cb.checked){if(!window._qlSelectedIds.includes(qid))window._qlSelectedIds.push(qid);}
    else{window._qlSelectedIds=window._qlSelectedIds.filter(x=>x!==qid);}
    // Update visual
    const lbl=cb.closest('label');if(!lbl)return;
    const on=cb.checked;
    lbl.style.borderColor=on?'#15171C':'#E5E7EB';
    lbl.style.background=on?'#F9FAFB':'#fff';
    const box=lbl.querySelector('div');
    if(box){box.style.borderColor=on?'#15171C':'#D1D5DB';box.style.background=on?'#15171C':'#fff';box.innerHTML=on?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>':'';}
  };

  openModal('<div class="p-5">'
    +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">'+(ql?'Edit':'New')+' Question List</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
    +fld('List name','ql-name',ql?.name||'')
    +'<div style="margin-top:14px">'
    +'<label class="block text-xs font-semibold text-ink-500 mb-2">Select questions to include</label>'
    +'<div id="ql-qpicker" style="max-height:300px;overflow-y:auto">'+buildQRows()+'</div>'
    +'</div>'
    +(allQ.length?'':'<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;color:#92400E">Go to the <strong>Questions tab</strong> to create questions first.</div>')
    +'<div class="flex gap-2 mt-5">'
    +'<button onclick="App.closeModal()" style="flex:1;padding:11px;border-radius:11px;border:1.5px solid #ECEDF0;background:#fff;font-weight:600;font-size:14px;cursor:pointer">Cancel</button>'
    +'<button onclick="App._saveQL(\''+( id||'')+'\')" style="flex:1;padding:11px;border-radius:11px;background:#15171C;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">'+(ql?'Save':'Create')+'</button>'
    +'</div></div>','max-w-md');
};

App._saveQL=(id)=>{
  const name=($('#ql-name')?.value||'').trim();
  if(!name){toast('Name required','err');return;}
  const questionIds=window._qlSelectedIds||[];
  if(!DB.questionLists)DB.questionLists=[];
  if(id){
    const ql=DB.questionLists.find(x=>x.id===id);
    if(ql){ql.name=name;ql.questionIds=questionIds;}
  } else {
    DB.questionLists.push({id:uid('ql'),name,questionIds});
  }
  toast(id?'Saved ✓':'List created ✓');closeModal();saveDB();render();
};

App._delQL=(id)=>{
  const ql=(DB.questionLists||[]).find(x=>x.id===id);if(!ql)return;
  if(!confirm('Delete list "'+ql.name+'"? The questions inside will NOT be deleted.'))return;
  DB.questionLists=(DB.questionLists||[]).filter(x=>x.id!==id);
  DB.checklists.forEach(c=>(c.tasks||[]).forEach(t=>{if(t.questionListId===id)t.questionListId=null;}));
  (DB.tickets||[]).forEach(tk=>{if(tk.questionListId===id)tk.questionListId=null;});
  toast('Deleted','warn');saveDB();render();
};

// ─────────────────────────────────────────────────────────────
// FLAG FLOW — user taps flag on a task → question modal with answer buttons
// ─────────────────────────────────────────────────────────────
App._showQuestionModal=(clId,taskIdx)=>{
  const c=clById(clId);const t=(c?.tasks||[])[taskIdx];if(!t)return;
  const ql=(DB.questionLists||[]).find(x=>x.id===t.questionListId);
  if(!ql){
    const rt=RUN[clId]?.tasks?.[taskIdx];
    if(rt){rt.issue=true;rt.response='Issue';rt.done=true;}
    rr();return;
  }
  // Check for duplicate open ticket
  const existing=(DB.tickets||[]).find(tk=>tk.checklistId===clId&&tk.taskIndex===taskIdx&&tk.status==='Open');
  if(existing){
    openModal('<div class="p-5">'
      +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">Flag Issue</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
      +'<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:12px;padding:14px 16px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+ic('alert','w-4 h-4')+' <span style="font-size:13px;font-weight:700;color:#C2410C">Open ticket already exists</span></div>'
      +'<p style="font-size:12px;color:#92400E;margin:0">Resolve the existing ticket before creating a new one.</p></div>'
      +'<button onclick="App.closeModal()" style="margin-top:16px;width:100%;padding:11px;border-radius:11px;background:#15171C;color:#fff;font-weight:600;font-size:14px;border:none;cursor:pointer">Got it</button>'
      +'</div>','max-w-sm');
    return;
  }
  const questions=_listQuestions(ql);
  if(!questions.length){
    const rt=RUN[clId]?.tasks?.[taskIdx];
    if(rt){rt.issue=true;rt.response='Issue';rt.done=true;}
    toast('Flagged — no questions in this list yet','warn');rr();return;
  }
  App._flagQlId=ql.id;App._flagClId=clId;App._flagTaskIdx=taskIdx;
  App._flagQi=0;App._flagAnswers=[];
  App._showFlagQuestion();
};

App._showFlagQuestion=()=>{
  const ql=(DB.questionLists||[]).find(x=>x.id===App._flagQlId);if(!ql)return;
  const questions=_listQuestions(ql);
  const c=clById(App._flagClId);const t=(c?.tasks||[])[App._flagTaskIdx];
  const qi=App._flagQi;const q=questions[qi];if(!q)return;
  const answers=q.answers||[];
  const total=questions.length;

  let html='<div class="p-5">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'
    +'<div>'
    +(total>1?'<div style="font-size:11px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Question '+(qi+1)+' of '+total+'</div>':'')
    +'<h2 class="fd" style="font-size:18px;font-weight:800">'+esc(q.text)+'</h2>'
    +'</div>'
    +'<button onclick="App.closeModal()" class="text-ink-400 flex-shrink-0">'+ic('x')+'</button>'
    +'</div>'
    +'<div style="font-size:12px;color:#9CA3AF;margin-bottom:16px">'+esc(c?.name||'')+' › '+esc(t?.name||'')+'</div>';

  if(!answers.length){
    html+='<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:12px;font-size:13px;color:#92400E;margin-bottom:12px">No answer options configured. Add them in the Questions tab.</div>';
  } else {
    html+='<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">';
    answers.forEach(function(a,ai){
      const assignee=uById(a.assignedTo);
      html+='<button onclick="App._selectFlagAnswer('+qi+','+ai+')"'
        +' style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;cursor:pointer;text-align:left;transition:all .12s;width:100%"'
        +' onmouseover="this.style.borderColor=\'#EF4444\';this.style.background=\'#FFF5F5\'"'
        +' onmouseout="this.style.borderColor=\'#E5E7EB\';this.style.background=\'#fff\'">'
        +'<span style="width:28px;height:28px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#6B7280;flex-shrink:0">'+String.fromCharCode(65+ai)+'</span>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:14px;font-weight:600;color:#15171C">'+esc(a.text)+'</div>'
        +(assignee?'<div style="font-size:11px;color:#9CA3AF;margin-top:2px">Ticket → '+esc(fullName(assignee))+'</div>':'<div style="font-size:11px;color:#D1D5DB;margin-top:2px">No user assigned</div>')
        +'</div>'
        +(assignee?avatar(assignee,'w-7 h-7','text-[10px]'):'')
        +'</button>';
    });
    html+='</div>';
  }
  html+='<button onclick="App.closeModal()" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #ECEDF0;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:#6B7280">Cancel</button>'
    +'</div>';
  openModal(html,'max-w-sm');
};

App._selectFlagAnswer=(qi,ai)=>{
  const ql=(DB.questionLists||[]).find(x=>x.id===App._flagQlId);if(!ql)return;
  const questions=_listQuestions(ql);
  const q=questions[qi];if(!q)return;
  const a=(q.answers||[])[ai];if(!a)return;
  if(!App._flagAnswers)App._flagAnswers=[];
  App._flagAnswers.push({qi,ai,questionId:q.id,questionText:q.text,answerText:a.text,assignedTo:a.assignedTo||null});
  const nextQi=qi+1;
  if(nextQi<questions.length){App._flagQi=nextQi;App._showFlagQuestion();return;}
  // All questions answered — show note screen
  const c=clById(App._flagClId);const t=(c?.tasks||[])[App._flagTaskIdx];
  let summaryHtml='';
  (App._flagAnswers||[]).forEach(function(fa){
    summaryHtml+='<div style="display:flex;gap:8px;padding:7px 10px;background:#F9FAFB;border-radius:8px;font-size:12px;margin-bottom:4px">'
      +'<span style="color:#9CA3AF;flex-shrink:0">'+esc(fa.questionText)+':</span>'
      +'<span style="font-weight:700;color:#15171C">'+esc(fa.answerText)+'</span>'
      +'</div>';
  });
  openModal('<div class="p-5">'
    +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">Add a note</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
    +'<div style="background:#F9FAFB;border-radius:10px;padding:10px 12px;margin-bottom:14px">'
    +'<div style="font-size:11px;color:#9CA3AF">Task</div>'
    +'<div style="font-size:13px;font-weight:700;color:#15171C">'+esc(c?.name||'')+' › '+esc(t?.name||'')+'</div>'
    +'</div>'
    +'<div style="font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Your answers</div>'
    +summaryHtml
    +'<label style="display:block;font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px">Describe the issue *</label>'
    +'<textarea id="flag-note" rows="3" placeholder="What happened? Add any details…" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 12px;font-size:13px;resize:vertical;outline:none;font-family:inherit" class="rf"></textarea>'
    +'<div class="flex gap-2 mt-4">'
    +'<button onclick="App.closeModal()" style="flex:1;padding:11px;border-radius:11px;border:1.5px solid #ECEDF0;background:#fff;font-weight:600;font-size:14px;cursor:pointer">Cancel</button>'
    +'<button onclick="App._submitFlagAnswers(\''+App._flagClId+'\','+App._flagTaskIdx+')" style="flex:1;padding:11px;border-radius:11px;background:#EF4444;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">'+ic('flag','w-4 h-4 inline')+' Submit</button>'
    +'</div></div>','max-w-sm');
  setTimeout(function(){const el=document.getElementById('flag-note');if(el)el.focus();},100);
};

App._submitFlagAnswers=(clId,taskIdx)=>{
  const comment=($('#flag-note')?.value||'').trim();
  if(!comment){toast('Please describe the issue','err');$('#flag-note')?.focus();return;}
  const c=clById(clId);const t=(c?.tasks||[])[taskIdx];
  const ql=(DB.questionLists||[]).find(x=>x.id===App._flagQlId);
  if(!ql||!t||!c)return;
  const answers=App._flagAnswers||[];
  const rt=RUN[clId]?.tasks?.[taskIdx];
  if(rt){
    rt.issue=true;rt.response='Issue';rt.done=true;rt.issueComment=comment;
    if(answers.length){const f=answers[0];rt.selectedQuestion={qlId:ql.id,qi:f.qi,text:f.questionText+': '+f.answerText,assignedTo:f.assignedTo};}
  }
  if(!DB.tickets)DB.tickets=[];
  const created=[];
  answers.forEach(function(fa){
    const ticket={id:uid('tk'),title:c.name+' › '+t.name+' › '+fa.questionText,
      checklistId:clId,checklistName:c.name,taskIndex:taskIdx,taskName:t.name,
      questionListId:ql.id,questionListName:ql.name,
      questionId:fa.questionId,questionIndex:fa.qi,questionText:fa.questionText,
      answerText:fa.answerText,comment,
      assignedTo:fa.assignedTo||null,createdBy:S.uid,
      createdAt:new Date().toISOString(),status:'Open',resolvedAt:null,resolvedBy:null,notes:''};
    DB.tickets.unshift(ticket);created.push(ticket);
    if(fa.assignedTo&&fa.assignedTo!==S.uid){
      DB.notifications.push({id:uid('n'),userId:fa.assignedTo,
        text:'New ticket: '+t.name+' — '+fa.questionText+': '+fa.answerText+(comment?' — '+comment.slice(0,40):''),
        read:false,time:new Date().toISOString()});
      _invalidateNotifCache();
    }
  });
  log(fullName(me()),'Flagged task',c.name+' › '+t.name);
  toast(created.length+' ticket'+(created.length!==1?'s':'')+' created ✓');
  App._flagAnswers=[];App._flagQi=0;
  closeModal();saveDB();render();
};

// ─────────────────────────────────────────────────────────────
// TICKETS PAGE scoping uses _scopedTickets (defined below)
// ─────────────────────────────────────────────────────────────
App._exportCSV=()=>{
  let subs=DB.submissions;if(!isAdmin())subs=subs.filter(s=>subTree(S.uid).some(u=>u.id===s.userId)||s.userId===S.uid);
  const f=S.filters;const fArr=k=>Array.isArray(f[k])?f[k]:(f[k]?[f[k]]:[]);
  if(fArr('users').length)subs=subs.filter(s=>fArr('users').includes(s.userId));
  if(fArr('deps').length)subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('deps').includes(c?.department);});
  if(fArr('stats').length)subs=subs.filter(s=>fArr('stats').includes(s.status));
  if(f.dr1)subs=subs.filter(s=>s.date>=f.dr1);if(f.dr2)subs=subs.filter(s=>s.date<=f.dr2);
  if(f.issue==='yes')subs=subs.filter(s=>(s.tasks||[]).some(t=>t.issue));
  const summaryRows=[['#','User','Email','Phone','Department','Position','Checklist','Dept','Location(s)','Date','Status','Submitted At','Edit Count','Total Tasks','Completed','Issues','Task Photos','Issue Photos','Pending Approval']];
  subs.forEach((s,i)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u||!c)return;const locs=(c.locationIds||[]).map(id=>DB.locations.find(l=>l.id===id)?.name||'').join('; ');const rt=s.tasks||[];summaryRows.push([i+1,fullName(u),u.email||'',u.phone||'',u.department||'',u.position||'',c.name,c.department||'',locs,s.date,s.status,s.submittedAt?new Date(s.submittedAt).toLocaleString('en-GB'):'',s.editCount||0,(c.tasks||[]).length,rt.filter(t=>t.response!==null&&t.response!==undefined&&!t.issue).length,rt.filter(t=>t.issue).length,rt.filter(t=>t.photo).length,rt.filter(t=>t.issuePhoto).length,s.status==='Pending Approval'?'Yes':'No']);});
  const taskRows=[['Sub #','User','Email','Checklist','Date','Status','Task #','Task Name','Criticality','Type','Response','Done','Issue','Issue Comment','Photo','Issue Photo','Comment']];
  subs.forEach((s,si)=>{const u=uById(s.userId),c=clById(s.checklistId);if(!u||!c)return;(c.tasks||[]).forEach((t,ti)=>{const rt=(s.tasks||[])[ti]||{};taskRows.push([si+1,fullName(u),u.email||'',c.name,s.date,s.status,ti+1,t.name||'',t.criticality||'Low',t.responseType||'tick',rt.response!==null&&rt.response!==undefined?String(rt.response):'',rt.issue?'No':(rt.response!==null&&rt.response!==undefined?'Yes':'No'),rt.issue?'Yes':'No',rt.issueComment||'',rt.photo?'Yes':'No',rt.issuePhoto?'Yes':'No',rt.comment||'']);});});
  const all=[...summaryRows,[],['=== TASK DETAIL (one row per task) ==='],[],...taskRows];
  const csv=all.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='shiftly_export_'+todayISO()+'.csv';a.click();
  toast('Exported '+subs.length+' submissions ('+(taskRows.length-1)+' task rows)');
};

</script>
