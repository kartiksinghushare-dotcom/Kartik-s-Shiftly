App._submitRun=(clId,date)=>{
  const c=clById(clId);const run=RUN[clId];if(!run)return;
  const existingSub=subFor(clId,S.uid,date);if(existingSub&&existingSub.status!=='Editing'){toast('Already submitted for this date','warn');return;}
  for(let i=0;i<(c.tasks||[]).length;i++){
    const t=c.tasks[i],rt=run.tasks[i]||{};
    // Issue-flagged tasks need response='Issue' AND a comment
    if(rt.response===null||rt.response===undefined){toast('Complete "'+t.name+'" — tap Done/Pass/Yes or flag an issue','warn');return;}
    if(rt.issue&&!rt.issueComment?.trim()){toast('Issue comment required for "'+t.name+'"','warn');return;}
    if(t.photo&&!rt.photo&&!rt.issue){
      // Scroll to task and highlight camera button
      const camBtn=document.querySelector('.ph-on-'+clId+'-'+i)||document.getElementById('tph-'+clId+'-'+i);
      if(camBtn)camBtn.scrollIntoView({behavior:'smooth',block:'center'});
      toast('📷 Photo required for "'+t.name+'" — tap the camera icon','warn');return;
    }
  }
  const today=todayISO();
  const late=date<today||(date===todayISO()&&(c.tasks||[]).some(t=>t.time&&nowHM()>hm2m(t.time)));
  // needsAppr: task-level flag OR user's date-type approval settings
  const _ua=(me()?.approval)||{};
  const _isPast=date<todayISO();const _isFut=date>todayISO();
  const dateAppr=(_isPast&&_ua.past)||(_isFut&&_ua.future);
  const needsAppr=(c.tasks||[]).some(t=>t.approval)||dateAppr;
  const hasIssues=(run.tasks||[]).some(t=>t.issue);
  const isResub=run.status==='Editing';run.status=needsAppr?'Pending Approval':late?'Late':'On Time';run.submittedAt=new Date().toISOString();const u=me();const mgrId=u?.managerId;if(isResub){const ei=DB.submissions.findIndex(s=>s.checklistId===clId&&s.userId===S.uid&&s.date===date);if(ei>-1){const ex=DB.submissions[ei];ex.tasks=JSON.parse(JSON.stringify(run.tasks));ex.status=run.status;ex.submittedAt=run.submittedAt;ex.editCount=run.editCount||0;ex.editHistory=run.editHistory||[];}if(needsAppr){DB.approvals.push({id:uid('a'),type:'Submission',requesterId:S.uid,checklistId:clId,date,status:'Pending',note:'Resubmitted after edit #'+(run.editCount||1),createdAt:new Date().toISOString(),isResubmit:true});if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:'Re-submitted: '+fullName(u)+' edited and resubmitted — needs re-approval',time:new Date().toISOString(),read:false});}}else{run.id=uid('s');DB.submissions.push(JSON.parse(JSON.stringify(run)));if(needsAppr){DB.approvals.push({id:uid('a'),type:'Submission',requesterId:S.uid,checklistId:clId,date,status:'Pending',note:'Awaiting approval',createdAt:new Date().toISOString()});_invalidateNotifCache();}}
  if(hasIssues){
    const names=(c.tasks||[]).filter((_,i)=>run.tasks[i]?.issue).map(t=>t.name).join(', ');
    const issText='⚠️ '+fullName(u)+' flagged issues in "'+c.name+'" ('+names+') on '+fmtS(date);
    if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:issText,time:new Date().toISOString(),read:false});
    const adminU=DB.users.find(x=>x.role==='Admin');
    if(adminU&&adminU.id!==mgrId)DB.notifications.unshift({id:uid('n'),userId:adminU.id,text:issText,time:new Date().toISOString(),read:false});
    // Create issue records for each flagged task
    if(!DB.issues)DB.issues=[];
    const subId=isResub?DB.submissions.find(s=>s.checklistId===clId&&s.userId===S.uid&&s.date===date)?.id:run.id;
    (c.tasks||[]).forEach((t,i)=>{
      if(run.tasks[i]?.issue){
        // Check if issue already exists for this task+date
        const exists=DB.issues.find(iss=>iss.checklistId===clId&&iss.userId===S.uid&&iss.date===date&&iss.taskIndex===i);
        if(exists){exists.status='Open';exists.comment=run.tasks[i].issueComment||'';exists.photo=run.tasks[i].issuePhoto||null;exists.updatedAt=new Date().toISOString();}
        else{DB.issues.push({id:uid('iss'),submissionId:subId,checklistId:clId,userId:S.uid,date,taskIndex:i,taskName:t.name,comment:run.tasks[i].issueComment||'',photo:run.tasks[i].issuePhoto||null,status:'Open',managerNotes:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});_invalidateNotifCache();}
      }
    });
  }
  if(needsAppr){
    const apprText='🔔 Approval needed: '+fullName(u)+' submitted "'+c.name+'" — awaiting your review';
    if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:apprText,time:new Date().toISOString(),read:false});
    const adminU2=DB.users.find(x=>x.role==='Admin');
    if(adminU2&&adminU2.id!==mgrId)DB.notifications.unshift({id:uid('n'),userId:adminU2.id,text:apprText,time:new Date().toISOString(),read:false});
  }
  log(fullName(u),'Submitted '+run.status,c.name);
  toast(hasIssues?'Submitted with issues ⚑':needsAppr?'Submitted — pending approval':'Submitted ✓',hasIssues||late||needsAppr?'warn':'ok');
  const sr={id:run.id,checklist_id:clId,user_id:S.uid,date,status:run.status,submitted_at:run.submittedAt,tasks:run.tasks,edit_count:run.editCount||0,edit_history:run.editHistory||[]};sb.from('submissions').upsert(sr,{onConflict:'id'}).catch(e=>console.warn('sub:',e));delete RUN[clId];S.expandedCl=null;saveDB();render();
};

App._sendReq=(clId,date)=>{

  // Guard: prevent duplicate pending edit requests for same checklist+date
  const existingReq=DB.approvals.find(a=>a.type==='Edit Request'&&a.requesterId===S.uid&&a.checklistId===clId&&a.date===date&&a.status==='Pending');

  const mgrId=u?.managerId;

  if(mgrId)DB.notifications.unshift({id:uid('n'),userId:mgrId,text:'✏️ Edit request from '+fullName(u)+' for "'+clName+'" on '+fmtS(date),time:new Date().toISOString(),read:false});
  // Notify admin if not same as manager
  const admin=DB.users.find(x=>x.role==='Admin');
  if(admin&&admin.id!==mgrId)DB.notifications.unshift({id:uid('n'),userId:admin.id,text:'Edit request: '+fullName(u)+' — '+clName,time:new Date().toISOString(),read:false});
  log(fullName(u),'Edit request',clName);
  toast('Edit request sent to your manager');saveDB();closeModal();render();
};

App._decide=(id,status)=>{
  const a=DB.approvals.find(x=>x.id===id);if(!a)return;
  if(a.status!=='Pending'){toast('Already '+a.status.toLowerCase(),'warn');return;}
  a.status=status;
  const u=uById(a.requesterId),c=clById(a.checklistId);
  const s=DB.submissions.find(x=>x.checklistId===a.checklistId&&x.userId===a.requesterId&&x.date===a.date);
  if(s&&a.type==='Submission'){
    if(status==='Approved'){
      // Preserve 'Late' if the submission was originally late
      s.status=s.status==='Late'?'Late':'On Time';
    } else {
      s.status='Rejected';
    }
  }
  if(s&&a.type==='Edit Request'){
    s.editRequestStatus=status;
    // If rejected, clear any pending edit status
    if(status==='Rejected')s.editRequestStatus='Rejected';
  }
  const msg=a.type==='Edit Request'
    ?(status==='Approved'?'✅ Edit approved for "'+c?.name+'" — you can now resubmit':'❌ Edit request rejected for "'+c?.name+'"')
    :(status==='Approved'
      ?'✅ Submission approved — '+c?.name+' on '+fmtD(a.date)
      :'❌ Submission rejected — '+c?.name+'. '+( a.date?fmtD(a.date):''));
  DB.notifications.unshift({id:uid('n'),userId:a.requesterId,text:msg,time:new Date().toISOString(),read:false});
  sb.from('approvals').update({status:a.status}).eq('id',a.id).catch(()=>{});
  if(s)sb.from('submissions').update({status:s.status}).eq('id',s.id).catch(()=>{});
  log(fullName(me()),status+' '+a.type,fullName(u));
  _invalidateNotifCache();saveDB();toast(status==='Approved'?'Approved ✓':'Rejected',status==='Approved'?'ok':'warn');
  render();
};

        // Show their reply

function notificationsPage(){
  const uid=S.uid;
  const notifs=DB.notifications.filter(n=>n.userId===uid).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,80);
  // Track which were unread BEFORE marking them (so the dot shows on this render)
  const unreadIds=new Set(notifs.filter(n=>!n.read).map(n=>n.id));
  const hadUnread=unreadIds.size>0;
  // Mark as read after snapshot — do it now so next render they're read
  notifs.forEach(n=>n.read=true);
  if(hadUnread){_invalidateNotifCache();setTimeout(()=>saveDB(),300);}
  // Feedback for this user
  const myFb=DB.feedback.filter(fb=>fb.userId===uid).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const unackFb=myFb.filter(fb=>!fb.acknowledged);

  const tab=S.filters.ntab||'All';
  const TABS=['All','Approvals','Feedback','Issues'];

  function notifType(text){
    if(!text)return'general';
    if(text.includes('💬')||text.includes('replied')||text.includes('reply'))return'feedback';
    if(text.includes('Feedback')||text.includes('feedback'))return'feedback';
    if(text.includes('⚠')||text.includes('issue')||text.includes('Issue')||text.includes('flagged'))return'issue';
    if(text.includes('resolved')||text.includes('Resolved')||text.includes('Reopened'))return'issue';
    if(text.includes('Approved')||text.includes('approved'))return'approval';
    if(text.includes('Rejected')||text.includes('rejected'))return'approval';
    if(text.includes('pproval')||text.includes('pprove'))return'approval';
    if(text.includes('Edit')||text.includes('edit request')||text.includes('resubmit'))return'edit';
    if(text.includes('Re-submitted')||text.includes('Resubmit'))return'edit';
    if(text.includes('overdue')||text.includes('Late')||text.includes('late'))return'late';
    return'general';
  }
  const TYPE_CLR={approval:'#8B5CF6',edit:'#0EA5E9',issue:'#F97316',feedback:'#3B82F6',late:'#EF4444',general:'#6B7280'};
  const TYPE_BG={approval:'#EDE9FE',edit:'#E0F2FE',issue:'#FFF7ED',feedback:'#EFF6FF',late:'#FEF2F2',general:'#F6F7F8'};
  const TYPE_ICON={approval:'approve',edit:'edit',issue:'flag',feedback:'msg',late:'clock',general:'bell'};

  const filteredNotifs=tab==='All'?notifs
    :tab==='Approvals'?notifs.filter(n=>['approval','edit'].includes(notifType(n.text)))
    :tab==='Feedback'?notifs.filter(n=>notifType(n.text)==='feedback')
    :tab==='Issues'?notifs.filter(n=>notifType(n.text)==='issue')
    :notifs;

  const counts={
    All:notifs.length,
    Approvals:notifs.filter(n=>['approval','edit'].includes(notifType(n.text))).length,
    Feedback:notifs.filter(n=>notifType(n.text)==='feedback').length+myFb.filter(fb=>!fb.acknowledged).length,
    Issues:notifs.filter(n=>notifType(n.text)==='issue').length,
  };

  return '<div class="fade">'+hdr('Notifications','')
    // Tabs
    +'<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">'
    +TABS.map(t=>{
      const active=tab===t;
      const badge=counts[t]?(' <span style="font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;background:'+(active?'rgba(255,255,255,0.25)':'#F3F4F6')+';color:'+(active?'#fff':'#6B7280')+'">'+counts[t]+'</span>'):'';
      return '<button onclick="App._setNTab(this.dataset.t)" data-t="'+t+'" style="padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:'+(active?'#15171C':'transparent')+';color:'+(active?'#fff':'#6B7280')+'">'+t+badge+'</button>';
    }).join('')
    +'</div>'
    // Feedback section (when tab=Feedback)
    +(tab==='Feedback'
      ? _feedbackTabContent(uid)
      // Notification timeline for other tabs
      : (filteredNotifs.length
        ? '<div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden">'
          +'<div style="display:flex;flex-direction:column">'
          +filteredNotifs.map((n,idx)=>{
              const type=notifType(n.text);
              const clr=TYPE_CLR[type];const bg=TYPE_BG[type];const ico=TYPE_ICON[type];
              const isNew=unreadIds.has(n.id);
              // Parse deep-link target from notification text
              return '<div style="display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid #F9F8F5;cursor:pointer;'+(isNew?'background:#FAFFFE':'background:#fff')+'" onclick="App._notifClick(this.dataset.id)" data-id="'+n.id+'">'
                +'<div style="width:36px;height:36px;border-radius:10px;background:'+bg+';display:grid;place-items:center;flex-shrink:0;margin-top:1px">'+ic(ico,'w-4 h-4 text-['+clr+']')+'</div>'
                +'<div style="flex:1;min-width:0">'
                +'<p style="font-size:13px;color:#111110;margin:0;line-height:1.5;font-weight:'+(isNew?'600':'400')+'">'+esc(n.text)+'</p>'
                +'<p style="font-size:11px;color:#B8B5AC;margin-top:3px">'+(n.time?new Date(n.time).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+' · '+type.charAt(0).toUpperCase()+type.slice(1)+'</p>'
                +'</div>'
                +(isNew?'<div style="width:7px;height:7px;border-radius:50%;background:#0E9F6E;flex-shrink:0;margin-top:6px"></div>':'')
                +'</div>';
            }).join('')
          +'</div></div>'
        : empty('bell','All clear','No notifications yet.')
      )
    )
    +'</div>';
}
App._setNTab=(t)=>{S.filters.ntab=t;rr();};
App._setFbView=(v)=>{S.filters.fbView=v;rr();};
App._notifClick=(id)=>{
  const n=DB.notifications.find(x=>x.id===id);if(!n)return;
  n.read=true;_invalidateNotifCache();saveDB();
  const t=n.text||'';
  // Navigate first with clean filters, then set the tab
  if(t.includes('💬')||t.includes('replied')||t.includes('Feedback')){
    App._goNotifFeedback();return;
  }
  if(t.includes('Issue')||t.includes('issue')||t.includes('⚑')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Issues'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('approved')||t.includes('Approved')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Approved'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('rejected')||t.includes('Rejected')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Rejected'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('approval')||t.includes('Pending')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Pending'};render();window.scrollTo(0,0);return;
  }
  if(t.includes('submitted')||t.includes('resubmit')||t.includes('Re-submitted')){
    S.route='approvals';S.search='';S.expandedCl=null;S.afOpen=null;S.tvUser=null;
    S.filters={atab:'Pending'};render();window.scrollTo(0,0);return;
  }
  // Ticket notification → go to tickets tab
  if(t.includes('ticket')||t.includes('Ticket')){
    App.go('tickets');return;
  }
  // Checklist removed → go to my checklists
  if(t.includes('Checklist removed')||t.includes('no longer assigned')){
    App.go('mychecklists');return;
  }
  // Default: go to notifications
  App._setNTab('All');App.go('notifications');
};
function _notifTypeGlobal(text){
  if(!text)return'general';
  if(text.includes('💬')||text.includes('replied')||text.includes('reply'))return'feedback';
  if(text.includes('Feedback')||text.includes('feedback'))return'feedback';
  if(text.includes('⚠')||text.includes('issue')||text.includes('Issue')||text.includes('flagged'))return'issue';
  if(text.includes('resolved')||text.includes('Resolved')||text.includes('Reopened'))return'issue';
  if(text.includes('Approved')||text.includes('approved'))return'approval';
  if(text.includes('Rejected')||text.includes('rejected'))return'approval';
  if(text.includes('pproval')||text.includes('pprove'))return'approval';
  if(text.includes('Edit')||text.includes('edit request')||text.includes('resubmit'))return'edit';
  if(text.includes('Re-submitted')||text.includes('Resubmit'))return'edit';
  if(text.includes('overdue')||text.includes('Late')||text.includes('late'))return'late';
  return'general';
}

App._sfbSelectType=(btn)=>{
  document.querySelectorAll('[data-type]').forEach(b=>{

    b.style.background=active?'#15171C':'#fff';
    b.style.color=active?'#fff':'#6B7280';
    b.style.borderColor=active?'#15171C':'#E5E7EB';
  });
  const type=btn.dataset.type;
  // Store in hidden input for reliable reading
  const hid=document.getElementById('sfb-type-val');if(hid)hid.value=type;
  // Show/hide checklist+task based on type — use explicit wrapper IDs
  const clWrap=document.getElementById('sfb-cl-wrap');
  const taskWrap=document.getElementById('sfb-task-wrap');
  if(type==='Performance'||type==='General'){
    if(clWrap)clWrap.style.display='none';
    if(taskWrap)taskWrap.style.display='none';
  } else if(type==='Checklist'){
    if(clWrap)clWrap.style.display='';
    if(taskWrap)taskWrap.style.display='none';
  } else {
    if(clWrap)clWrap.style.display='';
    if(taskWrap){const clId=document.getElementById('sfb-cl')?.value;if(clId)taskWrap.style.display='';}
  }
};
App._sfbClChange=(clId)=>{
  const taskWrap=document.getElementById('sfb-task-wrap');

  if(f.dr2)allTk=allTk.filter(tk=>(tk.createdAt||'').slice(0,10)<=f.dr2);
  // User filter
  if(fArr('users').length)allTk=allTk.filter(tk=>fArr('users').includes(tk.createdBy));

  const open=allTk.filter(t=>t.status==='Open').length;
  const resolved=allTk.filter(t=>t.status==='Resolved').length;

  if(qRows.length){

function analyticsPage(){
  const today=todayISO();

  let subs=DB.submissions;
  if(!isAdmin())subs=subs.filter(s=>subTree(S.uid).some(u=>u.id===s.userId)||s.userId===S.uid);

  if(fArr('users').length)  subs=subs.filter(s=>fArr('users').includes(s.userId));
  if(fArr('deps').length)   subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('deps').includes(c?.department);});
  if(fArr('locs').length)   subs=subs.filter(s=>{const c=clById(s.checklistId);return fArr('locs').some(l=>(c?.locationIds||[]).includes(l));});
  if(fArr('stats').length)  subs=subs.filter(s=>fArr('stats').includes(s.status));
  if(f.dr1) subs=subs.filter(s=>s.date>=f.dr1);
  if(f.dr2) subs=subs.filter(s=>s.date<=f.dr2);
  if(f.issue==='yes') subs=subs.filter(s=>(s.tasks||[]).some(t=>t.issue));

  const tot=Math.max(subs.length,1);
  const byS={'On Time':0,'Late':0,'Pending Approval':0,'Rejected':0,'Pending (not submitted)':0};
  subs.forEach(s=>{if(byS[s.status]!==undefined)byS[s.status]++;else byS['Pending (not submitted)']++;});

  // Count missed (assigned but no submission for past dates)
  const relevantUsers=isAdmin()?DB.users:[me(),...subTree(S.uid)].filter(Boolean);
  const dateRange=[];
  const dr1=f.dr1||(new Date(Date.now()-30*86400000).toISOString().slice(0,10));
  const dr2=f.dr2||today;
  let d=new Date(dr1+'T00:00:00');const dEnd=new Date(dr2+'T00:00:00');
  while(d<=dEnd&&dateRange.length<60){dateRange.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  let totalAssigned=0,totalMissed=0;
  relevantUsers.forEach(u=>{
    if(fArr('users').length&&!fArr('users').includes(u.id))return;
    dateRange.forEach(dt=>{
      const cls=DB.checklists.filter(c=>(c.assignees||[]).includes(u.id)&&clOn(c,dt));
      cls.forEach(c=>{
        totalAssigned++;
        if(!DB.submissions.find(s=>s.checklistId===c.id&&s.userId===u.id&&s.date===dt)&&dt<today){
          totalMissed++;
        }
      });
    });
  });

  const flagged=subs.reduce((n,s)=>n+(s.tasks||[]).filter(t=>t.issue).length,0);
  const topU=relevantUsers.map(u=>({u,n:subs.filter(s=>s.userId===u.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const recent=subs.slice().sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')).slice(0,50);
  const activeCount=fArr('users').length+fArr('deps').length+fArr('locs').length+fArr('stats').length+(f.dr1?1:0)+(f.dr2?1:0)+(f.issue==='yes'?1:0);

  function msDropdown(label,key,items,getId,getLabel){
    const sel=fArr(key);const isOpen=S.afOpen===key;
    const txt=sel.length===0?'All':sel.length===1?getLabel(items.find(x=>getId(x)===sel[0])||items[0])||'?':sel.length+' selected';
    return`<div data-af="1" style="position:relative;flex:1;min-width:120px">
      <button data-af="1" type="button" onclick="S.afOpen=S.afOpen==='${key}'?null:'${key}';rr()"
        style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1.5px solid ${isOpen?'#10B981':sel.length?'#15171C':'#E5E7EB'};border-radius:10px;padding:7px 12px;font-size:13px;font-weight:${sel.length?600:400};color:${sel.length?'#15171C':'#9CA3AF'};cursor:pointer">
        <span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(label+(sel.length?': '+txt:''))}</span>
        <span style="color:#9CA3AF;transform:rotate(${isOpen?180:0}deg);transition:transform .15s;flex-shrink:0">${ic('chevD','w-4 h-4')}</span>
      </button>
      ${isOpen?`<div data-af="1" style="position:absolute;top:calc(100%+4px);left:0;right:0;background:#fff;border:1.5px solid #E5E7EB;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:100;max-height:220px;overflow-y:auto;padding:6px">
        ${sel.length?`<button data-af="1" onclick="delete S.filters['${key}'];rr()" style="width:100%;text-align:left;padding:6px 10px;font-size:12px;font-weight:600;color:#E11D48;background:none;border:none;cursor:pointer;border-radius:8px">Clear selection</button><div style="height:1px;background:#F3F4F6;margin:4px 0"></div>`:''}
        ${items.map(item=>{const id=getId(item);const nm=getLabel(item)||'?';const on=sel.includes(id);return`<button data-af="1" type="button" onclick="App._togF('${key}','${id}')"
          style="width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:none;cursor:pointer;background:${on?'#F0FDF9':'transparent'};text-align:left">
          <div style="width:16px;height:16px;border-radius:4px;border:1.5px solid ${on?'#10B981':'#D1D5DB'};background:${on?'#10B981':'#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            ${on?`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>`:''}
          </div>
          <span style="font-size:13px;font-weight:${on?600:400};color:${on?'#15171C':'#6B7280'}">${esc(nm)}</span>
        </button>`;}).join('')}
      </div>`:''}
    </div>`;
  }
  

  return`<div class="fade" onclick="(function(e){if(S.afOpen&&!e.target.closest('[data-af]')){S.afOpen=null;rr();}})(event)">
  ${hdr('Analytics','')}
  <!-- Filter bar -->
  <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:14px 16px;margin-bottom:14px;position:sticky;top:0;z-index:20">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${msDropdown('Status','stats',['On Time','Late','Pending Approval','Rejected'],s=>s,s=>s)}
      ${msDropdown('Department','deps',DB.departments,d=>d.name,d=>d.name)}
      ${msDropdown('Team member','users',relevantUsers,u=>u.id,u=>fullName(u))}
      ${DB.locations.length?msDropdown('Location','locs',DB.locations,l=>l.id,l=>l.name):''}
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:220px">
        <input type="date" value="${f.dr1||''}" onchange="S.filters.dr1=this.value;rr()" style="flex:1;background:#F6F7F8;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:13px;outline:none"/>
        <span style="color:#9CA3AF">to</span>
        <input type="date" value="${f.dr2||''}" onchange="S.filters.dr2=this.value;rr()" style="flex:1;background:#F6F7F8;border:1.5px solid #E5E7EB;border-radius:8px;padding:6px 10px;font-size:13px;outline:none"/>
      </div>
      <button onclick="S.filters.issue=f.issue==='yes'?'':'yes';rr()" style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1.5px solid ${f.issue==='yes'?'#FED7AA':'#E5E7EB'};background:${f.issue==='yes'?'#FFF7ED':'#fff'};font-size:13px;font-weight:${f.issue==='yes'?600:400};color:${f.issue==='yes'?'#C2410C':'#9CA3AF'};cursor:pointer">${ic('flag','w-3.5 h-3.5')} Issues only</button>
      ${activeCount?`<button onclick="S.filters={};S.afOpen=null;rr()" style="padding:6px 12px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px;font-weight:600;color:#9CA3AF;background:#fff;cursor:pointer">Clear (${activeCount})</button>`:''}

  <!-- Stats: 5 cards now including missed -->
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px">
    ${statCard('Submitted',subs.length,'sky')}
    ${statCard('On time',byS['On Time']||0,'brand')}
    ${statCard('Late',byS['Late']||0,'rose')}
    ${statCard('Missed',totalMissed,'orange')}
    ${statCard('Issues',flagged,'orange')}
  </div>

  ${_issuesAnalytics(f,fArr)}
  ${_ticketsAnalytics(f,fArr)}

  <!-- Charts -->

  
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:18px">
      <div class="fd" style="font-size:14px;font-weight:700;margin-bottom:14px">Status breakdown</div>
      ${[['On Time','#10B981'],['Late','#EF4444'],['Pending Approval','#F97316'],['Rejected','#9F1239']].map(([k,c])=>{const v=byS[k]||0;const pct=Math.round(v/tot*100);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:600">${k}</span><span style="color:#9CA3AF">${v} · ${pct}%</span></div><div style="height:5px;background:#F3F4F6;border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${c};border-radius:3px"></div></div></div>`;}).join('')}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #F3F4F6">
        <div style="font-size:12px;font-weight:600;color:#9CA3AF;margin-bottom:6px">MISSED (past, no submission)</div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600;color:#F97316">${totalMissed} missed</span><span style="color:#9CA3AF">of ${totalAssigned} assigned in period</span></div>
      </div>
    </div>
    <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;padding:18px">
      <div class="fd" style="font-size:14px;font-weight:700;margin-bottom:14px">Top contributors</div>
      ${topU.slice(0,7).map(({u,n})=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer" onclick="App._userDrill('${u.id}')">${avatar(u,'w-7 h-7','text-[10px]')}<div style="flex:1;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(fullName(u))}</div><span class="fd" style="font-size:15px;font-weight:800">${n}</span><span style="font-size:11px;color:#9CA3AF">&rsaquo;</span></div>`).join('')||'<p style="font-size:13px;color:#9CA3AF">No data yet</p>'}
    </div>
  </div>

  <!-- Table -->
  <div style="background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden">
    <div style="padding:14px 18px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center">

        <td style="padding:9px 16px"><div style="display:flex;align-items:center;gap:7px;cursor:pointer" onclick="event.stopPropagation();App._userDrill('${u.id}')">${avatar(u,'w-7 h-7','text-[10px]')}<span style="font-weight:500;text-decoration:underline;text-decoration-color:#E5E7EB">${esc(fullName(u))}</span></div></td>
        <td style="padding:9px 16px;max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(c.name)}</td>
        <td style="padding:9px 16px;color:#9CA3AF;font-size:12px">${esc(c.department)}</td>
        <td style="padding:9px 16px;color:#9CA3AF;font-size:12px;white-space:nowrap">${fmtS(s.date)}</td>
        <td style="padding:9px 16px">${chip(s.status)}</td>

        <td style="padding:9px 16px">${imgs?`<span style="font-size:12px;font-weight:700;color:#0284C7">📷 ${imgs}</span>`:'<span style="color:#E5E7EB">—</span>'}</td>
      </tr>`;}).join('')}</tbody>
    </table>${recent.length?'':empty('chart','No submissions match','Adjust filters or date range')}</div>
  </div></div>`;
}


App._viewSubById=(id)=>App.viewSub(id);
App._userDrill=(uid)=>{
  const u=uById(uid);if(!u)return;
  let subs=DB.submissions.filter(s=>s.userId===uid);
  const today=todayISO();
  const dr1=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  subs=subs.filter(s=>s.date>=dr1);
  const tot=subs.length;
  const onTime=subs.filter(s=>s.status==='On Time').length;
  const late=subs.filter(s=>s.status==='Late').length;
  const pending=subs.filter(s=>s.status==='Pending Approval').length;
  const rejected=subs.filter(s=>s.status==='Rejected').length;
  const issues=subs.reduce((n,s)=>n+(s.tasks||[]).filter(t=>t.issue).length,0);
  const pct=tot?Math.round(onTime/tot*100):0;
  const recent=subs.slice().sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')).slice(0,10);
  openModal(
    '<div class="p-5" style="max-height:80vh;overflow-y:auto">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'
    +avatar(u,'w-12 h-12','text-sm')
    +'<div><div class="fd" style="font-size:18px;font-weight:800">'+esc(fullName(u))+'</div>'
    +'<div style="font-size:12px;color:#9CA3AF;margin-top:2px">'+esc(u.position)+' · '+esc(u.department)+'</div></div>'
    +'<button onclick="App.closeModal()" style="margin-left:auto;background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:20px">×</button>'
    +'</div>'
    // Score
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'
    +[['Submitted',tot,'#15171C'],['On time',onTime,'#059669'],['Late',late,'#DC2626'],['Pending',pending,'#F97316'],['Rejected',rejected,'#7C3AED'],['Issues',issues,'#EA580C']].map(([l,v,c])=>'<div style="background:#F9FAFB;border-radius:12px;padding:12px;text-align:center"><div class="fd" style="font-size:22px;font-weight:800;color:'+c+'">'+v+'</div><div style="font-size:11px;font-weight:600;color:#9CA3AF;margin-top:2px">'+l+'</div></div>').join('')
    +'</div>'
    // Completion rate bar
    +'<div style="background:#F9FAFB;border-radius:12px;padding:12px;margin-bottom:16px">'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px"><span>On-time rate (last 30d)</span><span style="color:'+(pct>=80?'#059669':pct>=60?'#F97316':'#DC2626')+'">'+pct+'%</span></div>'
    +'<div style="height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=80?'#059669':pct>=60?'#F97316':'#DC2626')+';border-radius:3px;transition:width .5s"></div></div>'
    +'</div>'
    // Recent submissions
    +'<div class="fd" style="font-size:13px;font-weight:700;margin-bottom:8px">Recent submissions</div>'
    +(recent.length
      ? recent.map(s=>{const c=clById(s.checklistId);const iss=(s.tasks||[]).filter(t=>t.issue).length;return'<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer" onclick="App._viewSubById(this.dataset.id)" data-id="'+s.id+'">'+'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+esc(c?.name||'—')+'</div><div style="font-size:11px;color:#9CA3AF;margin-top:1px">'+fmtS(s.date)+'</div></div>'+chip(s.status)+(iss?'<span style="font-size:11px;font-weight:700;color:#F97316;background:#FFF7ED;padding:2px 7px;border-radius:20px">⚑'+iss+'</span>':'')+'</div>';}).join('')
      : '<p style="font-size:13px;color:#9CA3AF">No submissions in last 30 days</p>'
    )
    +'</div>',
    'max-w-md'
  );
};
App._togF=(key,val)=>{
  if(!S.filters)S.filters={};
  if(!S.filters[key])S.filters[key]=[];
  if(!Array.isArray(S.filters[key]))S.filters[key]=[S.filters[key]];
  const idx=S.filters[key].indexOf(val);
  if(idx>-1)S.filters[key].splice(idx,1);
  else S.filters[key].push(val);
  if(!S.filters[key].length)delete S.filters[key];
  S.afOpen=key; // keep dropdown open
  rr();
};

function documentsPage(){

  const isAdm=isAdmin();
  const da=u.docAccess||{departments:{},locations:{}};
  const scopeTab=S.filters.docScope||'dept';
  const folderId=S.filters.docFolder||null; // current folder (null=root)

  // Which departments/locations can this user see?
  const visibleDepts=isAdm
    ?DB.departments.map(d=>d.name)
    :Object.entries(da.departments||{}).filter(([,p])=>p.view).map(([k])=>k);
  const visibleLocs=isAdm
    ?DB.locations.map(l=>l.id)
    :Object.entries(da.locations||{}).filter(([,p])=>p.view).map(([k])=>k);

  // Current scope filter (which dept/loc is selected)
  // Use separate state per tab to prevent cross-contamination
  const scopeKey=(scopeTab==='dept'?S.filters.docDeptKey:S.filters.docLocKey)||(scopeTab==='dept'?visibleDepts[0]:visibleLocs[0])||null;

  // Permissions for current scope
  function perm(type,key){
    if(isAdm)return{view:true,upload:true,download:true,edit:true};
    const map=type==='dept'?da.departments:da.locations;
    return map?.[key]||{};
  }
  const curPerm=perm(scopeTab,scopeKey);

  // Folders and docs in current scope + folder
  const scopeFolders=(DB.folders||[]).filter(f=>f.type===scopeTab&&f.scope===scopeKey&&(f.parentId||null)===(folderId||null));
  const scopeDocs=(DB.documents||[]).filter(d=>d.type===scopeTab&&d.scope===scopeKey&&(d.folderId||null)===(folderId||null));

  // Breadcrumb path
  function buildPath(id){
    if(!id)return[];
    const f=(DB.folders||[]).find(x=>x.id===id);
    if(!f)return[];
    return[...buildPath(f.parentId||null),f];
  }
  const crumbs=buildPath(folderId);

  const scopeLabel=scopeTab==='dept'?scopeKey:(DB.locations.find(l=>l.id===scopeKey)?.name||scopeKey||'');

  return'<div class="fade">'
    +hdr('Documents','')
    // ── Scope tabs (Departments / Locations)
    +'<div style="display:flex;gap:6px;margin-bottom:14px">'
    +[['dept','Departments'],['loc','Locations']].map(([k,l])=>{
      const active=scopeTab===k;
      const cnt=k==='dept'?visibleDepts.length:visibleLocs.length;
      if(!cnt)return'';
      return'<button onclick="App._setDocScope(\''+k+'\')" style="padding:7px 16px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;background:'+(active?'#15171C':'transparent')+';color:'+(active?'#fff':'#6B7280')+'">'+l+'</button>';
    }).join('')
    +'</div>'
    // ── Sub-scope selector (which dept or location)
    +(scopeTab==='dept'&&visibleDepts.length>1
      ?'<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">'
        +visibleDepts.map(d=>'<button onclick="App._setDocScopeKey(\''+d+'\')" style="padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid '+(scopeKey===d?'#15171C':'#ECEDF0')+';background:'+(scopeKey===d?'#15171C':'#fff')+';color:'+(scopeKey===d?'#fff':'#6B7280')+';cursor:pointer">'+esc(d)+'</button>').join('')
        +'</div>'
      :scopeTab==='loc'&&visibleLocs.length>1
        ?'<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">'
          +visibleLocs.map(id=>{const l=DB.locations.find(x=>x.id===id);return'<button onclick="App._setDocScopeKey(\''+id+'\')" style="padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid '+(scopeKey===id?'#15171C':'#ECEDF0')+';background:'+(scopeKey===id?'#15171C':'#fff')+';color:'+(scopeKey===id?'#fff':'#6B7280')+';cursor:pointer">'+esc(l?.name||id)+'</button>';}).join('')
          +'</div>'
        :''
    )
    // ── Breadcrumb
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap">'
    +'<button onclick="App._docNav(null)" style="font-size:13px;font-weight:700;color:'+(folderId?'#0E9F6E':'#15171C')+';background:none;border:none;cursor:pointer;padding:0">'+esc(scopeLabel||'Root')+'</button>'
    +crumbs.map(f=>'<span style="color:#D1D5DB">›</span><button onclick="App._docNav(\''+f.id+'\')" style="font-size:13px;font-weight:700;color:'+(folderId===f.id?'#15171C':'#0E9F6E')+';background:none;border:none;cursor:pointer;padding:0">'+esc(f.name)+'</button>').join('')
    +'</div>'
    // ── Toolbar
    +(scopeKey
      ?'<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'
        +(curPerm.edit||isAdm?'<button onclick="App._newFolder()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:1.5px solid #ECEDF0;background:#fff;font-size:13px;font-weight:600;cursor:pointer">'+ic('folder','w-4 h-4')+'New folder</button>':'')
        +(curPerm.upload||isAdm?'<button onclick="App._uploadDoc()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;background:#15171C;color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer">'+ic('upload','w-4 h-4')+'Upload file</button>':'')
        +'</div>'
      :''
    )
    // ── Empty state
    +(scopeKey===null||scopeKey===undefined
      ?empty('folder','No scope selected','Select a department or location to view documents')
      :(!scopeFolders.length&&!scopeDocs.length
        ?empty('folder','Empty folder','No files yet'+(curPerm.upload||isAdm?' — click Upload to add files':''))
        // ── Folder grid
        :'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">'
          +scopeFolders.map(f=>'<div style="background:#fff;border-radius:14px;border:1px solid #ECEDF0;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:all .15s" onclick="App._docNav(\''+f.id+'\')" onmouseover="this.style.borderColor=\'#0E9F6E\';this.style.boxShadow=\'0 2px 12px rgba(14,159,110,.1)\'" onmouseout="this.style.borderColor=\'#ECEDF0\';this.style.boxShadow=\'\'">'
            +'<div style="font-size:28px">📁</div>'
            +'<div style="font-size:13px;font-weight:700;word-break:break-word">'+esc(f.name)+'</div>'
            +'<div style="font-size:11px;color:#9CA3AF">'+((DB.documents||[]).filter(d=>d.folderId===f.id).length)+' files</div>'
            +(isAdm||curPerm.edit?'<button onclick="event.stopPropagation();App._delFolder(\''+f.id+'\')" style="font-size:11px;color:#DC2626;background:none;border:none;cursor:pointer;padding:0;text-align:left">Delete</button>':'')
            +'</div>'
          ).join('')
          +'</div>'
          // ── Doc list
          +'<div style="background:#fff;border-radius:16px;border:1px solid #ECEDF0;overflow:hidden">'
          +scopeDocs.map((d,i)=>{
            const ext=(d.name.split('.').pop()||'').toLowerCase();
            const icon=ext==='pdf'?'📄':ext.match(/xlsx?|csv/)?'📊':ext.match(/docx?/)?'📝':ext.match(/pptx?/)?'📊':ext.match(/jpe?g|png|gif|webp/)?'🖼':'📎';
            return'<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:'+(i<scopeDocs.length-1?'1px solid #F3F4F6':'none')+'">'
              +'<div style="font-size:24px;flex-shrink:0">'+icon+'</div>'
              +'<div style="flex:1;min-width:0">'
              +'<div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(d.name)+'</div>'
              +'<div style="font-size:11px;color:#9CA3AF;margin-top:2px">'+fmtS(d.uploadedAt?.slice(0,10))+(d.uploaderName?' · '+esc(d.uploaderName):'')+(d.fileSize?' · '+_fmtSize(d.fileSize):'')+'</div>'
              +'</div>'
              +'<div style="display:flex;gap:6px;flex-shrink:0">'
              +(curPerm.download||isAdm?'<button onclick="App._downloadDoc(\''+d.id+'\')" style="padding:6px 12px;border-radius:8px;background:#ECFDF5;color:#0E9F6E;font-size:12px;font-weight:700;border:1px solid #A7F3D0;cursor:pointer">Download</button>':'')
              +(curPerm.view||isAdm?'<button onclick="App._previewDoc(\''+d.id+'\')" style="padding:6px 12px;border-radius:8px;background:#F6F7F8;color:#374151;font-size:12px;font-weight:700;border:1px solid #ECEDF0;cursor:pointer">View</button>':'')
              +(isAdm||curPerm.edit?'<button onclick="App._delDoc(\''+d.id+'\')" style="padding:6px 10px;border-radius:8px;background:#FEE2E2;color:#DC2626;font-size:12px;font-weight:700;border:1px solid #FECACA;cursor:pointer">✕</button>':'')
              +'</div>'
              +'</div>';
          }).join('')
          +'</div>'
      )
    )
    +'</div>';
}

function _fmtSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';return(b/1048576).toFixed(1)+'MB';}

// ── Document navigation & scope helpers ──
App._setDocScope=(s)=>{S.filters.docScope=s;S.filters.docFolder=null;rr();};
App._setDocScopeKey=(k)=>{const t=S.filters.docScope||'dept';if(t==='dept')S.filters.docDeptKey=k;else S.filters.docLocKey=k;S.filters.docFolder=null;rr();};
App._docNav=(id)=>{S.filters.docFolder=id;rr();};
App._docNavId=(id)=>{App._docNav(id);}; // alias for clarity

// ── New folder ──
App._newFolder=()=>{
  const scope=S.filters.docScopeKey;
  if(!scope){toast('Select a department or location first','warn');return;}
  const parent=S.filters.docFolder||null;
  const parentName=parent?(DB.folders||[]).find(f=>f.id===parent)?.name:'Root';
  openModal(
    '<div class="p-6">'
    +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">New folder</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
    +(parent?'<p style="font-size:12px;color:#9CA3AF;margin-bottom:12px">Inside: '+esc(parentName)+'</p>':'')
    +'<div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:6px">Folder name</label>'
    +'<input id="nf-name" type="text" placeholder="e.g. Procurement, Inventory…" class="w-full bg-white border border-ink-200 rounded-xl px-3 py-2.5 text-sm rf" autofocus/></div>'
    +'<div class="flex gap-2">'
    +'<button onclick="App.closeModal()" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid #ECEDF0;background:#fff;font-weight:600;font-size:14px;cursor:pointer">Cancel</button>'
    +'<button onclick="App._createFolder()" style="flex:1;padding:10px;border-radius:10px;background:#15171C;color:#fff;font-weight:600;font-size:14px;border:none;cursor:pointer">Create</button>'
    +'</div></div>',
    'max-w-sm'
  );
};
App._createFolder=()=>{
  if(App._folderCtx._creating)return;
  App._folderCtx._creating=true;
  const createBtn=document.querySelector('[onclick="App._createFolder()"]');
  if(createBtn){createBtn.disabled=true;createBtn.textContent='Creating…';}
  const name=document.getElementById('nf-name')?.value?.trim();
  if(!name){App._folderCtx._creating=false;toast('Enter a folder name','err');if(createBtn){createBtn.disabled=false;createBtn.textContent='Create';}return;}
  const t=S.filters.docScope||'dept';
  const scope=t==='dept'?S.filters.docDeptKey:S.filters.docLocKey;
  if(!scope){App._folderCtx._creating=false;toast('No scope selected','err');if(createBtn){createBtn.disabled=false;createBtn.textContent='Create';}return;}
  if(!DB.folders)DB.folders=[];
  const f={id:uid('fld'),name,type:t,scope,parentId:S.filters.docFolder||null,createdBy:S.uid,createdAt:new Date().toISOString()};
  DB.folders.push(f);
  // Direct Supabase write
  sb.from('doc_folders').insert({id:f.id,name:f.name,parent_id:f.parentId,type:f.type,scope:f.scope,created_by:f.createdBy,created_at:f.createdAt}).catch(e=>console.warn('folder:',e));
  log(fullName(me()),'Created folder',name);
  toast('Folder "'+name+'" created');
  App._folderCtx._creating=false;
  closeModal();saveDB();render();
};
App._delFolder=(id)=>{
  const f=(DB.folders||[]).find(x=>x.id===id);
  if(!confirm('Delete folder "'+f?.name+'" and all its files?'))return;
  // Collect all folder IDs to delete (recursive)
  const toDelete=[];
  function collectRec(fid){
    toDelete.push(fid);
    (DB.folders||[]).filter(x=>x.parentId===fid).forEach(c=>collectRec(c.id));
  }
  collectRec(id);
  // Remove locally first — instant UI
  DB.folders=(DB.folders||[]).filter(x=>!toDelete.includes(x.id));
  DB.documents=(DB.documents||[]).filter(x=>!toDelete.includes(x.folderId));
  log(fullName(me()),'Deleted folder',f?.name||'');
  toast('Deleted','warn');saveDB();render();
  // Delete from Supabase in background
  Promise.all(
    toDelete.map(fid=>sb.from('doc_folders').delete().eq('id',fid))
  ).catch(e=>console.warn('delFolder sync:',e));
};

// ── Upload file ──
App._uploadDoc=()=>{
  const scopeTab=S.filters.docScope||'dept';
  const scopeKey=S.filters.docScopeKey;
  const folderId=S.filters.docFolder||null;
  if(!scopeKey){toast('Select a department or location first','warn');return;}
  openModal(
    '<div class="p-6">'
    +'<div class="flex justify-between mb-4"><h2 class="fd text-xl font-bold">Upload file</h2><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div>'
    +'<div id="ud-dropzone" style="border:2px dashed #D1D5DB;border-radius:16px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px" onclick="document.getElementById(\'ud-file\').click()" ondragover="event.preventDefault();this.style.borderColor=\'#0E9F6E\';this.style.background=\'#F0FDF4\'" ondragleave="this.style.borderColor=\'#D1D5DB\';this.style.background=\'transparent\'" ondrop="App._handleFileDrop(event)">'
    +'<div style="font-size:32px;margin-bottom:8px">📎</div>'
    +'<div style="font-size:14px;font-weight:600;color:#374151">Click to browse or drag & drop</div>'
    +'<div style="font-size:12px;color:#9CA3AF;margin-top:4px">PDF, Word, Excel, PowerPoint, Images — max 50MB</div>'
    +'<input type="file" id="ud-file" style="display:none" onchange="App._previewUpload(this)" multiple>'
    +'</div>'
    +'<div id="ud-preview" style="display:none;margin-bottom:14px"></div>'
    +'<div id="ud-progress" style="display:none;margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:6px">Uploading…</div>'
    +'<div style="height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden"><div id="ud-bar" style="height:100%;background:#0E9F6E;border-radius:3px;width:0%;transition:width .3s"></div></div>'
    +'</div>'
    +'<button id="ud-btn" onclick="App._doUpload()" style="width:100%;padding:12px;border-radius:12px;background:#15171C;color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;display:none">Upload</button>'
    +'</div>',
    'max-w-md'
  );
  App._pendingFiles=null;
};

App._handleFileDrop=(e)=>{
  e.preventDefault();
  document.getElementById('ud-dropzone').style.borderColor='#D1D5DB';
  document.getElementById('ud-dropzone').style.background='transparent';
  App._previewUpload({files:e.dataTransfer.files});
};

App._previewUpload=(input)=>{
  const files=Array.from(input.files||[]);if(!files.length)return;
  App._pendingFiles=files;
  const preview=document.getElementById('ud-preview');
  const btn=document.getElementById('ud-btn');
  if(preview){
    preview.style.display='block';
    preview.innerHTML='<div style="display:flex;flex-direction:column;gap:6px">'+files.map(f=>{
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      const icon=ext==='pdf'?'📄':ext.match(/xlsx?|csv/)?'📊':ext.match(/docx?/)?'📝':'📎';
      return'<div style="display:flex;align-items:center;gap:10px;background:#F6F7F8;border-radius:10px;padding:10px">'
        +'<span style="font-size:20px">'+icon+'</span>'
        +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+esc(f.name)+'</div>'
        +'<div style="font-size:11px;color:#9CA3AF">'+_fmtSize(f.size)+'</div></div>'
        +'</div>';
    }).join('')+'</div>';
  }
  if(btn)btn.style.display='block';
};

App._doUpload=async()=>{
  const files=App._pendingFiles;if(!files?.length){toast('Select a file','err');return;}
  const btn=document.getElementById('ud-btn');
  const prog=document.getElementById('ud-progress');
  const bar=document.getElementById('ud-bar');
  if(btn)btn.style.display='none';
  if(prog)prog.style.display='block';
  const scopeTab=S.filters.docScope||'dept';
  const scopeKey=S.filters.docScopeKey;
  const folderId=S.filters.docFolder||null;
  let done=0;
  for(const file of files){
    const path=scopeTab+'/'+scopeKey+'/'+(folderId||'root')+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{data,error}=await sb.storage.from('documents').upload(path,file,{cacheControl:'3600',upsert:false});
    if(error){toast('Upload failed: '+error.message,'err');if(btn)btn.style.display='block';if(prog)prog.style.display='none';return;}
    const{data:urlData}=sb.storage.from('documents').getPublicUrl(path);
    if(!DB.documents)DB.documents=[];
    DB.documents.push({id:uid('doc'),name:file.name,folderId,type:scopeTab,scope:scopeKey,url:urlData?.publicUrl||path,storagePath:path,fileType:file.type,fileSize:file.size,uploadedBy:S.uid,uploaderName:fullName(me()),uploadedAt:new Date().toISOString()});
    done++;
    if(bar)bar.style.width=Math.round(done/files.length*100)+'%';
  }
  log(fullName(me()),'Uploaded '+done+' file(s)',scopeKey);
  toast('Uploaded '+done+' file'+(done>1?'s':''));
  saveDB();closeModal();render();
};

App._downloadDoc=async(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc)return;
  if(doc.url&&doc.url.startsWith('http')){
    const a=document.createElement('a');a.href=doc.url;a.download=doc.name;a.target='_blank';a.click();return;
  }
  // Signed URL
  const{data,error}=await sb.storage.from('documents').createSignedUrl(doc.storagePath||doc.url,300);
  if(error){toast('Download failed','err');return;}
  const a=document.createElement('a');a.href=data.signedUrl;a.download=doc.name;a.click();
};

App._previewDoc=async(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc)return;
  let url=doc.url;
  if(!url?.startsWith('http')){
    const{data,error}=await sb.storage.from('documents').createSignedUrl(doc.storagePath||doc.url,300);
    if(error){toast('Preview failed','err');return;}
    url=data.signedUrl;
  }
  const ext=(doc.name.split('.').pop()||'').toLowerCase();
  if(ext.match(/jpe?g|png|gif|webp/)){
    openModal('<div class="p-4"><div class="flex justify-between mb-3"><h3 class="fd font-bold">'+esc(doc.name)+'</h3><button onclick="App.closeModal()" class="text-ink-400">'+ic('x')+'</button></div><img src="'+url+'" style="width:100%;border-radius:12px;max-height:70vh;object-fit:contain"/></div>','max-w-2xl');
  } else if(ext==='pdf'){
    window.open(url,'_blank');
  } else {
    window.open(url,'_blank');
  }
};

App._delDoc=(id)=>{
  const doc=(DB.documents||[]).find(x=>x.id===id);if(!doc||!confirm('Delete "'+doc.name+'"?'))return;
  sb.storage.from('documents').remove([doc.storagePath||doc.url]).catch(()=>{});
  DB.documents=(DB.documents||[]).filter(x=>x.id!==id);
  log(fullName(me()),'Deleted doc',doc.name);toast('Deleted','warn');saveDB();render();
};

function settingsPage(){return`<div class="fade max-w-lg">${hdr('Settings','')}<div class="space-y-4"><div class="bg-white rounded-2xl border border-ink-100 shadow-soft p-5"><h3 class="fd font-semibold text-sm mb-3">Workflow</h3>${mkTog('st-ap',true,'Enable approval flow')}${mkTog('st-if',true,'Notify manager on issue flagged')}${mkTog('st-in',true,'In-app notifications')}</div><div class="bg-white rounded-2xl border border-ink-100 shadow-soft p-5"><h3 class="fd font-semibold text-sm mb-3">Data</h3><div class="flex gap-3">${btnG('Export CSV','App._exportCSV()','download')}<button onclick="if(confirm('Reset all workspace data?')){localStorage.removeItem(window.LS_KEY||'shiftly_v3');location.reload();}" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid #FECACA;color:#BE123C;background:#fff;font-weight:600;font-size:14px;cursor:pointer" onmouseover="this.style.background='#FFF1F2'" onmouseout="this.style.background='#fff'">Reset workspace</button></div></div><div class="bg-white rounded-2xl border border-ink-100 shadow-soft p-5"><h3 class="fd font-semibold text-sm mb-3">Stats</h3><div class="grid grid-cols-4 gap-2 text-center">${[['Users',DB.users.length],['Checklists',DB.checklists.length],['Locations',DB.locations.length],['Submissions',DB.submissions.length]].map(([k,v])=>`<div class="bg-ink-50 rounded-xl p-3"><div class="fd text-xl font-bold">${v}</div><div class="text-[10px] text-ink-400 font-medium">${k}</div></div>`).join('')}</div></div></div></div>`;}
